[package]
name = "lpm-workflows"
version = "0.0.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[features]
swift-tests = []

[dependencies]
serde_json = { workspace = true }

# The `[[bin]] socket-probe` declared at the bottom of this file pulls its
# source from `crates/lpm-sandbox/src/bin/socket-probe.rs`. That source uses
# `libc::socket / libc::close / libc::EACCES` inside a
# `#[cfg(target_os = "linux")]` block, so `libc` needs to be in the bin's
# dependency graph on Linux. `dev-dependencies` aren't visible to `[[bin]]`
# targets; a regular `[dependencies]` entry is required. Gated to Linux so
# the bin's no-op probe path on macOS / Windows doesn't pull libc
# unnecessarily.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json", "toml", "filters", "redactions"] }
tempfile = "3"
libc = "0.2"
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
chrono = { workspace = true }
rcgen = { version = "0.13", features = ["pem"] }
reqwest = { workspace = true }
lpm-runtime = { path = "../../crates/lpm-runtime" }
lpm-common = { path = "../../crates/lpm-common" }
lpm-linker = { path = "../../crates/lpm-linker" }
lpm-store = { path = "../../crates/lpm-store" }
lpm-runner = { path = "../../crates/lpm-runner" }
lpm-vault = { path = "../../crates/lpm-vault" }
lpm-lockfile = { path = "../../crates/lpm-lockfile" }
lpm-security = { path = "../../crates/lpm-security" }
lpm-cli = { path = "../../crates/lpm-cli", features = ["internal-test-sigstore-mock"] }
# F.3 install-concurrency test plants a framed orphan WAL record via WalWriter +
# a matching pending-row in manifest.toml so recovery's RolledBack arm fires.
lpm-global = { path = "../../crates/lpm-global" }
tar = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
toml = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
scrypt = { workspace = true }
sha2 = "0.10"
p256 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }

# Workflows-local copy of the `socket-probe` test bin so
# `cargo test -p lpm-workflows` (and CI's `--workspace` run) builds it as
# part of compiling this crate's tests. The bin source lives in
# `lpm-sandbox` because that crate's own integration test
# (`tests/seccomp_socket_deny.rs`) needs it accessible via the same-crate
# `cargo_bin!` macro; declaring `[[bin]]` here with `path = ...` shares the
# file between the two crates (compiled twice, once per owning crate's
# target, but the source is single-sourced).
#
# Without this `[[bin]]` entry, a focused
# `cargo test -p lpm-workflows --test sandbox_udp_denial` build
# does NOT build `workflows-socket-probe`: cargo's dev-dependency
# resolution pulls in the dep crate's lib but not its bins. The
# workflow test's runtime resolver
# (`current_exe().parent().parent().join("workflows-socket-probe")`) then
# fails the `probe.exists()` precondition.
[[bin]]
name = "workflows-socket-probe"
path = "../../crates/lpm-sandbox/src/bin/socket-probe.rs"

[[bin]]
name = "workflows-policy-extension"
path = "src/bin/policy_extension_fixture.rs"

[lints]
workspace = true
