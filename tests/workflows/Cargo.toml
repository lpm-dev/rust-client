[package]
name = "lpm-workflows"
version = "0.0.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[features]
swift-tests = []

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json", "toml", "filters", "redactions"] }
tempfile = "3"
libc = "0.2"
serde_json = { workspace = true }
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
chrono = { workspace = true }
rcgen = { version = "0.13", features = ["pem"] }
reqwest = { workspace = true }
lpm-common = { path = "../../crates/lpm-common" }
lpm-linker = { path = "../../crates/lpm-linker" }
lpm-runner = { path = "../../crates/lpm-runner" }
lpm-vault = { path = "../../crates/lpm-vault" }
lpm-lockfile = { path = "../../crates/lpm-lockfile" }
lpm-security = { path = "../../crates/lpm-security" }
# F.3 install-concurrency test plants a framed orphan WAL record via WalWriter +
# a matching pending-row in manifest.toml so recovery's RolledBack arm fires.
lpm-global = { path = "../../crates/lpm-global" }
tar = { workspace = true }
flate2 = { workspace = true }
toml = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
scrypt = { workspace = true }
sha2 = "0.10"
p256 = { workspace = true }
hex = { workspace = true }
