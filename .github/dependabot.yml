# Dependabot config — keep SHA-pinned GitHub Actions current.
#
# Why this file matters (H14 in the cross-repo security findings):
# every `uses: <action>@<sha>` in `.github/workflows/*.yml` is pinned
# to a 40-char commit SHA rather than a floating `@v5` / `@stable`
# tag, so a compromised upstream tag (the tj-actions/changed-files
# class of attack) cannot inject code into our release pipeline. The
# trade-off is that SHA pins go stale; without an upgrade mechanism
# they would either drift (security patches we miss) or get bumped
# by hand (error-prone). This config tells Dependabot to open a PR
# whenever an action publishes a new release, including the new SHA
# in the suggested diff.
#
# Review every Dependabot PR by:
#   1. confirming the new SHA corresponds to the tagged release on
#      the action's GitHub page (the PR body shows the comparison),
#   2. checking the action's repo for any security advisories,
#   3. merging via the normal CI gate (only after green).
#
# `target-branch` is implicitly the default branch.
#
# Each ecosystem's security updates come as one grouped pull request.
# `main` requires branches to be up to date, so every separate pull
# request would cost its own CI round.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    # Group all routine GHA bumps into one PR — keeps review burden
    # low and lets us merge the whole batch with a single CI run.
    groups:
      gha-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      gha-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:20"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    groups:
      # The committed Windows bindings need windows-bindgen to match
      # windows-core and windows-future, so all windows-rs crates, windows-sys
      # included, move in one pull request. The group takes every update type,
      # so a release like 0.3 -> 0.100 is grouped too. Dependabot puts a crate
      # in the first group it matches, so this group must stay above the one
      # below.
      windows-rs:
        applies-to: version-updates
        patterns:
          - "windows-*"
        exclude-patterns:
          - "windows-native-keyring-store"
      # lpm-cli, lpm-runner and lpm-security pin every oxc crate to one
      # release, and vendor/oxc_parser patches the parser for all of them, so
      # a bump of any one alone can't build. Each release also needs that
      # patch carried over by hand (vendor/oxc_parser/LPM-PATCH.md). This
      # group must stay above the one below too.
      oxc:
        applies-to: version-updates
        patterns:
          - "oxc_*"
      rust-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/npm/cli"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:40"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    ignore:
      - dependency-name: "@lpm-registry/cli-*"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/crates/lpm-cli/dashboard-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    groups:
      dashboard-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      dashboard-security:
        applies-to: security-updates
        patterns:
          - "*"

  # The fuzz harness has a lockfile of its own. It gets grouped security
  # updates and no version updates.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    groups:
      fuzz-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Test and bench fixtures are inputs that tests read exactly as committed,
  # and a vendored crate's Cargo.lock is its upstream copy, which the
  # workspace build never reads. `ignore` governs security updates too, so
  # Dependabot opens no pull requests that rewrite these files. Their alerts
  # still show on the Security tab.
  - package-ecosystem: "npm"
    directories:
      - "/bench/**"
      - "/tests/fixtures/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: "cargo"
    directories:
      - "/vendor/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
