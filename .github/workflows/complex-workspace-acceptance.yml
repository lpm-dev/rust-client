name: Complex workspace acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/complex-workspace-acceptance.yml'
      - 'Cargo.lock'
      - 'crates/lpm-cli/src/commands/install/**'
      - 'crates/lpm-cli/src/install_state.rs'
      - 'crates/lpm-cli/src/workspace*.rs'
      - 'crates/lpm-resolver/**'
      - 'crates/lpm-linker/**'
      - 'crates/lpm-lockfile/**'
      - 'crates/lpm-store/**'
      - 'crates/lpm-workspace/**'
      - 'tests/workflows/tests/workspace_acceptance.rs'
      - 'tests/fixtures/complex-workspace-portable/**'
      - 'scripts/ci/test-complex-workspace-consumer.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.94.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-workspace-acceptance-1.94.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-upgrade-1.94.0-
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-apt-packages.sh pkg-config libdbus-1-dev
      - name: Build the current CLI
        run: cargo build --locked -p lpm-cli
      - name: Record deterministic workspace scenarios
        env:
          LPM_WORKSPACE_ACCEPTANCE_EVIDENCE: ${{ runner.temp }}/workspace-evidence
        run: |
          set -o pipefail
          cargo test --locked -p lpm-workflows --test workspace_acceptance -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/workspace-matrix.log"
      - name: Replay the macOS lockfile with native npm dependencies
        if: always()
        run: |
          python3 -c "from pathlib import Path; import subprocess; p='tests/fixtures/complex-workspace-portable/lpm.lock'; Path(p).write_bytes(subprocess.check_output(['git','show','HEAD:'+p]))"
          binary=target/debug/lpm-rs
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python3 scripts/ci/test-complex-workspace-consumer.py --binary "$binary" --fixture tests/fixtures/complex-workspace-portable --output "$RUNNER_TEMP/native-consumer"
      - name: Archive evidence and command results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complex-workspace-${{ matrix.os }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/workspace-matrix.log
            ${{ runner.temp }}/workspace-evidence
            ${{ runner.temp }}/native-consumer/*.log
            ${{ runner.temp }}/native-consumer/results.json
            ${{ runner.temp }}/native-consumer/portable-fixture
