name: Release upgrade compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/lpm-auth/**'
      - 'crates/lpm-cli/src/commands/self_update*'
      - 'crates/lpm-cli/src/commands/self_update/**'
      - 'crates/lpm-cli/src/release_lookup.rs'
      - 'crates/lpm-cli/tests/fixtures/release_manifests/**'
      - 'crates/lpm-cli/tests/fixtures/sigstore_bundles/21-real-lpm-release-*'
      - 'scripts/ci/verify-release-signing-policy.sh'
      - 'scripts/ci/test-verify-release-signing-policy.sh'
      - 'install.sh'
      - 'tests/install-sh/**'
      - 'scripts/ci/macos-developer-tools.sh'
      - '.github/workflows/release-upgrade-compatibility.yml'
  # Apple's ticket service and the latest releases change without a commit
  # here, so these checks also run daily.
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-upgrade-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  compatibility:
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99.1'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-upgrade-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-upgrade-1.99.1-
      - name: Linux native credential dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-apt-packages.sh pkg-config libdbus-1-dev fish
      - name: Native auth key recovery tests
        if: runner.os != 'Windows'
        run: cargo test --locked -p lpm-auth --lib
      - name: Windows auth key recovery regressions
        if: runner.os == 'Windows'
        run: |
          cargo test --locked -p lpm-auth --lib unavailable_keyring
          cargo test --locked -p lpm-auth --lib conflicting_keyring_key_preserves_the_authenticated_file_key
          cargo test --locked -p lpm-auth --lib existing_credentials_without_an_auth_key_fail_closed
          cargo test --locked -p lpm-auth --lib lone_wrong_auth_key_does_not_claim_the_credential_store
      - name: Native updater tests
        if: always()
        run: cargo test --locked -p lpm-cli --bin lpm-rs self_update -- --test-threads=1
      - name: Shell installer regressions
        if: always() && runner.os != 'Windows'
        run: sh tests/install-sh/run.sh
      - name: Real Linux headless credential upgrade
        if: always() && runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo build --locked -p lpm-cli
          mkdir -p "$RUNNER_TEMP/old-cli"
          gh release download v0.76.5 --repo lpm-dev/rust-client --dir "$RUNNER_TEMP/old-cli" --pattern lpm-linux-x64 --pattern SHA256SUMS.txt
          (cd "$RUNNER_TEMP/old-cli" && grep '  lpm-linux-x64$' SHA256SUMS.txt | sha256sum --check)
          chmod +x "$RUNNER_TEMP/old-cli/lpm-linux-x64"
          python3 scripts/ci/test-headless-auth-upgrade.py "$RUNNER_TEMP/old-cli/lpm-linux-x64" target/debug/lpm-rs
      - name: Release signing-policy gate
        if: always() && runner.os == 'Linux'
        run: |
          cargo build --locked -p lpm-cli
          bash scripts/ci/test-verify-release-signing-policy.sh target/debug/lpm-rs
      - name: Validate real signed macOS releases
        if: always() && runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in v0.76.5 v0.77.0-nightly.20260909.177.e3196a5; do
            mkdir -p "$RUNNER_TEMP/$tag"
            gh release download "$tag" --repo lpm-dev/rust-client --dir "$RUNNER_TEMP/$tag" --pattern lpm-darwin-arm64.zip --pattern SHA256SUMS.txt
            (cd "$RUNNER_TEMP/$tag" && grep '  lpm-darwin-arm64.zip$' SHA256SUMS.txt | shasum -a 256 --check)
          done
          export LPM_TEST_MACOS_RELEASE_ARCHIVES="$RUNNER_TEMP/v0.76.5/lpm-darwin-arm64.zip:$RUNNER_TEMP/v0.77.0-nightly.20260909.177.e3196a5/lpm-darwin-arm64.zip"
          cargo test --locked -p lpm-cli --bin lpm-rs signed_macos_releases_pass_validation -- --ignored --nocapture

  # Every hosted macOS runner has Xcode and the Command Line Tools, which
  # LPM's users mostly don't. These checks run with neither, and with only the
  # Command Line Tools, against real signed releases.
  macos-without-developer-tools:
    name: macOS with developer tools ${{ matrix.developer-tools }}
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        developer-tools: [none, command-line-tools]
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # A standalone install whose updater runs /usr/bin/stapler.
      AFFECTED_VERSION: v0.85.0
      # The last stable release whose updater needs Xcode.
      LAST_UPDATER_NEEDING_XCODE: 0.88.0
      DEVELOPER_TOOLS: ${{ matrix.developer-tools }}
      # Older than every release, so this build updates to each of them.
      FIXED_BUILD_VERSION: 0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99.1'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-upgrade-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-upgrade-1.99.1-

      - name: Build this updater and its signed-release tests
        run: |
          set -euo pipefail
          tests=$(cargo test --locked -p lpm-cli --bin lpm-rs --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .target.name == "lpm-rs") | .executable')
          test -x "$tests"
          LPM_BUILD_VERSION="$FIXED_BUILD_VERSION" cargo build --locked -p lpm-cli --bin lpm-rs
          mkdir -p "$RUNNER_TEMP/fixed"
          cp target/debug/lpm-rs "$RUNNER_TEMP/fixed/lpm-rs"
          test "$(LPM_NO_UPDATE_CHECK=1 "$RUNNER_TEMP/fixed/lpm-rs" --version | sed -n 1p)" = "lpm $FIXED_BUILD_VERSION"
          echo "SELF_UPDATE_TESTS=$tests" >> "$GITHUB_ENV"

      - name: Download real signed releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_stable=$(gh release view --repo lpm-dev/rust-client --json tagName --jq .tagName)
          latest_nightly=$(gh release list --repo lpm-dev/rust-client --limit 30 --json tagName,isPrerelease \
            --jq 'map(select(.isPrerelease)) | .[0].tagName')
          archives=""
          for tag in v0.76.5 v0.77.0-nightly.20260909.177.e3196a5; do
            mkdir -p "$RUNNER_TEMP/releases/$tag"
            gh release download "$tag" --repo lpm-dev/rust-client --dir "$RUNNER_TEMP/releases/$tag" \
              --pattern lpm-darwin-arm64.zip --pattern SHA256SUMS.txt
            (cd "$RUNNER_TEMP/releases/$tag" && grep '  lpm-darwin-arm64.zip$' SHA256SUMS.txt | shasum -a 256 --check)
            archives="${archives:+$archives:}$RUNNER_TEMP/releases/$tag/lpm-darwin-arm64.zip"
          done
          {
            echo "LATEST_STABLE=$latest_stable"
            echo "LATEST_NIGHTLY=$latest_nightly"
            echo "LPM_TEST_MACOS_RELEASE_ARCHIVES=$archives"
          } >> "$GITHUB_ENV"

      - name: Remove developer tools
        run: bash scripts/ci/macos-developer-tools.sh hide "$DEVELOPER_TOOLS" "$RUNNER_TEMP/developer-tools"

      - name: This updater verifies real signed releases
        run: |
          unset DEVELOPER_DIR
          "$SELF_UPDATE_TESTS" --ignored --test-threads=1 signed_macos_release

      - name: Fresh install through the official installer
        run: |
          set -euo pipefail
          unset DEVELOPER_DIR
          rm -rf "$HOME/.lpm"
          env PATH=/usr/bin:/bin:/usr/sbin:/sbin SHELL=/bin/zsh sh install.sh
          test "$(LPM_NO_UPDATE_CHECK=1 "$HOME/.lpm/bin/lpm" --version | sed -n 1p)" = "lpm ${LATEST_STABLE#v}"

      - name: In-place upgrade of an affected install through the official installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset DEVELOPER_DIR
          rm -rf "$HOME/.lpm"
          lpm="$HOME/.lpm/bin/lpm"
          env PATH=/usr/bin:/bin:/usr/sbin:/sbin SHELL=/bin/zsh \
            LPM_INSTALL_VERSION="$AFFECTED_VERSION" LPM_INSTALL_MIN_VERSION_OVERRIDE=1 sh install.sh
          test "$(LPM_NO_UPDATE_CHECK=1 "$lpm" --version | sed -n 1p)" = "lpm ${AFFECTED_VERSION#v}"
          "$lpm" config release-age --set 3d
          printf 'kept across upgrades\n' > "$HOME/.lpm/upgrade-sentinel"
          if "$lpm" self-update > "$RUNNER_TEMP/affected-self-update.log" 2>&1; then
            cat "$RUNNER_TEMP/affected-self-update.log"
            echo "::error::$AFFECTED_VERSION updated itself, so developer tools were not removed"
            exit 1
          fi
          grep -q 'notarization-ticket validation failed' "$RUNNER_TEMP/affected-self-update.log" \
            || { cat "$RUNNER_TEMP/affected-self-update.log"; exit 1; }
          (cd "$HOME/.lpm" && find . -type f ! -path './bin/*' ! -path './libexec/*' -print0 \
            | xargs -0 shasum -a 256) > "$RUNNER_TEMP/settings"
          env PATH=/usr/bin:/bin:/usr/sbin:/sbin SHELL=/bin/zsh sh install.sh
          (cd "$HOME/.lpm" && shasum -a 256 --check --quiet "$RUNNER_TEMP/settings")
          test "$(LPM_NO_UPDATE_CHECK=1 "$lpm" --version | sed -n 1p)" = "lpm ${LATEST_STABLE#v}"
          grep -q 'release' "$HOME/.lpm/config.toml"
          test "$(grep -c '\.lpm/bin' "$HOME/.zshrc")" -eq 1

      - name: The latest stable release's own updater takes the newest nightly
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset DEVELOPER_DIR
          lpm="$HOME/.lpm/bin/lpm"
          status=0
          "$lpm" self-update --channel nightly --refresh > "$RUNNER_TEMP/latest-self-update.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/latest-self-update.log"
          latest="${LATEST_STABLE#v}"
          if [ "$(printf '%s\n%s\n' "$latest" "$LAST_UPDATER_NEEDING_XCODE" | sort -V | tail -n 1)" = "$LAST_UPDATER_NEEDING_XCODE" ]; then
            test "$status" -ne 0
            grep -q 'notarization-ticket validation failed' "$RUNNER_TEMP/latest-self-update.log"
            echo "::notice::$LATEST_STABLE still needs Xcode to update; its users recover through the installer"
          else
            test "$status" -eq 0
            test "$(LPM_NO_UPDATE_CHECK=1 "$lpm" --version | sed -n 1p)" = "lpm ${LATEST_NIGHTLY#v}"
          fi

      - name: Self-update from this build to the latest signed releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset DEVELOPER_DIR
          lpm="$HOME/.lpm/bin/lpm"
          app="$HOME/.lpm/libexec/LPM CLI.app"
          (cd "$HOME/.lpm" && find . -type f ! -path './bin/*' ! -path './libexec/*' ! -name update-check.json -print0 \
            | xargs -0 shasum -a 256) > "$RUNNER_TEMP/settings"
          for channel in stable nightly; do
            rm -rf "$app"
            mkdir -p "$app/Contents/MacOS"
            cp "$RUNNER_TEMP/fixed/lpm-rs" "$app/Contents/MacOS/lpm-rs"
            test "$(LPM_NO_UPDATE_CHECK=1 "$lpm" --version | sed -n 1p)" = "lpm $FIXED_BUILD_VERSION"
            "$lpm" self-update --channel "$channel" --refresh
            if [ "$channel" = stable ]; then expected="$LATEST_STABLE"; else expected="$LATEST_NIGHTLY"; fi
            test "$(LPM_NO_UPDATE_CHECK=1 "$lpm" --version | sed -n 1p)" = "lpm ${expected#v}"
            /usr/bin/codesign --verify --strict \
              -R '=anchor apple generic and certificate leaf[subject.OU] = "823S8YKMRW" and notarized' "$app"
          done
          (cd "$HOME/.lpm" && shasum -a 256 --check --quiet "$RUNNER_TEMP/settings")

      - name: Restore developer tools
        if: always()
        run: bash scripts/ci/macos-developer-tools.sh restore "$RUNNER_TEMP/developer-tools"
