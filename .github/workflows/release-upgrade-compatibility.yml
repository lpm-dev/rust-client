name: Release upgrade compatibility

on:
  push:
    branches: [codex/release-upgrade-recovery]
  pull_request:
    paths:
      - 'crates/lpm-auth/**'
      - 'crates/lpm-cli/src/commands/self_update*'
      - 'crates/lpm-cli/src/commands/self_update/**'
      - 'install.sh'
      - 'tests/install-sh/**'
      - '.github/workflows/release-upgrade-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: '1.94.0'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-upgrade-1.94.0-${{ hashFiles('Cargo.lock') }}
      - name: Linux native credential dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-apt-packages.sh pkg-config libdbus-1-dev fish
      - name: Native auth key recovery tests
        run: cargo test --locked -p lpm-auth --lib
      - name: Native updater tests
        if: always()
        run: cargo test --locked -p lpm-cli --bin lpm-rs self_update -- --test-threads=1
      - name: Shell installer regressions
        if: always() && runner.os != 'Windows'
        run: sh tests/install-sh/run.sh
