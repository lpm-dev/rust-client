name: Release upgrade compatibility

on:
  pull_request:
    paths:
      - 'crates/lpm-auth/**'
      - 'crates/lpm-cli/src/commands/self_update*'
      - 'crates/lpm-cli/src/commands/self_update/**'
      - 'install.sh'
      - 'tests/install-sh/**'
      - '.github/workflows/release-upgrade-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-upgrade-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: '1.94.0'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-upgrade-1.94.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-upgrade-1.94.0-
      - name: Linux native credential dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-apt-packages.sh pkg-config libdbus-1-dev fish
      - name: Native auth key recovery tests
        if: runner.os != 'Windows'
        run: cargo test --locked -p lpm-auth --lib
      - name: Windows auth key recovery regressions
        if: runner.os == 'Windows'
        run: |
          cargo test --locked -p lpm-auth --lib unavailable_keyring
          cargo test --locked -p lpm-auth --lib conflicting_keyring_key_preserves_the_authenticated_file_key
          cargo test --locked -p lpm-auth --lib existing_credentials_without_an_auth_key_fail_closed
          cargo test --locked -p lpm-auth --lib lone_wrong_auth_key_does_not_claim_the_credential_store
      - name: Native updater tests
        if: always()
        run: cargo test --locked -p lpm-cli --bin lpm-rs self_update -- --test-threads=1
      - name: Shell installer regressions
        if: always() && runner.os != 'Windows'
        run: sh tests/install-sh/run.sh
      - name: Real Linux headless credential upgrade
        if: always() && runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo build --locked -p lpm-cli
          mkdir -p "$RUNNER_TEMP/old-cli"
          gh release download v0.76.5 --repo lpm-dev/rust-client --dir "$RUNNER_TEMP/old-cli" --pattern lpm-linux-x64 --pattern SHA256SUMS.txt
          (cd "$RUNNER_TEMP/old-cli" && grep '  lpm-linux-x64$' SHA256SUMS.txt | sha256sum --check)
          chmod +x "$RUNNER_TEMP/old-cli/lpm-linux-x64"
          python3 scripts/ci/test-headless-auth-upgrade.py "$RUNNER_TEMP/old-cli/lpm-linux-x64" target/debug/lpm-rs
      - name: Validate real signed macOS releases
        if: always() && runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in v0.76.5 v0.77.0-nightly.20260909.177.e3196a5; do
            mkdir -p "$RUNNER_TEMP/$tag"
            gh release download "$tag" --repo lpm-dev/rust-client --dir "$RUNNER_TEMP/$tag" --pattern lpm-darwin-arm64.zip --pattern SHA256SUMS.txt
            (cd "$RUNNER_TEMP/$tag" && grep '  lpm-darwin-arm64.zip$' SHA256SUMS.txt | shasum -a 256 --check)
          done
          export LPM_TEST_MACOS_RELEASE_ARCHIVES="$RUNNER_TEMP/v0.76.5/lpm-darwin-arm64.zip:$RUNNER_TEMP/v0.77.0-nightly.20260909.177.e3196a5/lpm-darwin-arm64.zip"
          cargo test --locked -p lpm-cli --bin lpm-rs signed_macos_releases_pass_validation -- --ignored --nocapture
