name: Published release consumer acceptance

on:
  push:
    branches: [codex/release-install-acceptance]

permissions:
  contents: read

jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
      - name: Pin npm consumer version
        run: npm install --global npm@11.12.1 --no-audit --no-fund
      - name: Exercise published installers and updates
        env:
          LPM_RELEASE_ACCEPTANCE_DISPOSABLE: "1"
          LPM_RELEASE_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/release-consumer
        run: python scripts/ci/release-consumer-acceptance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-consumer-${{ matrix.os }}
          path: ${{ runner.temp }}/release-consumer/*.json
