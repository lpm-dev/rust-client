name: Release trust

# Installed copies of LPM check every update with code they can never
# change, against keys and records that Apple and Sigstore keep changing.
# These checks watch the published releases from the outside every day:
#
# - Apple still vouches for the current stable and nightly macOS apps: the
#   notarization ticket stands and the Developer ID certificate isn't
#   revoked. Clients check the stapled ticket offline and can't see either.
# - Sigstore still serves the trust root built into LPM, so releases ship
#   Sigstore's current keys.
# - A signature made through Sigstore's production Rekor v2 log, with an
#   RFC 3161 timestamp, verifies in LPM, before npm, GitHub or LPM's own
#   releases start signing that way.
# - The latest stable updates itself to the newest nightly, so a signing or
#   packaging change on main that installed updaters would refuse fails
#   here before a stable release carries it. Until the first nightly after a
#   stable release, the stable before it updates to it instead.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/lpm-cli/assets/sigstore_*'
      - 'crates/lpm-cli/src/sigstore_verify/**'
      - 'scripts/ci/previous-stable-update-gate.sh'
      - 'scripts/ci/semver-newer.py'
      - 'scripts/ci/sigstore-rekor-v2-signing-config.py'
      - 'scripts/ci/sigstore-signed-time.py'
      - 'scripts/ci/with-apple-service-retry.sh'
      - '.github/workflows/release-trust.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-trust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  apple:
    name: Apple vouches for the current macOS apps
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check each current release with Apple
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=$(curl -fsSL --retry 3 https://registry.npmjs.org/-/package/@lpm-registry/cli/dist-tags)
          failed=0
          for channel in latest nightly; do
            version=$(jq -er --arg channel "$channel" '.[$channel]' <<<"$tags")
            release="$RUNNER_TEMP/v$version"
            mkdir -p "$release"
            gh release download "v$version" --repo lpm-dev/rust-client --dir "$release" \
              --pattern SHA256SUMS.txt --pattern 'lpm-darwin-*.zip'
            for asset in lpm-darwin-arm64.zip lpm-darwin-x64.zip; do
              archive="$release/$asset"
              if [ ! -f "$archive" ]; then
                echo "::error::v$version has no $asset"
                failed=1
                continue
              fi
              (cd "$release" && awk -v asset="$asset" '$2 == asset' SHA256SUMS.txt | shasum -a 256 --check --strict)
              unpacked="$RUNNER_TEMP/unpacked/v$version/${asset%.zip}"
              mkdir -p "$unpacked"
              ditto -x -k "$archive" "$unpacked"
              app="$unpacked/LPM CLI.app"
              echo "::group::v$version $asset"
              if /usr/bin/codesign --verify --strict --verbose=2 "$app" &&
                scripts/ci/with-apple-service-retry.sh stapler validate "$app" &&
                /usr/sbin/spctl --assess --type execute --verbose=4 "$app"; then
                echo "Apple vouches for v$version $asset"
              else
                echo "::error::Apple no longer vouches for v$version $asset. Installed copies that update to it, and the installer, will refuse it."
                failed=1
              fi
              echo "::endgroup::"
            done
          done
          exit "$failed"

  sigstore:
    name: Sigstore's live trust root and Rekor v2 log work with LPM
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Signs through Sigstore with this workflow's identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99.1'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-trust-sigstore-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-trust-sigstore-1.99.1-

      - name: Install Linux build dependencies
        run: bash scripts/ci/install-apt-packages.sh pkg-config libdbus-1-dev

      - name: Refresh from Sigstore's live repository
        run: |
          set -euo pipefail
          cargo test --locked -p lpm-cli --bin lpm-rs -- --ignored --exact \
            sigstore_verify::trust_store::tests::sigstores_live_repository_serves_the_built_in_trust_root \
            | tee "$RUNNER_TEMP/sigstore-live.log"
          # A renamed test would match nothing, and cargo passes an empty run.
          grep -q '^test result: ok. 1 passed' "$RUNNER_TEMP/sigstore-live.log"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.0.6"

      - name: Sign through Sigstore's production Rekor v2 log
        run: |
          set -euo pipefail
          signed="$RUNNER_TEMP/rekor-v2"
          mkdir -p "$signed"
          python3 -I scripts/ci/sigstore-rekor-v2-signing-config.py "$signed/signing-config.json"
          printf 'release trust check %s %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$signed/subject.txt"
          printf '{"check":"rekor-v2"}\n' > "$signed/predicate.json"
          cosign attest-blob --yes \
            --signing-config "$signed/signing-config.json" \
            --type https://cli.lpm.dev/release-trust/rekor-v2 \
            --predicate "$signed/predicate.json" \
            --bundle "$signed/bundle.sigstore.json" \
            "$signed/subject.txt"
          kind=$(jq -er '.verificationMaterial.tlogEntries[0].kindVersion | "\(.kind) \(.version)"' \
            "$signed/bundle.sigstore.json")
          if [ "$kind" != "hashedrekord 0.0.2" ]; then
            echo "::error::Sigstore's signing config logged the signature as $kind, not to Rekor v2"
            exit 1
          fi

      - name: Verify the Rekor v2 bundle with LPM
        run: |
          set -euo pipefail
          signed="$RUNNER_TEMP/rekor-v2"
          LPM_LIVE_REKOR_V2_BUNDLE="$signed/bundle.sigstore.json" \
          LPM_LIVE_REKOR_V2_SUBJECT_SHA256=$(sha256sum "$signed/subject.txt" | cut -d' ' -f1) \
            cargo test --locked -p lpm-cli --bin lpm-rs -- --ignored --exact \
            sigstore_verify::tests::rekor_v2::a_bundle_signed_through_sigstores_live_rekor_v2_log_verifies \
            | tee "$RUNNER_TEMP/rekor-v2-live.log"
          grep -q '^test result: ok. 1 passed' "$RUNNER_TEMP/rekor-v2-live.log"

      - name: Keep the Rekor v2 bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rekor-v2-bundle
          path: ${{ runner.temp }}/rekor-v2/
          if-no-files-found: ignore
          retention-days: 14

  previous-stable-updates-to-newest:
    name: Latest stable updates itself to the newest release (${{ matrix.runner }})
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: lpm-linux-x64
          - runner: ubuntu-24.04-arm
            asset: lpm-linux-arm64
          - runner: macos-15
            asset: lpm-darwin-arm64.zip
          - runner: macos-15-intel
            asset: lpm-darwin-x64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release to update to
        env:
          ASSET: ${{ matrix.asset }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=$(curl -fsSL --retry 3 https://registry.npmjs.org/-/package/@lpm-registry/cli/dist-tags)
          stable=$(jq -er .latest <<<"$tags")
          nightly=$(jq -er .nightly <<<"$tags")
          nightly_is_newer=$(python3 -I scripts/ci/semver-newer.py "$nightly" "$stable")
          if [ "$nightly_is_newer" = yes ]; then
            target=$nightly
            channel=nightly
            previous=$stable
          else
            # Until the next nightly, the newest one predates the latest
            # stable, so check the update to that stable from the one before.
            target=$stable
            channel=stable
            previous=$(gh release list --repo lpm-dev/rust-client --exclude-drafts --exclude-pre-releases \
              --limit 2 --json tagName --jq '.[1].tagName')
            previous=${previous#v}
          fi
          release="$RUNNER_TEMP/release"
          gh release download "v$target" --repo lpm-dev/rust-client --dir "$release" \
            --pattern SHA256SUMS.txt --pattern SHA256SUMS.txt.sigstore --pattern "$ASSET"
          gh release view "v$target" --repo lpm-dev/rust-client --json targetCommitish,publishedAt \
            > "$RUNNER_TEMP/release.json"
          {
            echo "TARGET_VERSION=$target"
            echo "TARGET_CHANNEL=$channel"
            echo "TARGET_COMMIT=$(jq -er .targetCommitish "$RUNNER_TEMP/release.json")"
            echo "TARGET_PUBLISHED_AT=$(jq -er .publishedAt "$RUNNER_TEMP/release.json")"
            echo "TARGET_RELEASE=$release"
            echo "PREVIOUS_VERSION=$previous"
          } >> "$GITHUB_ENV"

      - name: Update the previous stable to it through its own updater
        run: >-
          scripts/ci/previous-stable-update-gate.sh
          --previous "$PREVIOUS_VERSION"
          --published-at "$TARGET_PUBLISHED_AT"
          "$TARGET_RELEASE" "$TARGET_VERSION" "$TARGET_COMMIT" "$TARGET_CHANNEL"

      - name: Restore developer tools after the update gate
        if: always() && runner.os == 'macOS'
        run: bash scripts/ci/macos-developer-tools.sh restore "$RUNNER_TEMP/previous-stable-gate-developer-tools"
