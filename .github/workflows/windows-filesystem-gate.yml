name: Windows filesystem gate

on:
  workflow_call:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.94.0"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  verify:
    name: Windows filesystem release gate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-filesystem-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-filesystem-${{ env.RUST_TOOLCHAIN }}-

      - name: Install nextest
        uses: taiki-e/install-action@9c6953334daacc48e55a35db9a19c771f79ffa9d # nextest

      - name: Install Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Build Windows CLI
        run: cargo build --locked -p lpm-cli

      - name: Windows filesystem crate tests
        run: cargo nextest run --locked -p lpm-cert -p lpm-common -p lpm-extractor -p lpm-linker -p lpm-store -p lpm-global -p lpm-sandbox --no-fail-fast --status-level slow --final-status-level fail

      - name: Windows CLI filesystem unit tests
        run: cargo test --locked -p lpm-cli --bin lpm-rs remove_owned_cmd_shim

      - name: Windows install and bin-shim workflows
        run: >-
          cargo nextest run --locked -p lpm-workflows
          -E 'test(install_single_package_via_mock_registry) |
          test(install_creates_bin_symlink_for_binary_package) |
          test(install_v2_bin_shim_resolves_project_context_from_transitive_runtime) |
          test(uninstall_then_reinstall_same_packages_reports_only_readded_direct_deps) |
          test(uninstall_scoped_package_removes_owned_bin_shim)'
          --no-fail-fast --status-level slow --final-status-level fail
