name: Windows filesystem gate

on:
  workflow_call:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.94.0"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  verify:
    name: Windows filesystem release gate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-filesystem-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-filesystem-${{ env.RUST_TOOLCHAIN }}-

      - name: Install nextest
        uses: taiki-e/install-action@9c6953334daacc48e55a35db9a19c771f79ffa9d # nextest

      - name: Install Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Build Windows CLI
        run: cargo build --locked -p lpm-cli -p lpm-sandbox

      - name: Windows standard-user sandbox setup and publish
        shell: pwsh
        run: ./scripts/ci/test-windows-sandbox-setup.ps1

      - name: Configure the runner Node installation for sandboxed hooks
        shell: pwsh
        run: target/debug/lpm-rs.exe doctor sandbox-setup --project . --tool-dir (Split-Path (Get-Command node).Source) --apply --yes --json

      - name: Windows sandbox setup CLI contracts
        run: cargo nextest run --locked -p lpm-workflows --test doctor_sandbox_setup --no-fail-fast

      - name: Windows filesystem crate tests
        run: >-
          cargo nextest run --locked
          -p lpm-cert -p lpm-common -p lpm-extractor -p lpm-linker
          -p lpm-store -p lpm-global -p lpm-sandbox
          -E 'not (test(extract_accepts_exact_max_file_count) |
          test(extract_rejects_more_than_max_file_count))'
          --no-fail-fast --status-level slow --final-status-level fail

      - name: Windows extractor file-count stress tests
        run: >-
          cargo nextest run --locked -p lpm-extractor
          -E 'test(extract_accepts_exact_max_file_count) |
          test(extract_rejects_more_than_max_file_count)'
          --test-threads=1
          --no-fail-fast --status-level slow --final-status-level fail

      - name: Windows CLI filesystem unit tests
        run: |
          cargo test --locked -p lpm-cli --bin lpm-rs remove_owned_cmd_shim
          cargo test --locked -p lpm-cli --bin lpm-rs directory_transaction
          cargo test --locked -p lpm-cli --bin lpm-rs commands::add::paths::tests
          cargo test --locked -p lpm-cli --bin lpm-rs commands::remove::tests

      - name: Windows install interruption recovery
        run: cargo nextest run --locked -p lpm-workflows --test install_concurrency -E 'test(interrupted_install)' --no-fail-fast --status-level slow --final-status-level fail

      - name: Windows install and bin-shim workflows
        run: >-
          cargo nextest run --locked -p lpm-workflows
          -E 'test(install_single_package_via_mock_registry) |
          test(install_creates_bin_symlink_for_binary_package) |
          test(install_v2_bin_shim_resolves_project_context_from_transitive_runtime) |
          test(dlx_cache_hit_executes_cached_binary_without_extending_ttl) |
          test(uninstall_then_reinstall_same_packages_reports_only_readded_direct_deps) |
          test(uninstall_scoped_package_removes_owned_bin_shim)'
          --no-fail-fast --status-level slow --final-status-level fail

      - name: Windows source, publish, metadata refresh, and global workflows
        timeout-minutes: 10
        run: >-
          cargo nextest run --locked -p lpm-workflows
          --test add --test install --test install_concurrency --test publish
          -E 'test(source_add_and_remove_use_in_project_paths_on_native_platforms) |
          test(install_refreshes_custom_metadata_when_requested_version_was_published_after_cache) |
          test(walker_install_refreshes_a_newly_published_version) |
          test(pubgrub_install_refreshes_a_newly_published_version) |
          test(missing_version_refresh_is_bounded_and_preserves_the_installed_project) |
          test(metadata_refresh_does_not_bypass_revoked_custom_registry_access) |
          test(failed_metadata_refresh_keeps_optional_dependencies_optional) |
          test(global_alias_without_a_collision_runs_and_is_removed_with_its_package) |
          test(two_concurrent_global_installs_serialize_via_global_tx_lock) |
          test(publish_dry_run_executes_publish_lifecycle_scripts_in_npm_order) |
          test(publish_lifecycle_does_not_receive_ambient_secrets)'
          --no-fail-fast --status-level slow --final-status-level fail
