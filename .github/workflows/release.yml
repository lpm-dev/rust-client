name: Release

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - nightly
      version:
        description: "Stable/recovery version without v; leave empty for generated nightly versions"
        required: false
      mode:
        description: "Release or recovery mode"
        required: true
        default: "candidate"
        type: choice
        options:
          - candidate
          - promote
          - full
          - wrapper-only
          - windows-smoke-only
          - npm-publish-only
      source_run_id:
        description: "Candidate/release run ID supplying exact artifacts"
        required: false

concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'nightly' || inputs.version || github.ref }}
  cancel-in-progress: false

# Jobs that publish, attest, or request an OIDC token grant those scopes locally.
permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.94.0"
  APPLE_TEAM_ID: "823S8YKMRW"
  APPLE_CODESIGN_IDENTITY: "Developer ID Application: Tolga Ergin (823S8YKMRW)"
  APPLE_CODESIGN_IDENTIFIER: "dev.lpm.cli"
  APPLE_CODESIGN_ENTITLEMENTS: "macos/lpm.entitlements"
  APPLE_KEYCHAIN_ACCESS_GROUP: "823S8YKMRW.dev.lpm.vault.shared"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      mode: ${{ steps.metadata.outputs.mode }}
      npm_tag: ${{ steps.metadata.outputs.npm_tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      should_release: ${{ steps.metadata.outputs.should_release }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Resolve and validate channel metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          SHOULD_RELEASE=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            CHANNEL=nightly
            MODE=full
            VERSION=
          else
            CHANNEL="${INPUT_CHANNEL:-stable}"
            MODE="${INPUT_MODE:-candidate}"
            VERSION="${INPUT_VERSION:-}"
          fi

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release workflows must run from the main branch."
            exit 1
          fi

          if [ "$CHANNEL" = "nightly" ]; then
            if [ "$MODE" = "full" ]; then
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "::error::Nightly releases must run from the main branch."
                exit 1
              fi
              if [ -n "${INPUT_VERSION:-}" ]; then
                echo "::error::Leave version empty for full nightly releases; it is generated automatically."
                exit 1
              fi

              if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
                PACKAGES=(
                  "@lpm-registry/cli"
                  "@lpm-registry/cli-darwin-arm64"
                  "@lpm-registry/cli-darwin-x64"
                  "@lpm-registry/cli-linux-arm64"
                  "@lpm-registry/cli-linux-x64"
                  "@lpm-registry/cli-linux-x64-musl"
                  "@lpm-registry/cli-win32-x64"
                )
                STATE_ARGS=()
                NPM_NIGHTLY=
                for package in "${PACKAGES[@]}"; do
                  package_version=$(npm view "$package" "dist-tags.nightly" --json --prefer-online |
                    jq -er 'if type == "string" and length > 0 then . else error("missing nightly dist-tag") end')
                  STATE_ARGS+=(--npm-version "${package}=${package_version}")
                  if [ "$package" = "@lpm-registry/cli" ]; then
                    NPM_NIGHTLY="$package_version"
                  fi
                done

                if ! printf '%s\n' "$NPM_NIGHTLY" |
                  grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.0-nightly\.[0-9]{8}\.[1-9][0-9]*\.([0-9a-f]{7}|g0[0-9]{6})$'; then
                  echo "::error::npm nightly dist-tag has an invalid version: '$NPM_NIGHTLY'."
                  exit 1
                fi

                PREVIOUS_TAG="v${NPM_NIGHTLY}"
                RELEASE_JSON="$RUNNER_TEMP/previous-nightly-release.json"
                gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PREVIOUS_TAG}" > "$RELEASE_JSON"
                GITHUB_TAG=$(jq -er '.tag_name | strings | select(length > 0)' "$RELEASE_JSON")
                GITHUB_PRERELEASE=$(jq -er \
                  'if (.prerelease | type) == "boolean" then (.prerelease | tostring) else error("invalid prerelease flag") end' \
                  "$RELEASE_JSON")
                GITHUB_DRAFT=$(jq -er \
                  'if (.draft | type) == "boolean" then (.draft | tostring) else error("invalid draft flag") end' \
                  "$RELEASE_JSON")
                GITHUB_PUBLISHED_AT=$(jq -er \
                  '.published_at | strings | select(length > 0)' "$RELEASE_JSON")

                COMPARE_JSON="$RUNNER_TEMP/previous-nightly-comparison.json"
                gh api \
                  "repos/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${GITHUB_SHA}" \
                  > "$COMPARE_JSON"
                TAG_SHA=$(jq -er '.base_commit.sha | strings | select(length > 0)' "$COMPARE_JSON")
                COMPARE_STATUS=$(jq -er '.status | strings | select(length > 0)' "$COMPARE_JSON")
                case "$COMPARE_STATUS" in
                  identical) RELATIONSHIP=same ;;
                  ahead) RELATIONSHIP=ancestor ;;
                  behind | diverged) RELATIONSHIP=diverged ;;
                  *)
                    echo "::error::GitHub returned unknown comparison status '$COMPARE_STATUS'."
                    exit 1
                    ;;
                esac

                STATE_JSON=$(node npm/release/nightly-release-state.mjs \
                  --current-sha "$GITHUB_SHA" \
                  --tag-sha "$TAG_SHA" \
                  --github-tag "$GITHUB_TAG" \
                  --github-prerelease "$GITHUB_PRERELEASE" \
                  --github-draft "$GITHUB_DRAFT" \
                  --github-published-at "$GITHUB_PUBLISHED_AT" \
                  --relationship "$RELATIONSHIP" \
                  "${STATE_ARGS[@]}")
                SHOULD_RELEASE=$(printf '%s' "$STATE_JSON" | jq -r '.shouldRelease')
                STATE_REASON=$(printf '%s' "$STATE_JSON" | jq -r '.reason')
                echo "::notice::$STATE_REASON"
              fi

              if [ "$SHOULD_RELEASE" = "true" ]; then
                CREATED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at')
                RUN_DATE=$(printf '%s' "$CREATED_AT" | cut -c1-10 | tr -d '-')
                VERSION=$(node npm/release/nightly-version.mjs \
                  --repo "$PWD" \
                  --date "$RUN_DATE" \
                  --run-number "$GITHUB_RUN_NUMBER" \
                  --sha "$GITHUB_SHA")
              else
                VERSION="$NPM_NIGHTLY"
              fi
            else
              if [ -z "$VERSION" ]; then
                echo "::error::version is required for nightly recovery runs."
                exit 1
              fi
            fi
          elif [ -z "$VERSION" ]; then
            echo "::error::version is required for stable release and recovery runs."
            exit 1
          fi

          case "$CHANNEL" in
            stable)
              if ! printf '%s\n' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
                echo "::error::Stable release version must be X.Y.Z, got '$VERSION'."
                exit 1
              fi
              if [ "$MODE" = "full" ]; then
                echo "::error::Stable releases use candidate followed by promote; full is reserved for nightly releases."
                exit 1
              fi
              if [ "$MODE" = "candidate" ]; then
                if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
                  echo "::error::Tag v${VERSION} already exists; choose a new version before building a candidate."
                  exit 1
                fi
              elif [ "$MODE" = "promote" ] && [ -z "${{ inputs.source_run_id }}" ]; then
                echo "::error::source_run_id is required when promoting a candidate."
                exit 1
              fi
              NPM_TAG=latest
              PRERELEASE=false
              ;;
            nightly)
              if [ "$MODE" = "candidate" ] || [ "$MODE" = "promote" ]; then
                echo "::error::candidate and promote are stable-only modes."
                exit 1
              fi
              if ! printf '%s\n' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.0-nightly\.[0-9]{8}\.[1-9][0-9]*\.([0-9a-f]{7}|g0[0-9]{6})$'; then
                echo "::error::Generated nightly version has an invalid shape: '$VERSION'."
                exit 1
              fi
              NPM_TAG=nightly
              PRERELEASE=true
              ;;
            *)
              echo "::error::Unknown release channel '$CHANNEL'."
              exit 1
              ;;
          esac

          if [ "$MODE" = "full" ] || [ "$MODE" = "candidate" ]; then
            WORKSPACE_VERSION=$(node --input-type=module -e \
              'import { workspaceStableVersion } from "./npm/release/nightly-version.mjs"; console.log(workspaceStableVersion("."));')
            if [ "$CHANNEL" = "stable" ] && [ "$VERSION" != "$WORKSPACE_VERSION" ]; then
              echo "::error::Stable release $VERSION does not match workspace version $WORKSPACE_VERSION."
              exit 1
            fi
          fi

          {
            echo "channel=$CHANNEL"
            echo "mode=$MODE"
            echo "npm_tag=$NPM_TAG"
            echo "prerelease=$PRERELEASE"
            echo "should_release=$SHOULD_RELEASE"
            echo "tag=v$VERSION"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_RELEASE" = "true" ]; then
            echo "Resolved $CHANNEL release v$VERSION (npm dist-tag: $NPM_TAG)."
          else
            echo "No nightly release needed for $GITHUB_SHA."
          fi

  verify:
    name: Release verification
    needs: release-metadata
    if: needs.release-metadata.outputs.should_release == 'true' && needs.release-metadata.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-verify-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-verify-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Linux keyring build deps
        run: bash scripts/ci/install-apt-packages.sh pkg-config libdbus-1-dev

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

      - name: Cargo dependency policy
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: ${{ env.RUST_TOOLCHAIN }}
          command: check
          arguments: --all-features
          command-arguments: --hide-inclusion-graph advisories bans licenses

      - name: Reject fancy-regex (ReDoS prevention)
        run: |
          if grep -r 'fancy-regex' crates/*/Cargo.toml; then
            echo "::error::fancy-regex found in Cargo.toml dependencies. The regex crate (linear-time) must be used for scanning untrusted input."
            exit 1
          fi
          echo "✓ No fancy-regex dependencies found"

      - name: install.sh smoke tests
        run: sh tests/install-sh/run.sh

      - name: Audit harness helper tests
        run: bash bench/test-audit-install-args.sh

      - name: Local install bench helper tests
        run: bash bench/test-local-install.sh

      - name: Live metadata route bench helper tests
        run: bash bench/test-live-metadata-route.sh

      - name: README bench helper tests
        run: bash bench/test-run-readme.sh

      - name: Hermetic workflow CLI helper tests
        run: bash scripts/ci/test-with-hermetic-workflow-cli.sh

      - name: Install nextest
        uses: taiki-e/install-action@9c6953334daacc48e55a35db9a19c771f79ffa9d # nextest

      - name: Install Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install readiness bench helper tests
        run: node bench/scripts/run-install-readiness.mjs --self-test

      - name: T3 six-state install bench helper tests
        run: node bench/scripts/run-t3-install-six-states.mjs --self-test

      - name: Runtime readiness bench helper tests
        run: node bench/scripts/run-runtime-readiness.mjs --self-test

      - name: npm wrapper tests
        run: npm --prefix npm/cli test

      - name: npm wrapper pack check
        run: npm --prefix npm/cli run pack:check

      - name: Cache npm (Verdaccio test harness)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-verdaccio-${{ hashFiles('tests/workflows/tests/support/verdaccio.rs') }}
          restore-keys: ${{ runner.os }}-npm-verdaccio-

      - name: Pre-warm Verdaccio in npm cache
        run: |
          set -e
          VERDACCIO_VERSION=$(grep -oE 'VERDACCIO_VERSION: &str = "[^"]+"' tests/workflows/tests/support/verdaccio.rs | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERDACCIO_VERSION" ]; then
            echo "::error::Could not extract VERDACCIO_VERSION from verdaccio.rs"
            exit 1
          fi
          echo "Pre-warming npm cache for verdaccio@$VERDACCIO_VERSION"
          npx --yes "verdaccio@$VERDACCIO_VERSION" --version

      - name: npm release artifact tests
        run: node --test npm/release/tests/*.test.mjs

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Full workspace nextest
        run: scripts/ci/with-hermetic-workflow-cli.sh cargo nextest run --locked --workspace --ignore-default-filter --no-fail-fast --status-level slow --final-status-level fail

      - name: Audit-scale workflow fixtures
        run: cargo nextest run --locked -P audit -p lpm-workflows --test install_realworld --run-ignored only --no-fail-fast --status-level slow --final-status-level fail

  verify-candidate-source:
    name: Reuse successful main CI verification
    needs: release-metadata
    if: needs.release-metadata.outputs.should_release == 'true' && needs.release-metadata.outputs.mode == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful CI for the exact candidate commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$GITHUB_SHA" \
            -f status=success \
            -f per_page=100)
          count=$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(
            .head_sha == env.GITHUB_SHA and
            .head_branch == "main" and
            .event == "push" and
            .status == "completed" and
            .conclusion == "success" and
            .head_repository.full_name == env.GITHUB_REPOSITORY
          )] | length')
          if [ "$count" -lt 1 ]; then
            echo "::error::The exact candidate commit must pass the main CI workflow before release construction starts."
            exit 1
          fi
          echo "Reusing successful main CI verification for $GITHUB_SHA."

  release-preflight:
    needs: release-metadata
    if: >-
      needs.release-metadata.outputs.should_release == 'true' &&
      (needs.release-metadata.outputs.mode == 'candidate' || needs.release-metadata.outputs.mode == 'full')
    uses: ./.github/workflows/release-preflight.yml
    secrets:
      APPLE_CLI_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_CLI_PROVISIONING_PROFILE_BASE64 }}
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}

  verify-windows-filesystem:
    needs: release-metadata
    if: >-
      needs.release-metadata.outputs.should_release == 'true' &&
      (needs.release-metadata.outputs.mode == 'candidate' || needs.release-metadata.outputs.mode == 'full')
    uses: ./.github/workflows/windows-filesystem-gate.yml

  build:
    name: Build ${{ matrix.target }}
    needs:
      - release-metadata
      - verify
      - verify-candidate-source
      - release-preflight
      - verify-windows-filesystem
    if: >-
      always() &&
      needs.release-metadata.outputs.should_release == 'true' &&
      needs.release-preflight.result == 'success' &&
      needs.verify-windows-filesystem.result == 'success' &&
      ((needs.release-metadata.outputs.mode == 'full' && needs.verify.result == 'success') ||
      (needs.release-metadata.outputs.mode == 'candidate' && needs.verify-candidate-source.result == 'success'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      LPM_BUILD_VERSION: ${{ needs.release-metadata.outputs.version }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: lpm-darwin-x64
            bundle_platform: darwin-x64
            timeout_minutes: 120
          - target: aarch64-apple-darwin
            os: macos-15
            binary: lpm-darwin-arm64
            bundle_platform: darwin-arm64
            timeout_minutes: 120
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: lpm-linux-x64
            timeout_minutes: 120
            portable_glibc: true
            build_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:d5f19b5957cf25df7ac15465924cafe2358754a187e510af386bf9596598a372
            runtime_image: rockylinux/rockylinux:8.10-minimal@sha256:af5fbd460188a87059557422b2c00978f488ac6bc6b78d63a02e2fad040d7733
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            binary: lpm-linux-x64-musl
            timeout_minutes: 120
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary: lpm-linux-arm64
            timeout_minutes: 120
            portable_glibc: true
            build_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:34368babc008d6405b4b74c77868d6a5d15b6010cb953574d1f2bb9184392a9b
            runtime_image: rockylinux/rockylinux:8.10-minimal@sha256:55ddcbe11a7bf1696f67ce3b2ffcc6d58b3d33007be03bc372d61fc147a92015
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install musl build tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          bash scripts/ci/install-apt-packages.sh musl-tools=1.2.4-2
          test "$(dpkg-query -W -f='${Version}' musl-tools)" = "1.2.4-2"
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"

      - name: Build
        if: matrix.target != 'x86_64-unknown-linux-musl' && matrix.portable_glibc != true
        run: cargo build --locked --release --target ${{ matrix.target }} -p lpm-cli

      - name: Preserve provisioned macOS binary
        if: runner.os == 'macOS'
        run: cp "target/${{ matrix.target }}/release/lpm-rs" "$RUNNER_TEMP/lpm-rs-provisioned"

      - name: Build legacy-only macOS compatibility binary
        if: runner.os == 'macOS'
        run: >-
          cargo build --locked --release
          --target ${{ matrix.target }}
          -p lpm-cli
          --features legacy-macos-keychain

      - name: Build portable GNU Linux binary
        if: matrix.portable_glibc == true
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work" \
            --mount "type=bind,source=$HOME/.cargo,target=/cargo" \
            --mount "type=bind,source=$HOME/.rustup,target=/rustup,readonly" \
            --workdir /work \
            --env CARGO_HOME=/cargo \
            --env CARGO_INCREMENTAL \
            --env HOME=/tmp/lpm-home \
            --env LPM_BUILD_VERSION \
            --env RUSTUP_HOME=/rustup \
            --env RUST_TOOLCHAIN \
            "${{ matrix.build_image }}" \
            bash -ceu '
              export PATH="/cargo/bin:$PATH"
              cargo "+${RUST_TOOLCHAIN}" build \
                --locked \
                --release \
                --target "${{ matrix.target }}" \
                -p lpm-cli \
                --features portable-linux
            '

      - name: Build static musl binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo rustc --locked --release --target ${{ matrix.target }} -p lpm-cli --bin lpm-rs -- -C link-arg=-static

      - name: Stage binary
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp target/${{ matrix.target }}/release/lpm-rs ${{ matrix.binary }}
          else
            cp target/${{ matrix.target }}/release/lpm-rs ${{ matrix.binary }}
          fi
          chmod +x ${{ matrix.binary }}

      - name: Install Node 22 for GNU Linux ABI verification
        if: matrix.portable_glibc == true
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Verify GNU Linux ABI ceiling
        if: matrix.portable_glibc == true
        run: >-
          node npm/release/verify-linux-abi.mjs
          --binary "${{ matrix.binary }}"
          --max-glibc 2.28

      - name: Verify GNU Linux binary on glibc 2.28
        if: matrix.portable_glibc == true
        run: |
          set -euo pipefail
          VERSION="${{ needs.release-metadata.outputs.version }}"
          actual=$(docker run --rm --network none \
            -v "$PWD:/work:ro" \
            "${{ matrix.runtime_image }}" \
            "/work/${{ matrix.binary }}" --version)
          test "$actual" = "lpm $VERSION"

      - name: Verify musl binary on Alpine
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          file "${{ matrix.binary }}"
          if readelf -l "${{ matrix.binary }}" | grep -q INTERP; then
            echo "::error::${{ matrix.binary }} requires a runtime ELF interpreter"
            readelf -l "${{ matrix.binary }}"
            exit 1
          fi
          if readelf -d "${{ matrix.binary }}" | grep -q '(NEEDED)'; then
            echo "::error::${{ matrix.binary }} has dynamic library dependencies"
            readelf -d "${{ matrix.binary }}"
            exit 1
          fi
          VERSION="${{ needs.release-metadata.outputs.version }}"
          actual=$(docker run --rm \
            -v "$PWD:/work:ro" \
            alpine@sha256:7c8cb692ae09657cbc4a3f3cbd0e8d5a2690ba38386aaaf252dbb060bf5eb2e6 \
            /work/${{ matrix.binary }} --version)
          test "$actual" = "lpm $VERSION"

      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_DEVELOPER_ID_P12_BASE64:-}" ] || [ -z "${APPLE_DEVELOPER_ID_P12_PASSWORD:-}" ]; then
            echo "::error::Set APPLE_DEVELOPER_ID_P12_BASE64 and APPLE_DEVELOPER_ID_P12_PASSWORD before publishing macOS release artifacts."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/lpm-release-signing.keychain-db"
          KEYCHAIN_SEARCH_LIST_STATE="$RUNNER_TEMP/lpm-release-keychain-search-list"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          trap 'rm -f "$CERT_PATH"' EXIT

          umask 077
          echo "APPLE_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_SEARCH_LIST_STATE=$KEYCHAIN_SEARCH_LIST_STATE" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          "$GITHUB_WORKSPACE/scripts/ci/macos-keychain-search-list.sh" add "$KEYCHAIN_PATH" "$KEYCHAIN_SEARCH_LIST_STATE"

      - name: Sign legacy binary and provisioned app bundle (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CLI_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_CLI_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          # Keep this entitlement-free compatibility artifact in every macOS
          # release until the 0.75 standalone updater baseline is retired.
          # Old updaters resolve the raw asset from whichever release is latest.
          codesign --force --timestamp --options runtime \
            --keychain "$APPLE_SIGNING_KEYCHAIN" \
            --identifier "$APPLE_CODESIGN_IDENTIFIER" \
            --sign "$APPLE_CODESIGN_IDENTITY" \
            "${{ matrix.binary }}"

          codesign --verify --strict --verbose=4 "${{ matrix.binary }}"
          codesign -dv --verbose=4 "${{ matrix.binary }}" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime|Timestamp"

          if [ -z "${APPLE_CLI_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "::error::Set APPLE_CLI_PROVISIONING_PROFILE_BASE64 to the Developer ID profile for dev.lpm.cli."
            exit 1
          fi

          PROFILE_PATH="$RUNNER_TEMP/lpm-cli.provisionprofile"
          PROFILE_PLIST="$RUNNER_TEMP/lpm-cli-profile.plist"
          APP_BUNDLE="$RUNNER_TEMP/${{ matrix.binary }}-bundle/LPM CLI.app"
          printf '%s' "$APPLE_CLI_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APPLICATION_ID=$(
            /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$PROFILE_PLIST" 2>/dev/null ||
              /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST"
          )
          PROFILE_ACCESS_GROUPS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:keychain-access-groups' "$PROFILE_PLIST")
          test "$PROFILE_TEAM_ID" = "$APPLE_TEAM_ID"
          test "$PROFILE_APPLICATION_ID" = "$APPLE_TEAM_ID.$APPLE_CODESIGN_IDENTIFIER"
          printf '%s\n' "$PROFILE_ACCESS_GROUPS" | awk \
            -v exact="$APPLE_KEYCHAIN_ACCESS_GROUP" \
            -v wildcard="$APPLE_TEAM_ID.*" \
            '{ value = $0; gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); if (value == exact || value == wildcard) found = 1 } END { exit(found ? 0 : 1) }'
          "$GITHUB_WORKSPACE/scripts/assemble-macos-app.sh" \
            "$RUNNER_TEMP/lpm-rs-provisioned" \
            "$APP_BUNDLE" \
            "$PROFILE_PATH"

          codesign --force --timestamp --options runtime \
            --keychain "$APPLE_SIGNING_KEYCHAIN" \
            --entitlements "$APPLE_CODESIGN_ENTITLEMENTS" \
            --sign "$APPLE_CODESIGN_IDENTITY" \
            "$APP_BUNDLE"

          codesign --verify --strict --verbose=4 "$APP_BUNDLE"
          codesign -dv --verbose=4 "$APP_BUNDLE" 2>&1 | grep -E "Authority|Identifier|TeamIdentifier|Runtime|Timestamp"

          SIGNED_ENTITLEMENTS="$RUNNER_TEMP/${{ matrix.binary }}-bundle-entitlements.plist"
          codesign -d --entitlements :- "$APP_BUNDLE" > "$SIGNED_ENTITLEMENTS" 2>/dev/null
          SIGNED_ACCESS_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' "$SIGNED_ENTITLEMENTS")
          test "$SIGNED_ACCESS_GROUP" = "$APPLE_KEYCHAIN_ACCESS_GROUP"
          SIGNED_TEAM_ID=$(codesign -dvv "$APP_BUNDLE" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2}')
          SIGNED_IDENTIFIER=$(codesign -dvv "$APP_BUNDLE" 2>&1 | awk -F= '/^Identifier=/{print $2}')
          test "$SIGNED_TEAM_ID" = "$APPLE_TEAM_ID"
          test "$SIGNED_IDENTIFIER" = "$APPLE_CODESIGN_IDENTIFIER"

      - name: Archive signed macOS notarization inputs
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP_BUNDLE="$RUNNER_TEMP/${{ matrix.binary }}-bundle/LPM CLI.app"
          mkdir notarization-input
          BUNDLE_NOTARY_ZIP="notarization-input/${{ matrix.binary }}-bundle-notary.zip"
          ditto -c -k --keepParent --norsrc "$APP_BUNDLE" "$BUNDLE_NOTARY_ZIP"
          LEGACY_NOTARY_ZIP="notarization-input/${{ matrix.binary }}-legacy-notary.zip"
          ditto -c -k --keepParent --norsrc "${{ matrix.binary }}" "$LEGACY_NOTARY_ZIP"

      - name: Restore Keychain search list before executing release code (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/ci/macos-keychain-search-list.sh" restore "$APPLE_KEYCHAIN_SEARCH_LIST_STATE"
          security delete-keychain "$APPLE_SIGNING_KEYCHAIN"

      # Upload immutable release inputs before executing built code. A release
      # binary can no longer replace the bytes later attested and published.
      - name: Upload non-macOS artifact
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
          retention-days: 1

      - name: Build scheduled acceptance binary
        if: github.event_name == 'schedule' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work" \
            --mount "type=bind,source=$HOME/.cargo,target=/cargo" \
            --mount "type=bind,source=$HOME/.rustup,target=/rustup,readonly" \
            --workdir /work \
            --env CARGO_HOME=/cargo \
            --env CARGO_INCREMENTAL \
            --env HOME=/tmp/lpm-home \
            --env LPM_BUILD_VERSION \
            --env RUSTUP_HOME=/rustup \
            --env RUST_TOOLCHAIN \
            "${{ matrix.build_image }}" \
            bash -ceu '
              export PATH="/cargo/bin:$PATH"
              cargo "+${RUST_TOOLCHAIN}" build \
                --locked \
                --release \
                --target "${{ matrix.target }}" \
                -p lpm-cli \
                --features portable-linux,acceptance-test-hooks
            '

          bundle="$RUNNER_TEMP/lpm-linux-x64-acceptance"
          mkdir "$bundle"
          install -m 0755 \
            "target/${{ matrix.target }}/release/lpm-rs" \
            "$bundle/lpm-rs"
          binary_sha256=$(sha256sum "$bundle/lpm-rs" | awk '{print $1}')
          jq -n \
            --arg artifactName "lpm-linux-x64-acceptance" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg ref "$GITHUB_REF" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg target "${{ matrix.target }}" \
            --arg version "$LPM_BUILD_VERSION" \
            --arg binarySha256 "$binary_sha256" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schemaVersion: 1,
              repository: $repository,
              workflow: ".github/workflows/release.yml",
              event: $event,
              ref: $ref,
              sha: $sha,
              runId: $runId,
              runAttempt: $runAttempt,
              artifactName: $artifactName,
              version: $version,
              binary: {
                path: "lpm-rs",
                target: $target,
                features: ["acceptance-test-hooks", "portable-linux"],
                sha256: $binarySha256
              }
            }' > "$bundle/manifest.json"
          (
            cd "$bundle"
            sha256sum lpm-rs manifest.json > SHA256SUMS.txt
          )
          actual=$("$bundle/lpm-rs" --version)
          test "$actual" = "lpm $LPM_BUILD_VERSION"

      - name: Upload scheduled acceptance artifact
        if: github.event_name == 'schedule' && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lpm-linux-x64-acceptance
          path: ${{ runner.temp }}/lpm-linux-x64-acceptance/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload immutable signed macOS notarization inputs
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: notarization-input-${{ matrix.binary }}
          path: notarization-input/
          if-no-files-found: error
          retention-days: 1

      - name: Execute release binary (Linux glibc)
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          VERSION="${{ needs.release-metadata.outputs.version }}"
          actual=$("./${{ matrix.binary }}" --version)
          test "$actual" = "lpm $VERSION"

      - name: Delete temporary signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          cleanup_status=0
          if [ -n "${APPLE_KEYCHAIN_SEARCH_LIST_STATE:-}" ] && [ -f "$APPLE_KEYCHAIN_SEARCH_LIST_STATE" ]; then
            if ! "$GITHUB_WORKSPACE/scripts/ci/macos-keychain-search-list.sh" restore "$APPLE_KEYCHAIN_SEARCH_LIST_STATE"; then
              echo "::error::Could not restore the original user Keychain search list."
              cleanup_status=1
            fi
          fi
          if [ -n "${APPLE_SIGNING_KEYCHAIN:-}" ]; then
            if [ "$cleanup_status" -eq 0 ]; then
              if [ -e "$APPLE_SIGNING_KEYCHAIN" ]; then
                security delete-keychain "$APPLE_SIGNING_KEYCHAIN" || cleanup_status=1
              fi
            fi
          fi
          exit "$cleanup_status"

  notarize-macos:
    name: Notarize ${{ matrix.target }}
    needs:
      - build
      - release-metadata
    if: >-
      needs.release-metadata.outputs.should_release == 'true' &&
      (needs.release-metadata.outputs.mode == 'candidate' || needs.release-metadata.outputs.mode == 'full')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: lpm-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-15
            binary: lpm-darwin-arm64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Resolve exact signed notarization input
        id: input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="notarization-input-${{ matrix.binary }}"
          exact=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" | \
            jq -c --arg name "$name" --arg sha "$GITHUB_SHA" --argjson run "$GITHUB_RUN_ID" \
              '[.[].artifacts[] | select(
                .name == $name and
                .expired == false and
                .workflow_run.id == $run and
                .workflow_run.head_sha == $sha
              )]')
          if [ "$(printf '%s' "$exact" | jq length)" -ne 1 ]; then
            echo "::error::Expected exactly one immutable $name artifact."
            exit 1
          fi
          artifact_id=$(printf '%s' "$exact" | jq -er '.[0].id')
          artifact_digest=$(printf '%s' "$exact" | jq -er '.[0].digest')
          if ! [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || \
             ! [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Signed notarization input has an invalid immutable identity."
            exit 1
          fi
          {
            echo "artifact_id=$artifact_id"
            echo "artifact_digest=$artifact_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact signed notarization input
        env:
          ARTIFACT_DIGEST: ${{ steps.input.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ steps.input.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/ci/download-verified-artifact.sh
          "$GITHUB_REPOSITORY" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" notarization-input

      - name: Restore latest notarization submission state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix="notarization-state-${{ matrix.binary }}-"
          matches=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" | \
            jq -c --arg prefix "$prefix" --arg sha "$GITHUB_SHA" --argjson run "$GITHUB_RUN_ID" \
              '[.[].artifacts[] | select(
                (.name | startswith($prefix)) and
                .expired == false and
                .workflow_run.id == $run and
                .workflow_run.head_sha == $sha
              )] | sort_by(.created_at)')
          count=$(printf '%s' "$matches" | jq length)
          if [ "$count" -eq 0 ]; then
            mkdir notarization-state
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          artifact_id=$(printf '%s' "$matches" | jq -er 'last.id')
          artifact_digest=$(printf '%s' "$matches" | jq -er 'last.digest')
          scripts/ci/download-verified-artifact.sh \
            "$GITHUB_REPOSITORY" "$artifact_id" "$artifact_digest" notarization-state
          echo "recovered=true" >> "$GITHUB_OUTPUT"

      - name: Extract and verify signed macOS inputs
        run: |
          set -euo pipefail
          APP_BUNDLE="$RUNNER_TEMP/${{ matrix.binary }}-bundle/LPM CLI.app"
          mkdir -p "$(dirname "$APP_BUNDLE")" "$RUNNER_TEMP/${{ matrix.binary }}-legacy"
          ditto -x -k "notarization-input/${{ matrix.binary }}-bundle-notary.zip" \
            "$(dirname "$APP_BUNDLE")"
          ditto -x -k "notarization-input/${{ matrix.binary }}-legacy-notary.zip" \
            "$RUNNER_TEMP/${{ matrix.binary }}-legacy"
          cp "$RUNNER_TEMP/${{ matrix.binary }}-legacy/${{ matrix.binary }}" "${{ matrix.binary }}"
          chmod 755 "${{ matrix.binary }}"
          codesign --verify --strict --verbose=4 "$APP_BUNDLE"
          codesign --verify --strict --verbose=4 "${{ matrix.binary }}"

      - name: Submit macOS artifacts for notarization once
        id: submit
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_NOTARY_KEY_BASE64:-}" ] || [ -n "${APPLE_NOTARY_KEY_ID:-}" ] || [ -n "${APPLE_NOTARY_ISSUER_ID:-}" ]; then
            if [ -z "${APPLE_NOTARY_KEY_BASE64:-}" ] || [ -z "${APPLE_NOTARY_KEY_ID:-}" ] || [ -z "${APPLE_NOTARY_ISSUER_ID:-}" ]; then
              echo "::error::Set APPLE_NOTARY_KEY_BASE64, APPLE_NOTARY_KEY_ID, and APPLE_NOTARY_ISSUER_ID together."
              exit 1
            fi
            NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
            trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
            umask 077
            printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
            NOTARY_AUTH=(--key "$NOTARY_KEY_PATH" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID")
          else
            if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
              echo "::error::Set App Store Connect API key secrets, or set APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD."
              exit 1
            fi
            NOTARY_AUTH=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD")
          fi
          submit_status=0
          LPM_NOTARY_MODE=submit \
          LPM_NOTARY_STATE_PATH="notarization-state/bundle.json" \
            scripts/ci/notarize-with-retry.sh \
              "notarization-input/${{ matrix.binary }}-bundle-notary.zip" "${NOTARY_AUTH[@]}" || submit_status=1
          LPM_NOTARY_MODE=submit \
          LPM_NOTARY_STATE_PATH="notarization-state/legacy.json" \
            scripts/ci/notarize-with-retry.sh \
              "notarization-input/${{ matrix.binary }}-legacy-notary.zip" "${NOTARY_AUTH[@]}" || submit_status=1
          exit "$submit_status"

      - name: Persist notarization submission IDs before polling
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: notarization-state-${{ matrix.binary }}-${{ github.run_attempt }}
          path: notarization-state/*.json
          if-no-files-found: warn
          retention-days: 1

      - name: Resume polling the persisted notarization submissions
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_NOTARY_KEY_BASE64:-}" ]; then
            NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
            trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
            umask 077
            printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
            NOTARY_AUTH=(--key "$NOTARY_KEY_PATH" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID")
          else
            NOTARY_AUTH=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD")
          fi
          LPM_NOTARY_MODE=poll \
          LPM_NOTARY_STATE_PATH="notarization-state/bundle.json" \
            scripts/ci/notarize-with-retry.sh \
              "notarization-input/${{ matrix.binary }}-bundle-notary.zip" "${NOTARY_AUTH[@]}"
          LPM_NOTARY_MODE=poll \
          LPM_NOTARY_STATE_PATH="notarization-state/legacy.json" \
            scripts/ci/notarize-with-retry.sh \
              "notarization-input/${{ matrix.binary }}-legacy-notary.zip" "${NOTARY_AUTH[@]}"

      - name: Staple validate and package notarized macOS artifacts
        run: |
          set -euo pipefail
          APP_BUNDLE="$RUNNER_TEMP/${{ matrix.binary }}-bundle/LPM CLI.app"
          xcrun stapler staple "$APP_BUNDLE"
          xcrun stapler validate "$APP_BUNDLE"
          codesign --verify --strict --verbose=4 "$APP_BUNDLE"
          spctl --assess --type execute --verbose=4 "$APP_BUNDLE"
          ditto -c -k --keepParent --norsrc "$APP_BUNDLE" "${{ matrix.binary }}.zip"

      - name: Upload macOS bundle and compatibility artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.binary }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.binary }}.zip
          if-no-files-found: error
          retention-days: 1

      - name: Execute notarized app bundle and compatibility binary
        run: |
          set -euo pipefail
          VERSION="${{ needs.release-metadata.outputs.version }}"
          APP_EXECUTABLE="$RUNNER_TEMP/${{ matrix.binary }}-bundle/LPM CLI.app/Contents/MacOS/lpm-rs"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              actual=$(arch -arm64 "$APP_EXECUTABLE" --version)
              legacy_actual=$(arch -arm64 "./${{ matrix.binary }}" --version)
              ;;
            x86_64-apple-darwin)
              actual=$(arch -x86_64 "$APP_EXECUTABLE" --version)
              legacy_actual=$(arch -x86_64 "./${{ matrix.binary }}" --version)
              ;;
          esac
          test "$actual" = "lpm $VERSION"
          test "$legacy_actual" = "lpm $VERSION"
          file "$APP_EXECUTABLE"
          raw_smoke_home="$RUNNER_TEMP/raw-keychain-home"
          raw_smoke_project="$RUNNER_TEMP/raw-keychain-project"
          mkdir -p "$raw_smoke_home" "$raw_smoke_project"
          cd "$raw_smoke_project"
          LPM_HOME="$raw_smoke_home" "$GITHUB_WORKSPACE/${{ matrix.binary }}" env set LPM_RELEASE_SMOKE=verified
          LPM_HOME="$raw_smoke_home" "$GITHUB_WORKSPACE/${{ matrix.binary }}" env get LPM_RELEASE_SMOKE >/dev/null
          LPM_HOME="$raw_smoke_home" "$GITHUB_WORKSPACE/${{ matrix.binary }}" env delete LPM_RELEASE_SMOKE

  build-windows:
    name: Build x86_64-pc-windows-msvc
    needs:
      - release-metadata
      - verify
      - verify-candidate-source
      - release-preflight
      - verify-windows-filesystem
    if: >-
      always() &&
      needs.release-metadata.outputs.should_release == 'true' &&
      needs.release-preflight.result == 'success' &&
      needs.verify-windows-filesystem.result == 'success' &&
      ((needs.release-metadata.outputs.mode == 'full' && needs.verify.result == 'success') ||
      (needs.release-metadata.outputs.mode == 'candidate' && needs.verify-candidate-source.result == 'success'))
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      LPM_BUILD_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - name: Build CLI
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p lpm-cli

      - name: Build sandbox helper
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p lpm-sandbox --bin lpm-sandbox-helper

      - name: Stage unsigned binaries
        run: |
          cp target/x86_64-pc-windows-msvc/release/lpm-rs.exe lpm-win32-x64.exe
          cp target/x86_64-pc-windows-msvc/release/lpm-sandbox-helper.exe lpm-sandbox-helper-win32-x64.exe

      - name: Upload immutable unsigned binaries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-windows-binaries
          path: |
            lpm-win32-x64.exe
            lpm-sandbox-helper-win32-x64.exe
          if-no-files-found: error
          retention-days: 1

      - name: Execute release binary
        shell: pwsh
        run: |
          $version = "${{ needs.release-metadata.outputs.version }}"
          $actual = (& ".\lpm-win32-x64.exe" --version | Out-String).Trim()
          if ($actual -ne "lpm $version") {
            Write-Error "Release binary reported '$actual', expected 'lpm $version'."
            exit 1
          }

  sign-windows:
    name: Sign Windows binaries
    needs:
      - build-windows
      - release-metadata
    if: >-
      needs.release-metadata.outputs.should_release == 'true' &&
      (needs.release-metadata.outputs.mode == 'candidate' || needs.release-metadata.outputs.mode == 'full')
    runs-on: windows-latest
    environment: windows-signing
    timeout-minutes: 20
    permissions:
      id-token: write
    steps:
      - name: Download unsigned binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unsigned-windows-binaries

      - name: Validate Windows signing configuration
        shell: pwsh
        env:
          WINDOWS_SIGNING_AZURE_CLIENT_ID: ${{ secrets.WINDOWS_SIGNING_AZURE_CLIENT_ID }}
          WINDOWS_SIGNING_AZURE_TENANT_ID: ${{ secrets.WINDOWS_SIGNING_AZURE_TENANT_ID }}
          WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID: ${{ secrets.WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID }}
          WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT_NAME: ${{ vars.WINDOWS_SIGNING_ACCOUNT_NAME }}
          WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          $missing = @()
          foreach ($name in @(
            "WINDOWS_SIGNING_AZURE_CLIENT_ID",
            "WINDOWS_SIGNING_AZURE_TENANT_ID",
            "WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID",
            "WINDOWS_SIGNING_ENDPOINT",
            "WINDOWS_SIGNING_ACCOUNT_NAME",
            "WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error ("Set Windows signing repository secrets/variables before publishing Windows release artifacts. Missing: " + ($missing -join ", "))
            exit 1
          }

      - name: Azure login
        uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a # v3
        with:
          client-id: ${{ secrets.WINDOWS_SIGNING_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WINDOWS_SIGNING_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID }}

      - name: Sign binaries
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30 # v2
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\lpm-win32-x64.exe
            ${{ github.workspace }}\lpm-sandbox-helper-win32-x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: LPM CLI
          description-url: https://github.com/lpm-dev/rust-client

      - name: Verify signatures
        shell: pwsh
        run: |
          foreach ($file in @(".\lpm-win32-x64.exe", ".\lpm-sandbox-helper-win32-x64.exe")) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate

            if ($signature.Status -ne "Valid") {
              Write-Error "Authenticode signature for $file is $($signature.Status): $($signature.StatusMessage)"
              exit 1
            }

            if ($null -eq $signature.TimeStamperCertificate) {
              Write-Error "Authenticode signature for $file does not include a timestamp."
              exit 1
            }
          }

      - name: Upload CLI artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lpm-win32-x64.exe
          path: lpm-win32-x64.exe
          retention-days: 1

      - name: Upload helper artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lpm-sandbox-helper-win32-x64.exe
          path: lpm-sandbox-helper-win32-x64.exe
          retention-days: 1

  pack-npm-packages:
    name: Pack exact npm release artifacts
    needs:
      - build
      - notarize-macos
      - sign-windows
      - release-metadata
    if: >-
      needs.release-metadata.outputs.should_release == 'true' &&
      (needs.release-metadata.outputs.mode == 'candidate' || needs.release-metadata.outputs.mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_digest: sha256:${{ steps.npm-artifact.outputs['artifact-digest'] }}
      artifact_id: ${{ steps.npm-artifact.outputs['artifact-id'] }}
      version: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Download signed release binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: lpm-*
          merge-multiple: true
          path: binaries

      - name: Extract macOS app bundles for npm packages
        run: |
          set -euo pipefail
          for binary in lpm-darwin-arm64 lpm-darwin-x64; do
            platform="${binary#lpm-}"
            archive="binaries/${binary}.zip"
            entries=$(unzip -Z1 "$archive")
            if printf '%s\n' "$entries" | grep -Eq '(^/|(^|/)\.\.(/|$)|\\)'; then
              echo "::error::Unsafe path in ${archive}."
              exit 1
            fi
            if printf '%s\n' "$entries" | grep -Ev '^LPM CLI\.app(/|$)' >/dev/null; then
              echo "::error::${archive} must contain only LPM CLI.app."
              exit 1
            fi
            mkdir -p "binaries/${platform}"
            # ditto stores macOS extended attributes as AppleDouble files.
            # npm tar archives cannot preserve them, so exclude them here.
            unzip -q "$archive" -d "binaries/${platform}" -x '*/._*'
            unexpected_entries=$(
              cd "binaries/${platform}" &&
                find 'LPM CLI.app' -print |
                  grep -Ev '^(LPM CLI\.app|LPM CLI\.app/Contents|LPM CLI\.app/Contents/Info\.plist|LPM CLI\.app/Contents/CodeResources|LPM CLI\.app/Contents/embedded\.provisionprofile|LPM CLI\.app/Contents/MacOS|LPM CLI\.app/Contents/MacOS/lpm-rs|LPM CLI\.app/Contents/Resources|LPM CLI\.app/Contents/Resources/LPMCLI\.icns|LPM CLI\.app/Contents/_CodeSignature|LPM CLI\.app/Contents/_CodeSignature/CodeResources)$' || true
            )
            if [ -n "$unexpected_entries" ]; then
              echo "::error::${archive} produced unexpected npm bundle entries:"
              printf '%s\n' "$unexpected_entries"
              exit 1
            fi
            chmod 755 "binaries/${platform}/LPM CLI.app/Contents/MacOS/lpm-rs"
          done

      - name: Pack and hash release packages
        run: |
          node npm/release/prepare-packages.mjs \
            --repo "$PWD" \
            --binaries "$PWD/binaries" \
            --output "$PWD/npm-release-packages" \
            --version "${{ needs.release-metadata.outputs.version }}"

      - name: Upload exact npm tarballs
        id: npm-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-release-packages
          path: npm-release-packages/
          if-no-files-found: error
          retention-days: ${{ needs.release-metadata.outputs.mode == 'candidate' && 1 || 14 }}

  smoke-npm-packages:
    name: Smoke npm artifacts (${{ matrix.platform }})
    needs:
      - pack-npm-packages
      - release-metadata
    if: >-
      needs.release-metadata.outputs.should_release == 'true' &&
      (needs.release-metadata.outputs.mode == 'candidate' || needs.release-metadata.outputs.mode == 'full')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-15
            node_arch: arm64
          - platform: darwin-x64
            os: macos-15-intel
            node_arch: x64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            node_arch: arm64
          - platform: linux-x64
            os: ubuntu-latest
            node_arch: x64
          - platform: linux-x64-musl
            os: ubuntu-latest
            alpine: true
          - platform: win32-x64
            os: windows-latest
            node_arch: x64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download exact npm tarballs
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.pack-npm-packages.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.pack-npm-packages.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/ci/download-verified-artifact.sh
          "$GITHUB_REPOSITORY" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" npm-release-packages

      - name: Install Node 22
        if: matrix.alpine != true
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          architecture: ${{ matrix.node_arch }}

      - name: Pin npm used by release consumers
        if: matrix.alpine != true
        run: npm install --global npm@11.12.1 --no-audit --no-fund

      - name: Install and execute exact npm tarballs
        if: matrix.alpine != true
        run: >-
          node npm/release/smoke-install.mjs
          --tarballs npm-release-packages
          --platform ${{ matrix.platform }}
          --version ${{ needs.pack-npm-packages.outputs.version }}

      - name: Install and execute exact npm tarballs on Alpine
        if: matrix.alpine == true
        run: |
          docker run --rm --network none \
            -v "$PWD:/work:ro" \
            -w /work \
            node:22-alpine@sha256:b74031e546d7f4faf561d797ac1b76beccac856a042815ca77db4fd047581605 \
            node npm/release/smoke-install.mjs \
              --tarballs npm-release-packages \
              --platform ${{ matrix.platform }} \
              --version ${{ needs.pack-npm-packages.outputs.version }}

  smoke-windows-recovery:
    name: Smoke npm artifacts (win32-x64 recovery)
    needs: release-metadata
    if: >-
      needs.release-metadata.outputs.should_release == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      needs.release-metadata.outputs.mode == 'windows-smoke-only'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          architecture: x64

      - name: Validate source release run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
          CHANNEL: ${{ needs.release-metadata.outputs.channel }}
        run: |
          node npm/release/validate-recovery-source.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --purpose windows-smoke \
            --github-output "$GITHUB_OUTPUT"

      - name: Download exact npm tarballs from source release run
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/ci/download-verified-artifact.sh
          "$GITHUB_REPOSITORY" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" npm-release-packages

      - name: Pin npm used by release consumers
        run: npm install --global npm@11.12.1 --no-audit --no-fund

      - name: Install and execute exact npm tarballs
        run: >-
          node npm/release/smoke-install.mjs
          --tarballs npm-release-packages
          --platform win32-x64
          --version ${{ needs.release-metadata.outputs.version }}

  release:
    name: Stage Draft Release
    needs:
      - build
      - release-metadata
      - smoke-npm-packages
    if: >-
      needs.release-metadata.outputs.should_release == 'true' &&
      (needs.release-metadata.outputs.mode == 'candidate' || needs.release-metadata.outputs.mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
    outputs:
      artifact_digest: sha256:${{ steps.github-release-artifact.outputs['artifact-digest'] }}
      artifact_id: ${{ steps.github-release-artifact.outputs['artifact-id'] }}
    steps:
      - name: Download signed release binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: lpm-*
          merge-multiple: true
          path: binaries

      - name: List release binaries
        run: |
          set -euo pipefail
          find binaries -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Generate SHA256SUMS.txt
        working-directory: binaries
        run: |
          set -euo pipefail
          assets=(
            lpm-darwin-arm64.zip lpm-darwin-x64.zip
            lpm-linux-x64 lpm-linux-x64-musl lpm-linux-arm64
            lpm-win32-x64.exe lpm-sandbox-helper-win32-x64.exe
          )
          assets+=(lpm-darwin-arm64 lpm-darwin-x64)
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          echo "Manifest contents:"
          cat SHA256SUMS.txt

      # Hard-fail when the manifest's filename column drifts from the set
      # of files actually staged for upload — keeps a future contributor
      # who adds a published binary without extending the sha256sum step
      # from silently shipping unsigned bytes.
      - name: Verify every published binary is enumerated in SHA256SUMS.txt
        working-directory: binaries
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'SHA256SUMS.txt.sigstore' -printf '%f\n' | sort > /tmp/published.txt
          awk '{print $2}' SHA256SUMS.txt | sort > /tmp/manifest.txt
          if ! diff -u /tmp/published.txt /tmp/manifest.txt; then
            echo "::error::SHA256SUMS.txt enumeration drifted from binaries/ contents. Update the sha256sum step above to add or remove entries."
            exit 1
          fi
          echo "Manifest covers every published binary."

      - name: Attest SHA256SUMS.txt via Sigstore
        id: attest
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: binaries/SHA256SUMS.txt

      - name: Stage Sigstore bundle next to manifest
        run: cp "${{ steps.attest.outputs.bundle-path }}" binaries/SHA256SUMS.txt.sigstore

      - name: Remove stale draft release for the exact tag
        if: needs.release-metadata.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published_ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\" and .draft == false) | .id")
          if [ -n "$published_ids" ]; then
            echo "::error::A published release already exists for $RELEASE_TAG; refusing to replace it."
            exit 1
          fi

          draft_ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\" and .draft == true) | .id")
          draft_count=$(printf '%s\n' "$draft_ids" | awk 'NF { count += 1 } END { print count + 0 }')
          if [ "$draft_count" -gt 1 ]; then
            echo "::error::Multiple stale drafts exist for $RELEASE_TAG; refusing ambiguous cleanup."
            exit 1
          fi
          if [ "$draft_count" -eq 1 ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${draft_ids}"
          fi

      # The release action retries while a new release becomes discoverable by
      # tag. Supplying one precomputed body keeps those retries idempotent.
      - name: Generate release notes
        if: needs.release-metadata.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq '.body' > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Create draft GitHub Release
        if: needs.release-metadata.outputs.mode == 'full'
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: binaries/*
          body_path: ${{ runner.temp }}/release-notes.md
          append_body: false
          fail_on_unmatched_files: true
          overwrite_files: false
          draft: true
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          make_latest: false
          target_commitish: ${{ github.sha }}

      - name: Upload exact staged GitHub release
        id: github-release-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: staged-github-release
          path: binaries/
          if-no-files-found: error
          retention-days: 1

  smoke-standalone-installer:
    name: ${{ matrix.name }}
    needs:
      - release
      - release-metadata
    if: >-
      needs.release-metadata.outputs.should_release == 'true' &&
      (needs.release-metadata.outputs.mode == 'candidate' || needs.release-metadata.outputs.mode == 'full')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Smoke standalone installer on Debian 12 (x64)
            platform: linux
            arch: x64
            os: ubuntu-latest
            binary: lpm-linux-x64
            image: debian:12.11-slim@sha256:cea2634840f5a87503d8210e4df97b9f23a2acd67ff860a76c133d963032f866
          - name: Smoke standalone installer on Debian 12 (arm64)
            platform: linux
            arch: arm64
            os: ubuntu-24.04-arm
            binary: lpm-linux-arm64
            image: debian:12.11-slim@sha256:f6af819c6ac3902cbd1df3c4a00208abf8bfbbdf65fd25bbb330d2f8ad961d29
          - name: Smoke standalone installer on macOS (arm64)
            platform: macos
            arch: arm64
            os: macos-15
          - name: Smoke standalone installer on macOS (x64)
            platform: macos
            arch: x64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download exact staged GitHub release
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.release.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.release.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/ci/download-verified-artifact.sh
          "$GITHUB_REPOSITORY" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" staged-release

      - name: Install exact release through install.sh
        if: matrix.platform == 'linux'
        env:
          EXPECTED_BINARY: ${{ matrix.binary }}
          LPM_INSTALL_VERSION: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          docker run --rm \
              -e EXPECTED_BINARY \
              -e LPM_INSTALL_VERSION \
              -v "$PWD:/work:ro" \
              -v "$PWD/staged-release:/release:ro" \
              "${{ matrix.image }}" \
            sh -ceu '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl python3
              rm -rf /var/lib/apt/lists/*

              cd /release
              python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lpm-release-server.log 2>&1 &
              attempt=0
              until curl --fail --silent --output /dev/null http://127.0.0.1:8765/SHA256SUMS.txt; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 30 ]; then
                  cat /tmp/lpm-release-server.log
                  exit 1
                fi
                sleep 0.1
              done

              export HOME=/tmp/lpm-home
              export LPM_INSTALL_TEST_DOWNLOAD_BASE=http://127.0.0.1:8765
              sh /work/install.sh
              actual=$("$HOME/.lpm/bin/lpm" --version)
              test "$actual" = "lpm ${LPM_INSTALL_VERSION#v}"
            '

      - name: Install exact macOS release through install.sh
        if: matrix.platform == 'macos'
        env:
          LPM_INSTALL_VERSION: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          version="${LPM_INSTALL_VERSION#v}"
          raw_asset="lpm-darwin-${{ matrix.arch }}"
          sigstore_bundle="staged-release/SHA256SUMS.txt.sigstore"
          integrated_time=$(jq -er 'first(.. | objects | .integratedTime? // empty)' "$sigstore_bundle")
          published_at=$(date -u -r "$integrated_time" '+%Y-%m-%dT%H:%M:%SZ')
          printf '{"tag_name":"v%s","published_at":"%s"}\n' "$version" "$published_at" \
            > "staged-release/release-v${version}.json"

          python3 -m http.server 8765 --bind 127.0.0.1 \
            --directory staged-release >"$RUNNER_TEMP/lpm-release-server.log" 2>&1 &
          server_pid=$!
          migration_pid=''
          cleanup() {
            if [ -n "$migration_pid" ]; then
              kill "$migration_pid" 2>/dev/null || true
            fi
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/SHA256SUMS.txt; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/lpm-release-server.log"
              exit 1
            fi
            sleep 0.1
          done

          # Exercise the real compatibility path before install.sh replaces it:
          # a raw 0.75-compatible artifact starts as ~/.lpm/bin/lpm, a normal
          # command triggers the signed-bundle migration, and the same process
          # re-execs from the installed app before it runs the command.
          test ! -e "$HOME/.lpm/bin/lpm"
          mkdir -p "$HOME/.lpm/bin"
          cp "staged-release/$raw_asset" "$HOME/.lpm/bin/lpm"
          chmod 0755 "$HOME/.lpm/bin/lpm"
          cmp -s "staged-release/$raw_asset" "$HOME/.lpm/bin/lpm"

          now=$(date +%s)
          printf '{"latest":"%s","lastCheck":%s,"nightly":{"latest":"%s","lastCheck":%s}}\n' \
            "$version" "$now" "$version" "$now" > "$HOME/.lpm/update-check.json"

          migration_project="$RUNNER_TEMP/raw-bundle-migration-project"
          migration_log="$RUNNER_TEMP/raw-bundle-migration.log"
          mkdir -p "$migration_project"
          printf '%s\n' \
            '{"name":"raw-bundle-migration-smoke","version":"1.0.0","scripts":{"migration-proof":"touch .migration-started && while [ ! -e .migration-finish ]; do sleep 0.1; done"}}' \
            > "$migration_project/package.json"
          (
            cd "$migration_project"
            exec env LPM_NO_UPDATE_CHECK=1 \
              LPM_GITHUB_RELEASE_DOWNLOAD_URL_OVERRIDE='http://127.0.0.1:8765/{file}?tag={tag}' \
              LPM_GITHUB_RELEASE_BY_TAG_URL_OVERRIDE='http://127.0.0.1:8765/release-v{tag}.json' \
              "$HOME/.lpm/bin/lpm" run migration-proof > "$migration_log" 2>&1
          ) &
          migration_pid=$!

          for attempt in {1..600}; do
            if [ -e "$migration_project/.migration-started" ]; then
              break
            fi
            if ! kill -0 "$migration_pid" 2>/dev/null; then
              cat "$migration_log"
              echo "::error::Raw-to-bundle migration command exited before its script started."
              exit 1
            fi
            if [ "$attempt" -eq 600 ]; then
              cat "$migration_log"
              echo "::error::Timed out waiting for the migrated command to start."
              exit 1
            fi
            sleep 0.1
          done

          expected_migrated_executable="$HOME/.lpm/libexec/LPM CLI.app/Contents/MacOS/lpm-rs"
          test -L "$HOME/.lpm/bin/lpm"
          test -L "$HOME/.lpm/bin/lpx"
          test "$(readlink "$HOME/.lpm/bin/lpm")" = '../libexec/LPM CLI.app/Contents/MacOS/lpm-rs'
          test "$(readlink "$HOME/.lpm/bin/lpx")" = '../libexec/LPM CLI.app/Contents/MacOS/lpm-rs'
          test "$(realpath "$HOME/.lpm/bin/lpm")" = "$expected_migrated_executable"
          /usr/sbin/lsof -a -p "$migration_pid" -d txt -Fn \
            | grep -Fxq "n$expected_migrated_executable"

          touch "$migration_project/.migration-finish"
          if ! wait "$migration_pid"; then
            cat "$migration_log"
            exit 1
          fi
          migration_pid=''
          test "$("$HOME/.lpm/bin/lpm" --version)" = "lpm $version"

          LPM_INSTALL_TEST_DOWNLOAD_BASE=http://127.0.0.1:8765 sh install.sh

          app="$HOME/.lpm/libexec/LPM CLI.app"
          executable="$app/Contents/MacOS/lpm-rs"
          expected_version="lpm ${LPM_INSTALL_VERSION#v}"
          expected_link='../libexec/LPM CLI.app/Contents/MacOS/lpm-rs'
          access_group='823S8YKMRW.dev.lpm.vault.shared'

          test -d "$app"
          test -x "$executable"
          test -x "$HOME/.lpm/libexec/LPM CLI.app/Contents/MacOS/lpm-rs"
          test -L "$HOME/.lpm/bin/lpm"
          test -L "$HOME/.lpm/bin/lpx"
          test "$(readlink "$HOME/.lpm/bin/lpm")" = "$expected_link"
          test "$(readlink "$HOME/.lpm/bin/lpx")" = "$expected_link"
          test "$("$executable" --version)" = "$expected_version"

          /usr/bin/codesign --verify --strict --verbose=4 "$app"
          signature_details=$(/usr/bin/codesign -dvv "$app" 2>&1)
          grep -Fxq 'Identifier=dev.lpm.cli' <<<"$signature_details"
          grep -Fxq 'TeamIdentifier=823S8YKMRW' <<<"$signature_details"

          entitlements="$RUNNER_TEMP/lpm-cli-entitlements.plist"
          /usr/bin/codesign -d --entitlements :- "$app" > "$entitlements"
          /usr/libexec/PlistBuddy -c 'Print :keychain-access-groups' "$entitlements" \
            | grep -Fq "$access_group"

          profile="$RUNNER_TEMP/lpm-cli-profile.plist"
          /usr/bin/security cms -D -i "$app/Contents/embedded.provisionprofile" > "$profile"
          test "$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile")" = '823S8YKMRW'
          profile_application=$(
            /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$profile" 2>/dev/null ||
              /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile"
          )
          test "$profile_application" = '823S8YKMRW.dev.lpm.cli'
          profile_access_groups=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:keychain-access-groups' "$profile")
          printf '%s\n' "$profile_access_groups" | awk \
            -v exact="$access_group" \
            -v wildcard='823S8YKMRW.*' \
            '{ value = $0; gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); if (value == exact || value == wildcard) found = 1 } END { exit(found ? 0 : 1) }'

          /usr/bin/xcrun stapler validate "$app"
          /usr/sbin/spctl --assess --type execute --verbose=4 "$app"

  seal-candidate:
    name: Seal stable release candidate
    needs:
      - release
      - release-metadata
      - pack-npm-packages
      - smoke-npm-packages
      - smoke-standalone-installer
    if: >-
      always() &&
      needs.release-metadata.outputs.mode == 'candidate' &&
      needs.release.result == 'success' &&
      needs.pack-npm-packages.result == 'success' &&
      needs.smoke-npm-packages.result == 'success' &&
      needs.smoke-standalone-installer.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download exact staged GitHub assets
        env:
          ARTIFACT_DIGEST: ${{ needs.release.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.release.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/ci/download-verified-artifact.sh
          "$GITHUB_REPOSITORY" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" staged-github-release

      - name: Download exact npm tarballs
        env:
          ARTIFACT_DIGEST: ${{ needs.pack-npm-packages.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.pack-npm-packages.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/ci/download-verified-artifact.sh
          "$GITHUB_REPOSITORY" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" npm-release-packages

      - name: Seal candidate payload and source identity
        run: >-
          node npm/release/seal-release-candidate.mjs
          --github-release "$PWD/staged-github-release"
          --npm-packages "$PWD/npm-release-packages"
          --output "$PWD/release-candidate"
          --repository "$GITHUB_REPOSITORY"
          --source-sha "$GITHUB_SHA"
          --source-run-id "$GITHUB_RUN_ID"
          --version "${{ needs.release-metadata.outputs.version }}"

      - name: Verify sealed candidate
        run: >-
          node npm/release/verify-release-candidate.mjs
          --candidate "$PWD/release-candidate"
          --repository "$GITHUB_REPOSITORY"
          --source-sha "$GITHUB_SHA"
          --source-run-id "$GITHUB_RUN_ID"
          --version "${{ needs.release-metadata.outputs.version }}"

      - name: Upload immutable stable candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stable-release-candidate-${{ needs.release-metadata.outputs.version }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Record promotion instructions
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          {
            echo "## Stable release candidate is ready"
            echo
            echo "Candidate run ID: \`$GITHUB_RUN_ID\`"
            echo "Source commit: \`$GITHUB_SHA\`"
            echo
            echo "> Keep \`main\` at this exact commit until GitHub, npm, and Homebrew promotion all succeed. Promotion and fresh-run recovery require this invariant so npm provenance stays truthful."
            echo
            echo "Promote with:"
            echo '```bash'
            echo "gh workflow run release.yml --ref main -f channel=stable -f mode=promote -f version=$VERSION -f source_run_id=$GITHUB_RUN_ID"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-promotion:
    name: Validate and import release candidate
    needs: release-metadata
    if: needs.release-metadata.outputs.should_release == 'true' && needs.release-metadata.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_digest: ${{ steps.source.outputs.artifact_digest }}
      artifact_id: ${{ steps.source.outputs.artifact_id }}
      github_artifact_digest: sha256:${{ steps.github-scope.outputs['artifact-digest'] }}
      github_artifact_id: ${{ steps.github-scope.outputs['artifact-id'] }}
      npm_artifact_digest: sha256:${{ steps.npm-scope.outputs['artifact-digest'] }}
      npm_artifact_id: ${{ steps.npm-scope.outputs['artifact-id'] }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_run_id: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Validate candidate workflow and artifact identity
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node npm/release/validate-release-candidate-source.mjs
          --repository "$GITHUB_REPOSITORY"
          --run-id "${{ inputs.source_run_id }}"
          --version "${{ needs.release-metadata.outputs.version }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Bind promotion provenance to candidate source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ] || [ "$GITHUB_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Promotion must run from main while it still points to the exact candidate commit $SOURCE_SHA."
            exit 1
          fi

      - name: Download exact candidate and enforce GitHub artifact digest
        env:
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/download-verified-artifact.sh \
            "$GITHUB_REPOSITORY" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" release-candidate

      - name: Verify sealed candidate
        run: >-
          node npm/release/verify-release-candidate.mjs
          --candidate "$PWD/release-candidate"
          --repository "$GITHUB_REPOSITORY"
          --source-sha "${{ steps.source.outputs.source_sha }}"
          --source-run-id "${{ inputs.source_run_id }}"
          --version "${{ needs.release-metadata.outputs.version }}"

      - name: Verify exact npm package set
        run: >-
          node npm/release/verify-packages.mjs
          --packages "$PWD/release-candidate/npm-release-packages"
          --version "${{ needs.release-metadata.outputs.version }}"

      - name: Split verified candidate into bounded promotion scopes
        run: |
          set -euo pipefail
          mkdir promotion-github-candidate promotion-npm-candidate
          cp release-candidate/release-candidate.json promotion-github-candidate/
          cp release-candidate/release-candidate.json promotion-npm-candidate/
          cp -R release-candidate/github-release promotion-github-candidate/
          cp -R release-candidate/npm-release-packages promotion-npm-candidate/

      - name: Upload verified GitHub release scope
        id: github-scope
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-promotion-github-candidate
          path: promotion-github-candidate/
          if-no-files-found: error
          retention-days: 1

      - name: Upload verified npm release scope
        id: npm-scope
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-promotion-npm-candidate
          path: promotion-npm-candidate/
          if-no-files-found: error
          retention-days: 1

  stage-promotion-release:
    name: Attest verified stable candidate
    needs:
      - prepare-promotion
      - release-metadata
    if: needs.prepare-promotion.result == 'success' && needs.release-metadata.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.prepare-promotion.outputs.source_sha }}
    outputs:
      artifact_digest: sha256:${{ steps.github-assets.outputs['artifact-digest'] }}
      artifact_id: ${{ steps.github-assets.outputs['artifact-id'] }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download verified candidate
        env:
          ARTIFACT_DIGEST: ${{ needs.prepare-promotion.outputs.github_artifact_digest }}
          ARTIFACT_ID: ${{ needs.prepare-promotion.outputs.github_artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/ci/download-verified-artifact.sh
          "$GITHUB_REPOSITORY" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" release-candidate

      - name: Verify sealed candidate before attestation
        run: >-
          node npm/release/verify-release-candidate.mjs
          --candidate "$PWD/release-candidate"
          --repository "$GITHUB_REPOSITORY"
          --scope github-release
          --source-sha "$SOURCE_SHA"
          --source-run-id "${{ inputs.source_run_id }}"
          --version "${{ needs.release-metadata.outputs.version }}"

      - name: Create fresh promotion-time Sigstore proof
        id: attest
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release-candidate/github-release/SHA256SUMS.txt

      - name: Replace candidate smoke proof with promotion proof
        run: cp "${{ steps.attest.outputs.bundle-path }}" release-candidate/github-release/SHA256SUMS.txt.sigstore

      - name: Upload promotion-time GitHub assets
        id: github-assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: promotion-github-release
          path: release-candidate/github-release/
          if-no-files-found: error
          retention-days: 1

  publish-promotion-platform:
    name: Publish candidate npm packages
    needs:
      - prepare-promotion
      - finalize-promotion-release
      - release-metadata
    if: needs.finalize-promotion-release.result == 'success' && needs.release-metadata.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      NPM_TAG: latest
      SOURCE_SHA: ${{ needs.prepare-promotion.outputs.source_sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Download verified candidate
        env:
          ARTIFACT_DIGEST: ${{ needs.prepare-promotion.outputs.npm_artifact_digest }}
          ARTIFACT_ID: ${{ needs.prepare-promotion.outputs.npm_artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/ci/download-verified-artifact.sh
          "$GITHUB_REPOSITORY" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" release-candidate

      - name: Verify candidate and exact npm tarballs
        run: |
          node npm/release/verify-release-candidate.mjs \
            --candidate "$PWD/release-candidate" \
            --repository "$GITHUB_REPOSITORY" \
            --scope npm-release-packages \
            --source-sha "$SOURCE_SHA" \
            --source-run-id "${{ inputs.source_run_id }}" \
            --version "${{ needs.release-metadata.outputs.version }}"
          node npm/release/verify-packages.mjs \
            --packages "$PWD/release-candidate/npm-release-packages" \
            --version "${{ needs.release-metadata.outputs.version }}"

      - name: Install trusted-publisher npm client
        run: |
          npm install --global npm@11.12.1 --no-audit --no-fund
          test "$(npm --version)" = 11.12.1

      - name: Preflight every platform package
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-x64-musl linux-arm64 win32-x64; do
            npm view "@lpm-registry/cli-${platform}" name --json >/dev/null || {
              echo "::error::@lpm-registry/cli-${platform} is missing or has no trusted-publisher setup."
              exit 1
            }
          done

      - name: Publish exact platform tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packages="$PWD/release-candidate/npm-release-packages"
          manifest="$packages/release-packages.json"
          publish_package() {
            package=$1
            tarball=$(jq -er --arg package "$package" '.packages[] | select(.name == $package) | .tarball' "$manifest")
            set +e
            npm publish "$packages/$tarball" --provenance --access public --tag "$NPM_TAG" \
              2>&1 | tee "$RUNNER_TEMP/npm-publish.log"
            exit_code=${PIPESTATUS[0]}
            set -e
            if [ "$exit_code" -ne 0 ]; then
              if grep -q "cannot publish over the previously published" "$RUNNER_TEMP/npm-publish.log"; then
                node npm/release/verify-published-package.mjs \
                  --manifest "$manifest" \
                  --package "$package" \
                  --tag "$NPM_TAG" \
                  --source-sha "$GITHUB_SHA" \
                  --source-run-id trusted \
                  --source-ref refs/heads/main \
                  --tarball "$packages/$tarball"
              else
                return "$exit_code"
              fi
            fi
          }
          publish_package @lpm-registry/cli-linux-x64-musl
          publish_package @lpm-registry/cli-darwin-arm64
          publish_package @lpm-registry/cli-darwin-x64
          publish_package @lpm-registry/cli-linux-x64
          publish_package @lpm-registry/cli-linux-arm64
          publish_package @lpm-registry/cli-win32-x64

      - name: Publish exact wrapper tarball last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packages="$PWD/release-candidate/npm-release-packages"
          manifest="$packages/release-packages.json"
          tarball=$(jq -er '.packages[] | select(.name == "@lpm-registry/cli") | .tarball' "$manifest")
          set +e
          npm publish "$packages/$tarball" --provenance --access public --tag latest \
            2>&1 | tee "$RUNNER_TEMP/npm-wrapper-publish.log"
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$exit_code" -ne 0 ]; then
            if grep -q "cannot publish over the previously published" "$RUNNER_TEMP/npm-wrapper-publish.log"; then
              node npm/release/verify-published-package.mjs \
                --manifest "$manifest" \
                --package @lpm-registry/cli \
                --tag latest \
                --source-sha "$GITHUB_SHA" \
                --source-run-id trusted \
                --source-ref refs/heads/main \
                --tarball "$packages/$tarball"
            else
              exit "$exit_code"
            fi
          fi

      - name: Verify published wrapper install
        run: |
          set -euo pipefail
          version="${{ needs.release-metadata.outputs.version }}"
          deadline=$((SECONDS + 300))
          attempt=0
          prefix=
          cache=
          cleanup_attempt() {
            if [ -n "$prefix" ]; then rm -rf "$prefix"; fi
            if [ -n "$cache" ]; then rm -rf "$cache"; fi
            prefix=
            cache=
          }
          trap cleanup_attempt EXIT
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            prefix=$(mktemp -d)
            cache=$(mktemp -d)
            if npm install -g --prefix "$prefix" --cache "$cache" --prefer-online --no-audit --no-fund \
                 "@lpm-registry/cli@${version}" &&
               test "$("$prefix/bin/lpm" --version)" = "lpm $version" &&
               "$prefix/bin/lpx" --help >/dev/null &&
               test "$(npm view @lpm-registry/cli dist-tags.latest --cache "$cache" --prefer-online)" = "$version"; then
              cleanup_attempt
              exit 0
            fi
            cleanup_attempt
            backoff=$((5 * (1 << (attempt - 1))))
            if [ "$backoff" -gt 30 ]; then backoff=30; fi
            remaining=$((deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then break; fi
            if [ "$backoff" -gt "$remaining" ]; then backoff=$remaining; fi
            sleep "$backoff"
          done
          echo "::error::Published wrapper was not installable after the 300-second propagation window."
          exit 1

  finalize-promotion-release:
    name: Create stable tag and publish verified release
    needs:
      - prepare-promotion
      - release-metadata
      - stage-promotion-release
    if: needs.stage-promotion-release.result == 'success' && needs.release-metadata.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare-promotion.outputs.source_sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download sealed candidate
        env:
          ARTIFACT_DIGEST: ${{ needs.prepare-promotion.outputs.github_artifact_digest }}
          ARTIFACT_ID: ${{ needs.prepare-promotion.outputs.github_artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/ci/download-verified-artifact.sh
          "$GITHUB_REPOSITORY" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" release-candidate

      - name: Download promotion-time GitHub assets
        env:
          ARTIFACT_DIGEST: ${{ needs.stage-promotion-release.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.stage-promotion-release.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/ci/download-verified-artifact.sh
          "$GITHUB_REPOSITORY" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" promotion-github-release

      - name: Reverify candidate and promotion asset inventory
        run: |
          set -euo pipefail
          node npm/release/verify-release-candidate.mjs \
            --candidate "$PWD/release-candidate" \
            --repository "$GITHUB_REPOSITORY" \
            --scope github-release \
            --source-sha "$SOURCE_SHA" \
            --source-run-id "${{ inputs.source_run_id }}" \
            --version "${{ needs.release-metadata.outputs.version }}"
          find release-candidate/github-release -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/candidate-assets"
          find promotion-github-release -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/promotion-assets"
          diff -u "$RUNNER_TEMP/candidate-assets" "$RUNNER_TEMP/promotion-assets"
          while IFS= read -r asset; do
            if [ "$asset" != SHA256SUMS.txt.sigstore ]; then
              cmp "release-candidate/github-release/$asset" "promotion-github-release/$asset"
            fi
          done < "$RUNNER_TEMP/candidate-assets"
          (cd promotion-github-release && sha256sum --check --strict SHA256SUMS.txt)

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Verify promotion-time Sigstore proof
        run: >-
          cosign verify-blob
          --bundle promotion-github-release/SHA256SUMS.txt.sigstore
          --certificate-identity-regexp '^https://github\.com/lpm-dev/rust-client/\.github/workflows/release\.yml@refs/heads/main$'
          --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          promotion-github-release/SHA256SUMS.txt

      - name: Resolve idempotent release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exact=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | \
            jq -c --arg tag "$RELEASE_TAG" 'add | [.[] | select(.tag_name == $tag)]')
          count=$(printf '%s' "$exact" | jq length)
          if [ "$count" -gt 1 ]; then
            echo "::error::Multiple releases exist for $RELEASE_TAG."
            exit 1
          fi
          if [ "$count" -eq 1 ]; then
            draft=$(printf '%s' "$exact" | jq -r '.[0].draft')
            if [ "$draft" = true ]; then
              draft_id=$(printf '%s' "$exact" | jq -er '.[0].id')
              echo "::notice::Deleting stale draft $draft_id for $RELEASE_TAG before retrying its immutable upload."
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${draft_id}"
            else
              printf '%s' "$exact" | jq -e '.[0]' > "$RUNNER_TEMP/existing-release.json"
              prerelease=$(jq -r '.prerelease' "$RUNNER_TEMP/existing-release.json")
              if [ "$prerelease" != false ]; then
                echo "::error::The existing $RELEASE_TAG release is marked as a prerelease."
                exit 1
              fi
              published_at=$(jq -er '.published_at // error("missing published_at")' "$RUNNER_TEMP/existing-release.json")
              jq -r '.assets[].name' "$RUNNER_TEMP/existing-release.json" | sort > "$RUNNER_TEMP/existing-assets"
              diff -u "$RUNNER_TEMP/promotion-assets" "$RUNNER_TEMP/existing-assets"
              mkdir existing-release
              while IFS= read -r asset; do
                asset_id=$(jq -er --arg asset "$asset" \
                  '[.assets[] | select(.name == $asset)] | if length == 1 then .[0].id else error("ambiguous asset") end' \
                  "$RUNNER_TEMP/existing-release.json")
                gh api -H 'Accept: application/octet-stream' \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "existing-release/$asset"
                if [ "$asset" != SHA256SUMS.txt.sigstore ]; then
                  cmp "promotion-github-release/$asset" "existing-release/$asset"
                fi
              done < "$RUNNER_TEMP/promotion-assets"
              cosign verify-blob \
                --bundle existing-release/SHA256SUMS.txt.sigstore \
                --certificate-identity-regexp '^https://github\.com/lpm-dev/rust-client/\.github/workflows/release\.yml@refs/heads/main$' \
                --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
                existing-release/SHA256SUMS.txt
              integrated_time=$(jq -er 'first(.. | objects | .integratedTime? // empty)' \
                existing-release/SHA256SUMS.txt.sigstore)
              published_epoch=$(date -d "$published_at" +%s)
              if [ "$integrated_time" -lt $((published_epoch - 3600)) ] || \
                 [ "$integrated_time" -gt $((published_epoch + 86400)) ]; then
                echo "::error::The existing Sigstore proof is outside the self-update replay window."
                exit 1
              fi
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG exists without its exact published release."
            exit 1
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$SOURCE_SHA" \
            --jq '.body' > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Create draft and upload exact assets
        if: steps.release-state.outputs.publish == 'true'
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: promotion-github-release/*
          body_path: ${{ runner.temp }}/release-notes.md
          append_body: false
          fail_on_unmatched_files: true
          overwrite_files: false
          draft: true
          prerelease: false
          make_latest: false
          target_commitish: ${{ env.SOURCE_SHA }}

      - name: Verify exact draft and publish stable release
        if: steps.release-state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exact=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | \
            jq -c --arg tag "$RELEASE_TAG" \
              'add | [.[] | select(.tag_name == $tag and .draft == true)]')
          if [ "$(printf '%s' "$exact" | jq length)" -ne 1 ]; then
            echo "::error::Expected exactly one draft for $RELEASE_TAG after upload."
            exit 1
          fi
          printf '%s' "$exact" | jq -e '.[0]' > "$RUNNER_TEMP/draft-release.json"
          draft_target=$(jq -er '.target_commitish' "$RUNNER_TEMP/draft-release.json")
          if [ "$draft_target" != "$SOURCE_SHA" ]; then
            echo "::error::Draft target is $draft_target, expected immutable source $SOURCE_SHA."
            exit 1
          fi
          jq -r '.assets[].name' "$RUNNER_TEMP/draft-release.json" | sort > "$RUNNER_TEMP/draft-assets"
          diff -u "$RUNNER_TEMP/promotion-assets" "$RUNNER_TEMP/draft-assets"
          mkdir "$RUNNER_TEMP/draft-release"
          while IFS= read -r asset; do
            asset_id=$(jq -er --arg asset "$asset" \
              '[.assets[] | select(.name == $asset)] | if length == 1 then .[0].id else error("ambiguous asset") end' \
              "$RUNNER_TEMP/draft-release.json")
            gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$RUNNER_TEMP/draft-release/$asset"
            cmp "promotion-github-release/$asset" "$RUNNER_TEMP/draft-release/$asset"
          done < "$RUNNER_TEMP/promotion-assets"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/draft-release/SHA256SUMS.txt.sigstore" \
            --certificate-identity-regexp '^https://github\.com/lpm-dev/rust-client/\.github/workflows/release\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$RUNNER_TEMP/draft-release/SHA256SUMS.txt"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG appeared while the draft was being verified; refusing to publish."
            exit 1
          fi
          release_id=$(jq -er '.id' "$RUNNER_TEMP/draft-release.json")
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true >/dev/null

      - name: Verify published tag and exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)
          test "$tag_sha" = "$SOURCE_SHA"
          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [ "$latest_tag" != "$RELEASE_TAG" ]; then
            echo "::error::Latest stable release is $latest_tag, expected $RELEASE_TAG."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$RUNNER_TEMP/published-release.json"
          jq -e '.draft == false and .prerelease == false and (.published_at | type == "string" and length > 0)' \
            "$RUNNER_TEMP/published-release.json" >/dev/null
          jq -r '.assets[].name' "$RUNNER_TEMP/published-release.json" | sort > "$RUNNER_TEMP/published-assets"
          diff -u "$RUNNER_TEMP/promotion-assets" "$RUNNER_TEMP/published-assets"
          rm -rf "$RUNNER_TEMP/published-release"
          mkdir "$RUNNER_TEMP/published-release"
          while IFS= read -r asset; do
            asset_id=$(jq -er --arg asset "$asset" \
              '[.assets[] | select(.name == $asset)] | if length == 1 then .[0].id else error("ambiguous asset") end' \
              "$RUNNER_TEMP/published-release.json")
            gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$RUNNER_TEMP/published-release/$asset"
            if [ "$asset" != SHA256SUMS.txt.sigstore ]; then
              cmp "promotion-github-release/$asset" "$RUNNER_TEMP/published-release/$asset"
            fi
          done < "$RUNNER_TEMP/promotion-assets"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/published-release/SHA256SUMS.txt.sigstore" \
            --certificate-identity-regexp '^https://github\.com/lpm-dev/rust-client/\.github/workflows/release\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$RUNNER_TEMP/published-release/SHA256SUMS.txt"
          integrated_time=$(jq -er 'first(.. | objects | .integratedTime? // empty)' \
            "$RUNNER_TEMP/published-release/SHA256SUMS.txt.sigstore")
          published_at=$(jq -er '.published_at' "$RUNNER_TEMP/published-release.json")
          published_epoch=$(date -d "$published_at" +%s)
          if [ "$integrated_time" -lt $((published_epoch - 3600)) ] || \
             [ "$integrated_time" -gt $((published_epoch + 86400)) ]; then
            echo "::error::The published Sigstore proof is outside the self-update replay window."
            exit 1
          fi

      - name: Record promotion recovery instructions
        if: always()
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          {
            echo "## Stable promotion recovery"
            echo
            echo "If a later npm or Homebrew job fails, use **Re-run failed jobs** within the one-day scoped-artifact retention window. Do not use **Re-run all jobs**."
            echo
            echo "A fresh promote run verifies any already-published immutable release/package before continuing, but only while \`main\` still equals the candidate source commit and the seven-day candidate artifact is retained:"
            echo '```bash'
            echo "gh workflow run release.yml --ref main -f channel=stable -f mode=promote -f version=$VERSION -f source_run_id=$SOURCE_RUN_ID"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish Smoke-Verified Release
    needs:
      - release
      - release-metadata
      - smoke-standalone-installer
    if: >-
      always() &&
      needs.release.result == 'success' &&
      needs.smoke-standalone-installer.result == 'success' &&
      needs.release-metadata.outputs.should_release == 'true' &&
      needs.release-metadata.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Promote the exact draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          MAKE_LATEST: ${{ needs.release-metadata.outputs.channel == 'stable' }}
        run: |
          set -euo pipefail
          release_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\" and .draft == true) | .id")
          if [ -z "$release_id" ] || [ "$(printf '%s\n' "$release_id" | wc -l | tr -d ' ')" != "1" ]; then
            echo "::error::Expected exactly one draft release for $RELEASE_TAG."
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false \
            -f make_latest="$MAKE_LATEST" >/dev/null

  publish-npm-platform:
    name: Publish npm Platform Packages
    needs:
      - release
      - release-metadata
      - smoke-standalone-installer
      - publish-release
    if: >-
      always() &&
      needs.release-metadata.outputs.should_release == 'true' &&
      ((needs.release.result == 'success' &&
      needs.smoke-standalone-installer.result == 'success' &&
      needs.publish-release.result == 'success' &&
      needs.release-metadata.outputs.mode == 'full') ||
      (github.event_name == 'workflow_dispatch' &&
      needs.release-metadata.outputs.mode == 'npm-publish-only'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      NPM_TAG: ${{ needs.release-metadata.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Validate recovery source run
        id: source
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'npm-publish-only'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
          CHANNEL: ${{ needs.release-metadata.outputs.channel }}
        run: |
          node npm/release/validate-recovery-source.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --purpose npm-publish \
            --github-output "$GITHUB_OUTPUT"

      - name: Download verified npm tarballs
        if: inputs.mode != 'npm-publish-only'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-release-packages
          path: npm-release-packages

      - name: Download exact npm tarballs from source release run
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'npm-publish-only'
        env:
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/ci/download-verified-artifact.sh
          "$GITHUB_REPOSITORY" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" npm-release-packages

      - name: Verify recovery artifact version
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'npm-publish-only'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          ARTIFACT_VERSION=$(jq -r '.version' npm-release-packages/release-packages.json)
          test "$ARTIFACT_VERSION" = "$INPUT_VERSION"

      - name: Verify npm release package artifacts
        run: >-
          node npm/release/verify-packages.mjs
          --packages "$PWD/npm-release-packages"
          --version "${{ needs.release-metadata.outputs.version }}"

      - name: Install pinned npm 11 (required for trusted publishers OIDC)
        run: |
          npm install --global npm@11.12.1 --no-audit --no-fund
          test "$(npm --version)" = "11.12.1"

      - name: Preflight npm platform package existence
        run: |
          set -euo pipefail
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            package="@lpm-registry/cli-${platform}"
            if ! npm view "$package" name --json >/dev/null; then
              echo "::error::$package does not exist on npm. Bootstrap it and configure this release workflow as its trusted publisher before retrying. No npm packages have been published."
              exit 1
            fi
          done

      - name: Publish platform packages via trusted publishers (OIDC, tokenless)
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.release-metadata.outputs.mode == 'full' && github.sha || steps.source.outputs.source_sha }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.release-metadata.outputs.mode == 'full' && github.run_id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          MANIFEST=npm-release-packages/release-packages.json
          VERSION=$(jq -r '.version' "$MANIFEST")

          publish_pkg() {
            local package="$1"
            local tarball
            tarball=$(jq -r --arg package "$package" \
              '.packages[] | select(.name == $package) | .tarball' "$MANIFEST")
            if [ -z "$tarball" ] || [ "$tarball" = "null" ]; then
              echo "::error::Verified release manifest does not contain $package"
              exit 1
            fi

            echo "Publishing ${package}@${VERSION} from verified tarball ${tarball}..."
            set +e
            npm publish "./npm-release-packages/$tarball" \
              --provenance --access public --tag "$NPM_TAG" 2>&1 | tee /tmp/npm-publish.log
            local exit_code=${PIPESTATUS[0]}
            set -e
            if [ "$exit_code" -ne 0 ]; then
              if grep -q "cannot publish over the previously published" /tmp/npm-publish.log; then
                node npm/release/verify-published-package.mjs \
                  --manifest "$MANIFEST" \
                  --package "$package" \
                  --tag "$NPM_TAG" \
                  --source-sha "$EXPECTED_SOURCE_SHA" \
                  --source-run-id "$EXPECTED_SOURCE_RUN_ID" \
                  --tarball "./npm-release-packages/$tarball"
              else
                return "$exit_code"
              fi
            fi
          }

          # The musl package is new and its trusted-publisher binding cannot be
          # queried through npm's public API. Publish it first so an absent or
          # incorrect OIDC binding fails before any established package changes.
          publish_pkg @lpm-registry/cli-linux-x64-musl

          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            publish_pkg "@lpm-registry/cli-${platform}"
          done
          publish_pkg @lpm-registry/cli-win32-x64

  publish-npm-wrapper:
    name: Publish @lpm-registry/cli wrapper
    needs:
      - pack-npm-packages
      - publish-npm-platform
      - release-metadata
    if: >-
      always() &&
      needs.release-metadata.outputs.should_release == 'true' &&
      ((needs.pack-npm-packages.result == 'success' && needs.publish-npm-platform.result == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
      needs.release-metadata.outputs.mode == 'wrapper-only') ||
      (github.event_name == 'workflow_dispatch' &&
      needs.release-metadata.outputs.mode == 'npm-publish-only' &&
      needs.publish-npm-platform.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      NPM_TAG: ${{ needs.release-metadata.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install pinned npm 11 (required for trusted publishers OIDC)
        run: |
          npm install --global npm@11.12.1 --no-audit --no-fund
          test "$(npm --version)" = "11.12.1"

      - name: Download verified full-release tarballs
        if: inputs.mode != 'wrapper-only' && inputs.mode != 'npm-publish-only'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-release-packages
          path: npm-release-packages

      - name: Validate recovery source run
        id: source
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.mode == 'npm-publish-only' || inputs.mode == 'wrapper-only')
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
          CHANNEL: ${{ needs.release-metadata.outputs.channel }}
          RECOVERY_PURPOSE: ${{ inputs.mode == 'wrapper-only' && 'wrapper-publish' || 'npm-publish' }}
        run: |
          node npm/release/validate-recovery-source.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --purpose "$RECOVERY_PURPOSE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download exact npm tarballs from source release run
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.mode == 'npm-publish-only' || inputs.mode == 'wrapper-only')
        env:
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/ci/download-verified-artifact.sh
          "$GITHUB_REPOSITORY" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" npm-release-packages

      - name: Verify recovery artifact version
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.mode == 'npm-publish-only' || inputs.mode == 'wrapper-only')
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          ARTIFACT_VERSION=$(jq -r '.version' npm-release-packages/release-packages.json)
          test "$ARTIFACT_VERSION" = "$INPUT_VERSION"

      - name: Verify npm release package artifacts
        run: >-
          node npm/release/verify-packages.mjs
          --packages "$PWD/npm-release-packages"
          --version "${{ needs.release-metadata.outputs.version }}"

      - name: Smoke wrapper-only recovery artifact
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'wrapper-only'
        run: |
          set -euo pipefail
          MANIFEST=npm-release-packages/release-packages.json
          VERSION=$(jq -r '.version' "$MANIFEST")
          TARBALL=$(jq -r '.packages[] | select(.name == "@lpm-registry/cli") | .tarball' "$MANIFEST")
          PREFIX=$(mktemp -d)
          trap 'rm -rf "$PREFIX"' EXIT
          cd "$PREFIX"
          npm install --prefix "$PREFIX" --ignore-scripts=false --no-audit --no-fund \
            --no-package-lock --no-save "$GITHUB_WORKSPACE/npm-release-packages/$TARBALL"
          actual=$("$PREFIX/node_modules/.bin/lpm" --version)
          test "$actual" = "lpm $VERSION"
          "$PREFIX/node_modules/.bin/lpx" --help >/dev/null

      - name: Publish exact verified wrapper tarball
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.release-metadata.outputs.mode == 'full' && github.sha || steps.source.outputs.source_sha }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.release-metadata.outputs.mode == 'full' && github.run_id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          MANIFEST=npm-release-packages/release-packages.json
          VERSION=$(jq -r '.version' "$MANIFEST")
          TARBALL=$(jq -r '.packages[] | select(.name == "@lpm-registry/cli") | .tarball' "$MANIFEST")
          if [ -z "$TARBALL" ] || [ "$TARBALL" = "null" ]; then
            echo "::error::Verified release manifest does not contain @lpm-registry/cli"
            exit 1
          fi
          echo "Publishing @lpm-registry/cli@${VERSION} from verified tarball ${TARBALL}..."
          set +e
          npm publish "./npm-release-packages/$TARBALL" \
            --provenance --access public --tag "$NPM_TAG" 2>&1 | tee /tmp/npm-publish.log
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$exit_code" -ne 0 ]; then
            if grep -q "cannot publish over the previously published" /tmp/npm-publish.log; then
              node npm/release/verify-published-package.mjs \
                --manifest "$MANIFEST" \
                --package "@lpm-registry/cli" \
                --tag "$NPM_TAG" \
                --source-sha "$EXPECTED_SOURCE_SHA" \
                --source-run-id "$EXPECTED_SOURCE_RUN_ID" \
                --tarball "./npm-release-packages/$TARBALL"
            else
              exit "$exit_code"
            fi
          fi

      - name: Verify published wrapper from npm
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' npm-release-packages/release-packages.json)
          REGISTRY_PROPAGATION_TIMEOUT_SECONDS=300
          deadline=$((SECONDS + REGISTRY_PROPAGATION_TIMEOUT_SECONDS))
          attempt=0
          install_verified=0

          PREFIX=
          NPM_CACHE=
          cleanup_attempt() {
            if [ -n "$PREFIX" ]; then
              rm -rf "$PREFIX"
            fi
            if [ -n "$NPM_CACHE" ]; then
              rm -rf "$NPM_CACHE"
            fi
            PREFIX=
            NPM_CACHE=
          }
          trap cleanup_attempt EXIT

          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            PREFIX=$(mktemp -d)
            NPM_CACHE=$(mktemp -d)
            : >/tmp/lpm-wrapper-smoke.log
            if npx npm@11.12.1 install -g --prefix "$PREFIX" \
                 --cache "$NPM_CACHE" --prefer-online --no-audit --no-fund \
                 "@lpm-registry/cli@${VERSION}" &&
               INSTALLED_VERSION=$("$PREFIX/bin/lpm" --version 2>/tmp/lpm-wrapper-smoke.log) &&
               test "$INSTALLED_VERSION" = "lpm $VERSION" &&
               "$PREFIX/bin/lpx" --help >/dev/null 2>>/tmp/lpm-wrapper-smoke.log &&
               TAGGED_VERSION=$(npx npm@11.12.1 view \
                 "@lpm-registry/cli" "dist-tags.${NPM_TAG}" \
                 --cache "$NPM_CACHE" --prefer-online) &&
               test "$TAGGED_VERSION" = "$VERSION"; then
              install_verified=1
              cleanup_attempt
              break
            fi

            cleanup_attempt
            BACKOFF_SECONDS=$((5 * (1 << (attempt - 1))))
            if [ "$BACKOFF_SECONDS" -gt 30 ]; then
              BACKOFF_SECONDS=30
            fi
            remaining=$((deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then
              break
            fi
            if [ "$BACKOFF_SECONDS" -gt "$remaining" ]; then
              BACKOFF_SECONDS=$remaining
            fi
            sleep "$BACKOFF_SECONDS"
          done
          if [ "$install_verified" -ne 1 ]; then
            echo "::error::published wrapper install/launch failed after ${REGISTRY_PROPAGATION_TIMEOUT_SECONDS}s registry-propagation window"
            cat /tmp/lpm-wrapper-smoke.log 2>/dev/null || true
            exit 1
          fi

  update-homebrew:
    name: Update Homebrew Formula
    needs:
      - finalize-promotion-release
      - publish-promotion-platform
      - publish-release
      - release-metadata
      - smoke-standalone-installer
    if: >-
      always() &&
      needs.release-metadata.outputs.should_release == 'true' &&
      needs.release-metadata.outputs.channel == 'stable' &&
      ((needs.release-metadata.outputs.mode == 'full' &&
      needs.publish-release.result == 'success' &&
      needs.smoke-standalone-installer.result == 'success') ||
      (needs.release-metadata.outputs.mode == 'promote' &&
      needs.finalize-promotion-release.result == 'success' &&
      needs.publish-promotion-platform.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Verify release manifest and export Homebrew checksums
        run: |
          set -euo pipefail

          VERSION="${{ needs.release-metadata.outputs.tag }}"
          BASE="https://github.com/lpm-dev/rust-client/releases/download/${VERSION}"

          curl -fsSL --retry 3 --max-time 60 "${BASE}/SHA256SUMS.txt" -o SHA256SUMS.txt
          curl -fsSL --retry 3 --max-time 60 "${BASE}/SHA256SUMS.txt.sigstore" -o SHA256SUMS.txt.sigstore

          cosign verify-blob \
            --bundle SHA256SUMS.txt.sigstore \
            --certificate-identity-regexp "^https://github\\.com/lpm-dev/rust-client/\\.github/workflows/release\\.yml@.+" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            SHA256SUMS.txt

          export_manifest_hash() {
            local binary="$1"
            local env_name="$2"
            local hash
            hash=$(awk -v p="$binary" '$2 == p { print $1; count++ } END { if (count != 1) exit 1 }' SHA256SUMS.txt) || {
              echo "::error::SHA256SUMS.txt must contain exactly one entry for ${binary}"
              exit 1
            }
            hash=$(printf '%s' "$hash" | tr '[:upper:]' '[:lower:]')
            if [[ ! "$hash" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::SHA256SUMS.txt has an invalid SHA-256 for ${binary}: ${hash}"
              exit 1
            fi
            echo "${env_name}=${hash}" >> "$GITHUB_ENV"
          }

          export_manifest_hash lpm-darwin-arm64.zip SHA_DARWIN_ARM64
          export_manifest_hash lpm-darwin-x64.zip SHA_DARWIN_X64
          export_manifest_hash lpm-linux-arm64 SHA_LINUX_ARM64
          export_manifest_hash lpm-linux-x64 SHA_LINUX_X64
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Dispatch correlated Homebrew update
        id: homebrew
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          correlation_id="rust-client-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          dispatched_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg event_type update-formula \
            --arg version "$VERSION" \
            --arg sha_darwin_arm64 "$SHA_DARWIN_ARM64" \
            --arg sha_darwin_x64 "$SHA_DARWIN_X64" \
            --arg sha_linux_arm64 "$SHA_LINUX_ARM64" \
            --arg sha_linux_x64 "$SHA_LINUX_X64" \
            --arg correlation_id "$correlation_id" \
            '{event_type: $event_type, client_payload: {
              version: $version,
              sha_darwin_arm64: $sha_darwin_arm64,
              sha_darwin_x64: $sha_darwin_x64,
              sha_linux_arm64: $sha_linux_arm64,
              sha_linux_x64: $sha_linux_x64,
              correlation_id: $correlation_id
            }}' > "$RUNNER_TEMP/homebrew-dispatch.json"
          gh api --method POST repos/lpm-dev/homebrew-lpm/dispatches \
            --input "$RUNNER_TEMP/homebrew-dispatch.json"
          {
            echo "correlation_id=$correlation_id"
            echo "dispatched_at=$dispatched_at"
          } >> "$GITHUB_OUTPUT"

      - name: Await correlated Homebrew workflow
        env:
          CORRELATION_ID: ${{ steps.homebrew.outputs.correlation_id }}
          DISPATCHED_AT: ${{ steps.homebrew.outputs.dispatched_at }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          run_id=
          for _ in {1..30}; do
            runs=$(gh api --method GET \
              repos/lpm-dev/homebrew-lpm/actions/workflows/update-formula.yml/runs \
              -f event=repository_dispatch -f per_page=50)
            run_id=$(printf '%s' "$runs" | jq -r \
              --arg correlation "$CORRELATION_ID" \
              --arg dispatched "$DISPATCHED_AT" \
              '[.workflow_runs[] | select(
                .event == "repository_dispatch" and
                .created_at >= $dispatched and
                (.display_title | contains($correlation))
              )] | sort_by(.created_at) | last | .id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            echo "::error::The correlated Homebrew workflow did not start."
            exit 1
          fi

          for _ in {1..120}; do
            run=$(gh api "repos/lpm-dev/homebrew-lpm/actions/runs/${run_id}")
            status=$(printf '%s' "$run" | jq -r .status)
            if [ "$status" = completed ]; then
              conclusion=$(printf '%s' "$run" | jq -r .conclusion)
              url=$(printf '%s' "$run" | jq -r .html_url)
              echo "Homebrew workflow: $url"
              if [ "$conclusion" != success ]; then
                echo "::error::Correlated Homebrew workflow concluded with $conclusion."
                exit 1
              fi
              exit 0
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for correlated Homebrew workflow ${run_id}."
          exit 1
