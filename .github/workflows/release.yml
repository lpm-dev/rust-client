name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v"
        required: true
      mode:
        description: "Recovery mode to run"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - wrapper-only

permissions:
  contents: write
  id-token: write # Required for npm OIDC trusted publishing (no token needed) + Sigstore Fulcio
  attestations: write # Required for actions/attest-build-provenance to mint the artifact attestation

env:
  RUST_TOOLCHAIN: "1.94.0"
  APPLE_TEAM_ID: "823S8YKMRW"
  APPLE_CODESIGN_IDENTITY: "Developer ID Application: Tolga Ergin (823S8YKMRW)"
  APPLE_CODESIGN_IDENTIFIER: "dev.lpm.cli"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Opt in to Node.js 24 for all JavaScript actions ahead of GitHub's
  # 2026-06-02 forced-default (Node 20 removal on 2026-09-16). Suppresses
  # the "Node.js 20 actions are deprecated" deprecation annotation on
  # every run. Safe no-op after the forced-default date.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Release verification
    if: github.event_name == 'push' || inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-verify-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-verify-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Linux keyring build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install nextest
        uses: taiki-e/install-action@9c6953334daacc48e55a35db9a19c771f79ffa9d # nextest

      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Cache npm (Verdaccio test harness)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-verdaccio-${{ hashFiles('tests/workflows/tests/support/verdaccio.rs') }}
          restore-keys: ${{ runner.os }}-npm-verdaccio-

      - name: Pre-warm Verdaccio in npm cache
        run: |
          set -e
          VERDACCIO_VERSION=$(grep -oE 'VERDACCIO_VERSION: &str = "[^"]+"' tests/workflows/tests/support/verdaccio.rs | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERDACCIO_VERSION" ]; then
            echo "::error::Could not extract VERDACCIO_VERSION from verdaccio.rs"
            exit 1
          fi
          echo "Pre-warming npm cache for verdaccio@$VERDACCIO_VERSION"
          npx --yes "verdaccio@$VERDACCIO_VERSION" --version

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Full workspace nextest
        run: cargo nextest run --locked --workspace --exclude lpm-integration-tests --ignore-default-filter --no-fail-fast --status-level slow --final-status-level fail

      - name: Audit-scale workflow fixtures
        run: cargo nextest run --locked -P audit -p lpm-workflows --test install_realworld --run-ignored only --no-fail-fast --status-level slow --final-status-level fail

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    if: github.event_name == 'push' || inputs.mode == 'full'
    runs-on: ${{ matrix.os }}
    environment: windows-signing
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: lpm-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: lpm-darwin-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: lpm-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: lpm-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: lpm-win32-x64.exe

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install Linux keyring build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} -p lpm-cli

      # The Windows runtime ships an additional helper binary for
      # AppContainer strict-mode. Build it with the CLI so the release
      # artifact and npm platform package consume the same signed bytes.
      - name: Build sandbox helper (Windows)
        if: runner.os == 'Windows'
        run: cargo build --locked --release --target ${{ matrix.target }} -p lpm-sandbox --bin lpm-sandbox-helper

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/lpm-rs ${{ matrix.binary }}
          chmod +x ${{ matrix.binary }}

      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_DEVELOPER_ID_P12_BASE64:-}" ] || [ -z "${APPLE_DEVELOPER_ID_P12_PASSWORD:-}" ]; then
            echo "::error::Set APPLE_DEVELOPER_ID_P12_BASE64 and APPLE_DEVELOPER_ID_P12_PASSWORD before publishing macOS release artifacts."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/lpm-release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          trap 'rm -f "$CERT_PATH"' EXIT

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "APPLE_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign binary (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail

          codesign --force --timestamp --options runtime \
            --keychain "$APPLE_SIGNING_KEYCHAIN" \
            --identifier "$APPLE_CODESIGN_IDENTIFIER" \
            --sign "$APPLE_CODESIGN_IDENTITY" \
            "${{ matrix.binary }}"

          codesign --verify --strict --verbose=4 "${{ matrix.binary }}"
          codesign -dv --verbose=4 "${{ matrix.binary }}" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime|Timestamp"

      - name: Notarize binary (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail

          NOTARY_ZIP="$RUNNER_TEMP/${{ matrix.binary }}.zip"
          zip -j "$NOTARY_ZIP" "${{ matrix.binary }}"

          if [ -n "${APPLE_NOTARY_KEY_BASE64:-}" ] || [ -n "${APPLE_NOTARY_KEY_ID:-}" ] || [ -n "${APPLE_NOTARY_ISSUER_ID:-}" ]; then
            if [ -z "${APPLE_NOTARY_KEY_BASE64:-}" ] || [ -z "${APPLE_NOTARY_KEY_ID:-}" ] || [ -z "${APPLE_NOTARY_ISSUER_ID:-}" ]; then
              echo "::error::Set APPLE_NOTARY_KEY_BASE64, APPLE_NOTARY_KEY_ID, and APPLE_NOTARY_ISSUER_ID together."
              exit 1
            fi

            NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
            trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
            printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
            chmod 600 "$NOTARY_KEY_PATH"

            xcrun notarytool submit "$NOTARY_ZIP" \
              --key "$NOTARY_KEY_PATH" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --wait \
              --timeout 30m
          else
            if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
              echo "::error::Set App Store Connect API key secrets, or set APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD for notarization."
              exit 1
            fi

            xcrun notarytool submit "$NOTARY_ZIP" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait \
              --timeout 30m
          fi

      - name: Stage binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/lpm-rs.exe ${{ matrix.binary }}
          cp target/${{ matrix.target }}/release/lpm-sandbox-helper.exe lpm-sandbox-helper-win32-x64.exe

      - name: Report Windows signing disabled
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED != 'true'
        shell: pwsh
        run: |
          Write-Warning "Windows signing is disabled because WINDOWS_SIGNING_ENABLED is not true. This release will publish unsigned Windows binaries. Enable it only after the Windows signing smoke workflow passes."

      - name: Validate Windows signing configuration
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_AZURE_CLIENT_ID: ${{ secrets.WINDOWS_SIGNING_AZURE_CLIENT_ID }}
          WINDOWS_SIGNING_AZURE_TENANT_ID: ${{ secrets.WINDOWS_SIGNING_AZURE_TENANT_ID }}
          WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID: ${{ secrets.WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID }}
          WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT_NAME: ${{ vars.WINDOWS_SIGNING_ACCOUNT_NAME }}
          WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          $missing = @()
          foreach ($name in @(
            "WINDOWS_SIGNING_AZURE_CLIENT_ID",
            "WINDOWS_SIGNING_AZURE_TENANT_ID",
            "WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID",
            "WINDOWS_SIGNING_ENDPOINT",
            "WINDOWS_SIGNING_ACCOUNT_NAME",
            "WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error ("Set Windows signing repository secrets/variables before publishing Windows release artifacts. Missing: " + ($missing -join ", "))
            exit 1
          }

      - name: Azure login (Windows signing)
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a # v3
        with:
          client-id: ${{ secrets.WINDOWS_SIGNING_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WINDOWS_SIGNING_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WINDOWS_SIGNING_AZURE_SUBSCRIPTION_ID }}

      - name: Sign binaries (Windows)
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30 # v2
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\${{ matrix.binary }}
            ${{ github.workspace }}\lpm-sandbox-helper-win32-x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: LPM CLI
          description-url: https://github.com/lpm-dev/rust-client

      - name: Verify signatures (Windows)
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          foreach ($file in @(".\${{ matrix.binary }}", ".\lpm-sandbox-helper-win32-x64.exe")) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate

            if ($signature.Status -ne "Valid") {
              Write-Error "Authenticode signature for $file is $($signature.Status): $($signature.StatusMessage)"
              exit 1
            }

            if ($null -eq $signature.TimeStamperCertificate) {
              Write-Error "Authenticode signature for $file does not include a timestamp."
              exit 1
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

      - name: Upload helper artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lpm-sandbox-helper-win32-x64.exe
          path: lpm-sandbox-helper-win32-x64.exe

      - name: Delete temporary signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${APPLE_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$APPLE_SIGNING_KEYCHAIN" || true
          fi

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' || inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: binaries
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: binaries
        run: |
          sha256sum lpm-darwin-arm64 lpm-darwin-x64 \
                    lpm-linux-x64 lpm-linux-arm64 \
                    lpm-win32-x64.exe lpm-sandbox-helper-win32-x64.exe \
                    > SHA256SUMS.txt
          echo "Manifest contents:"
          cat SHA256SUMS.txt

      # Hard-fail when the manifest's filename column drifts from the set
      # of files actually staged for upload — keeps a future contributor
      # who adds a published binary without extending the sha256sum step
      # from silently shipping unsigned bytes.
      - name: Verify every published binary is enumerated in SHA256SUMS.txt
        working-directory: binaries
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'SHA256SUMS.txt.sigstore' -printf '%f\n' | sort > /tmp/published.txt
          awk '{print $2}' SHA256SUMS.txt | sort > /tmp/manifest.txt
          if ! diff -u /tmp/published.txt /tmp/manifest.txt; then
            echo "::error::SHA256SUMS.txt enumeration drifted from binaries/ contents. Update the sha256sum step above to add or remove entries."
            exit 1
          fi
          echo "Manifest covers every published binary."

      - name: Attest SHA256SUMS.txt via Sigstore
        id: attest
        uses: actions/attest-build-provenance@173725a1209d09b31f9d30a3890cf2757ebbff0d # v2
        with:
          subject-path: binaries/SHA256SUMS.txt

      - name: Stage Sigstore bundle next to manifest
        run: cp "${{ steps.attest.outputs.bundle-path }}" binaries/SHA256SUMS.txt.sigstore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: binaries/*
          generate_release_notes: true

  publish-npm-platform:
    name: Publish npm Platform Packages
    needs: release
    if: github.event_name == 'push' || inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: binaries
          merge-multiple: true

      - name: Bootstrap npm 11 (required for trusted publishers OIDC)
        run: |
          npx --yes npm@11.12.1 --version
          echo "Runner npm: $(npm --version)"
          echo "npx npm@11: $(npx npm@11.12.1 --version)"

      - name: Publish platform packages via trusted publishers (OIDC, tokenless)
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"

          publish_pkg() {
            npx npm@11.12.1 publish --provenance --access public 2>&1 | tee /tmp/npm-publish.log
            local exit_code=${PIPESTATUS[0]}
            if [ "$exit_code" -ne 0 ]; then
              if grep -q "cannot publish over the previously published" /tmp/npm-publish.log; then
                echo "Already published — skipping"
              else
                return "$exit_code"
              fi
            fi
          }

          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            echo "Publishing @lpm-registry/cli-${platform}@${VERSION}..."
            cd npm/cli-${platform}
            cp ../../binaries/lpm-${platform} ./lpm
            cp ./lpm ./lpx
            chmod +x ./lpm ./lpx
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            publish_pkg
            cd ../..
          done

          # Windows (different binary name + bundled helper for
          # Phase 46.3 PR-2 AppContainer strict-mode).
          echo "Publishing @lpm-registry/cli-win32-x64@${VERSION}..."
          cd npm/cli-win32-x64
          cp ../../binaries/lpm-win32-x64.exe ./lpm.exe
          cp ./lpm.exe ./lpx.exe
          cp ../../binaries/lpm-sandbox-helper-win32-x64.exe ./lpm-sandbox-helper.exe
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          publish_pkg

  publish-npm-wrapper:
    name: Publish @lpm-registry/cli wrapper
    needs: publish-npm-platform
    if: always() && (needs.publish-npm-platform.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'wrapper-only'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Bootstrap npm 11 (required for trusted publishers OIDC)
        run: |
          npx --yes npm@11.12.1 --version
          echo "Runner npm: $(npm --version)"
          echo "npx npm@11: $(npx npm@11.12.1 --version)"

      - name: Bump version and optionalDependencies, then publish
        working-directory: npm/cli
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::release version must look like 0.59.0, got '${VERSION}'"
              exit 1
              ;;
          esac

          # Update wrapper version
          npm version "$VERSION" --no-git-tag-version --allow-same-version

          # Update platform optionalDependencies to the same tag. The
          # wrapper intentionally carries no runtime dependencies; npm's
          # optional platform packages plus the tiny postinstall verifier
          # are the distribution mechanism.
          node --input-type=module -e "
            import fs from 'node:fs';
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const platforms = [
              '@lpm-registry/cli-darwin-arm64',
              '@lpm-registry/cli-darwin-x64',
              '@lpm-registry/cli-linux-arm64',
              '@lpm-registry/cli-linux-x64',
              '@lpm-registry/cli-win32-x64'
            ];
            pkg.optionalDependencies = Object.fromEntries(platforms.map(p => [p, '$VERSION']));
            if (pkg.dependencies) {
              throw new Error('@lpm-registry/cli wrapper must not publish runtime dependencies');
            }
            if (pkg.scripts?.preinstall || pkg.scripts?.install) {
              throw new Error('@lpm-registry/cli wrapper must not publish preinstall/install lifecycle scripts');
            }
            if (pkg.scripts?.postinstall !== 'node scripts/install-binary.js') {
              throw new Error('@lpm-registry/cli wrapper must publish the native binary postinstall verifier');
            }
            for (const p of platforms) {
              if (pkg.optionalDependencies[p] !== '$VERSION') {
                throw new Error('optional dependency version mismatch for ' + p);
              }
            }
            pkg.repository = {
              type: 'git',
              url: 'https://github.com/lpm-dev/rust-client'
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          npm test
          npm run pack:check

          echo "Publishing @lpm-registry/cli@${VERSION}..."
          npx npm@11.12.1 publish --provenance --access public 2>&1 | tee /tmp/npm-publish.log
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            if grep -q "cannot publish over the previously published" /tmp/npm-publish.log; then
              echo "Already published — skipping"
            else
              exit "$exit_code"
            fi
          fi

          install_verified=0
          for attempt in 1 2 3 4 5; do
            PREFIX=$(mktemp -d)
            if npm install -g --prefix "$PREFIX" "@lpm-registry/cli@${VERSION}" &&
               INSTALLED_VERSION=$("$PREFIX/bin/lpm" --version 2>/tmp/lpm-wrapper-smoke.log) &&
               echo "$INSTALLED_VERSION" | grep -q "$VERSION" &&
               "$PREFIX/bin/lpx" --help >/dev/null 2>>/tmp/lpm-wrapper-smoke.log; then
              install_verified=1
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::published wrapper install/launch failed after registry-propagation retries"
              cat /tmp/lpm-wrapper-smoke.log 2>/dev/null || true
              exit 1
            fi
            rm -rf "$PREFIX"
            sleep $((attempt * 5))
          done
          if [ "$install_verified" -ne 1 ]; then
            echo "::error::published wrapper install/launch verification did not complete"
            exit 1
          fi
          rm -rf "$PREFIX"

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    if: github.event_name == 'push' || inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Verify release manifest and export Homebrew checksums
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="v${INPUT_VERSION}"
          fi
          BASE="https://github.com/lpm-dev/rust-client/releases/download/${VERSION}"

          curl -fsSL --retry 3 --max-time 60 "${BASE}/SHA256SUMS.txt" -o SHA256SUMS.txt
          curl -fsSL --retry 3 --max-time 60 "${BASE}/SHA256SUMS.txt.sigstore" -o SHA256SUMS.txt.sigstore

          cosign verify-blob \
            --bundle SHA256SUMS.txt.sigstore \
            --certificate-identity-regexp "^https://github\\.com/lpm-dev/rust-client/\\.github/workflows/release\\.yml@.+" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            SHA256SUMS.txt

          export_manifest_hash() {
            local binary="$1"
            local env_name="$2"
            local hash
            hash=$(awk -v p="$binary" '$2 == p { print $1; count++ } END { if (count != 1) exit 1 }' SHA256SUMS.txt) || {
              echo "::error::SHA256SUMS.txt must contain exactly one entry for ${binary}"
              exit 1
            }
            hash=$(printf '%s' "$hash" | tr '[:upper:]' '[:lower:]')
            if [[ ! "$hash" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::SHA256SUMS.txt has an invalid SHA-256 for ${binary}: ${hash}"
              exit 1
            fi
            echo "${env_name}=${hash}" >> "$GITHUB_ENV"
          }

          export_manifest_hash lpm-darwin-arm64 SHA_DARWIN_ARM64
          export_manifest_hash lpm-darwin-x64 SHA_DARWIN_X64
          export_manifest_hash lpm-linux-arm64 SHA_LINUX_ARM64
          export_manifest_hash lpm-linux-x64 SHA_LINUX_X64
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Update Homebrew tap
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: lpm-dev/homebrew-lpm
          event-type: update-formula
          client-payload: |
            {
              "version": "${{ env.VERSION }}",
              "sha_darwin_arm64": "${{ env.SHA_DARWIN_ARM64 }}",
              "sha_darwin_x64": "${{ env.SHA_DARWIN_X64 }}",
              "sha_linux_arm64": "${{ env.SHA_LINUX_ARM64 }}",
              "sha_linux_x64": "${{ env.SHA_LINUX_X64 }}"
            }
