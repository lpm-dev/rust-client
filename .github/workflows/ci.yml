name: Native platform acceptance
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [full, workflows, windows-controls]
        default: full
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.mode == 'windows-controls' && fromJSON('["windows-2025"]') || fromJSON('["ubuntu-24.04","windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.94.0"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-native-acceptance-1940-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-filesystem-1.94.0-
            ${{ runner.os }}-cargo-full-nextest-1.94.0-
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-apt-packages.sh pkg-config libdbus-1-dev
      - name: Install test registry
        run: npm install --prefix qa-tools --no-audit --no-fund verdaccio@6.5.2 node-gyp@11.4.2
      - uses: taiki-e/install-action@9c6953334daacc48e55a35db9a19c771f79ffa9d
        with:
          tool: nextest
      - name: Build native CLI
        shell: bash
        run: |
          python -c 'import shutil; from pathlib import Path; p=Path("target"); p.mkdir(exist_ok=True); assert shutil.disk_usage(p).free >= 10*1024**3, "disk floor"'
          cargo build --locked -p lpm-cli -p lpm-sandbox
      - name: New native consumer scenarios
        if: inputs.mode != 'workflows' && (inputs.mode != 'windows-controls' || runner.os == 'Windows')
        continue-on-error: true
        shell: bash
        run: python scripts/ci/native-platform-acceptance.py --binary target/debug/lpm-rs${{ runner.os == 'Windows' && '.exe' || '' }} --output qa-results/consumer --verdaccio qa-tools/node_modules/verdaccio/bin/verdaccio
      - name: Existing publish upgrade uninstall and locking workflows
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p qa-results
          python -c 'import shutil; assert shutil.disk_usage("target").free >= 10*1024**3, "disk floor"'
          scripts/ci/with-hermetic-workflow-cli.sh cargo nextest run --locked -P native-acceptance -p lpm-workflows --test publish --test upgrade --test uninstall --test install_concurrency --test install_local_tarball --no-fail-fast --status-level all --final-status-level all 2>&1 | tee qa-results/workflows.log
          exit "${PIPESTATUS[0]}"
      - name: Public native workspace consumers
        if: inputs.mode != 'workflows' && (inputs.mode != 'windows-controls' || runner.os == 'Windows')
        continue-on-error: true
        shell: bash
        run: python scripts/ci/test-complex-workspace-consumer.py --binary target/debug/lpm-rs${{ runner.os == 'Windows' && '.exe' || '' }} --output qa-results/complex-workspace
      - name: Save native binaries and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-acceptance-${{ matrix.os }}
          path: |
            qa-results/**/*.json
            qa-results/**/*.log
            qa-results/**/lpm.lock
            target/debug/lpm-rs*
            target/debug/lpm-sandbox-helper*
          retention-days: 14
