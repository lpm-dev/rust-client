name: Native workflow fix acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.94.0"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-native-acceptance-1940-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-acceptance-1940-
            ${{ runner.os }}-cargo-filesystem-1.94.0-
      - uses: taiki-e/install-action@9c6953334daacc48e55a35db9a19c771f79ffa9d
        with:
          tool: nextest
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/install-apt-packages.sh pkg-config libdbus-1-dev bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -Ur true
      - name: Build native CLI and sandbox helper
        shell: bash
        run: |
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo build --locked -p lpm-cli -p lpm-sandbox
      - name: Preserve native executables for isolated script retests
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-cli-executables
          path: |
            target/debug/lpm-rs.exe
            target/debug/lpm-sandbox-helper.exe
      - name: Standard-user setup and full publish
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force qa-results | Out-Null
          ./scripts/ci/test-windows-sandbox-setup.ps1 *>&1 | Tee-Object -FilePath qa-results/standard-user-setup.log
      - name: Preserve standard-user logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: standard-user-setup-log
          path: qa-results/standard-user-setup.log
      - name: Windows setup JSON contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo nextest run --locked -p lpm-workflows --test doctor_sandbox_setup --no-fail-fast
      - name: Configure the runner Node installation explicitly
        if: ${{ !cancelled() }}
        shell: pwsh
        run: target/debug/lpm-rs.exe doctor sandbox-setup --project . --tool-dir (Split-Path (Get-Command node).Source) --apply --yes --json
      - name: Windows process directory and source handle checks
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo test --locked -p lpm-sandbox --test helper_filesystem
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo test --locked -p lpm-cli --bin lpm-rs directory_transaction
      - name: Install disposable registry
        if: ${{ !cancelled() }}
        shell: bash
        run: npm install --prefix qa-tools --no-audit --no-fund verdaccio@6.5.2
      - name: Native consumer retest
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          binary=target/debug/lpm-rs
          if [ -f "$binary.exe" ]; then binary="$binary.exe"; fi
          python qa-native.py --binary "$binary" --output qa-results/consumer --verdaccio qa-tools/node_modules/verdaccio/bin/verdaccio
      - name: Long workspace retest
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          binary=target/debug/lpm-rs
          if [ -f "$binary.exe" ]; then binary="$binary.exe"; fi
          python qa-workspace.py --binary "$binary" --output qa-results/long-workspace
      - name: Native common, global, and sandbox regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p qa-results
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo nextest run --locked -P native-retest -p lpm-common -p lpm-global -p lpm-sandbox --no-fail-fast --status-level slow --final-status-level fail 2>&1 | tee qa-results/crates.log
          exit "${PIPESTATUS[0]}"
      - name: Source, metadata, concurrency and publish regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo nextest run --locked -P native-retest -p lpm-workflows --test install --test add --test install_concurrency --test publish -E 'test(source_add_and_remove_use_in_project_paths_on_native_platforms) | test(install_refreshes_custom_metadata_when_requested_version_was_published_after_cache) | test(install_refreshes_a_newly_published_version) | test(missing_version_refresh_is_bounded_and_preserves_the_installed_project) | test(metadata_refresh_does_not_bypass_revoked_custom_registry_access) | test(failed_metadata_refresh_keeps_optional_dependencies_optional) | test(global_alias_without_a_collision_runs_and_is_removed_with_its_package) | test(publish_lifecycle_does_not_receive_ambient_secrets) | test(two_concurrent_global_installs_serialize_via_global_tx_lock) | test(publish_dry_run_executes_publish_lifecycle_scripts_in_npm_order)' --no-fail-fast --status-level all --final-status-level all 2>&1 | tee qa-results/workflows.log
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: native-fix-${{ matrix.os }}
          path: |
            qa-results/**/*.json
            qa-results/**/*.log
            qa-results/**/lpm.lock
          retention-days: 14
