name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Phase 66 confidence-followup §1a — manual + weekly real-world audit.
  # `workflow_dispatch` lets developers run on demand; `schedule`
  # catches "real-world project X broke under hoisted" without waiting
  # on a user report. The realworld-audit job below is gated to these
  # triggers — it clones whole projects + runs their builds, which is
  # too expensive for every PR.
  workflow_dispatch:
  schedule:
    # Every Monday 09:00 UTC. Fires off-peak relative to the
    # weekday push-traffic peak so it doesn't compete with PR CI.
    - cron: "0 9 * * 1"

# Cancel in-progress CI for the same branch (don't waste minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin to exact version so CI is deterministic. Bump after running
  # `cargo clippy -- -D warnings` locally and fixing all lints.
  RUST_TOOLCHAIN: "1.94.0"
  # Keep debug-profile CI builds inside GitHub's hosted-runner disk budget.
  # Incremental artifacts and line-table debuginfo are useful locally, but the
  # workspace nextest job already exercises thousands of test binaries and can
  # otherwise exhaust ubuntu-latest during compilation.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Opt in to Node.js 24 for all JavaScript actions ahead of GitHub's
  # 2026-06-02 forced-default (Node 20 removal on 2026-09-16). Suppresses
  # the "Node.js 20 actions are deprecated" deprecation annotation on
  # every run. Safe no-op after the forced-default date.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Linux keyring build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      # --all-targets covers library, binary, test, example, and bench
      # targets. The bare `--workspace` variant misses lints in test
      # modules (Chunk 4 caught two pre-existing `assert_eq!(x, false)`
      # lints in build_state.rs that this stricter invocation surfaces).
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

      # Security: fancy-regex uses backtracking which is vulnerable to ReDoS.
      # All regex in lpm-security scans untrusted input (npm package source code).
      # The `regex` crate guarantees linear-time matching (Thompson NFA).
      # If fancy-regex appears as a dependency, it MUST be reviewed.
      - name: Reject fancy-regex (ReDoS prevention)
        run: |
          if grep -r 'fancy-regex' crates/*/Cargo.toml; then
            echo "::error::fancy-regex found in Cargo.toml dependencies. The regex crate (linear-time) must be used for scanning untrusted input. See phase-25-todo.md §S1."
            exit 1
          fi
          echo "✓ No fancy-regex dependencies found"

      - name: install.sh smoke tests
        run: sh tests/install-sh/run.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Linux keyring build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install nextest
        uses: taiki-e/install-action@9c6953334daacc48e55a35db9a19c771f79ffa9d # nextest

      # The verdaccio workflow test harness spawns one Verdaccio instance
      # per test via `npx --yes verdaccio@<VERSION>` (see
      # `tests/workflows/tests/support/verdaccio.rs`). On a cold ~/.npm
      # cache the install eats ~20+ seconds — longer than the harness's
      # 20s readiness deadline — so the first batch of parallel install
      # tests fails reliably under nextest. Caching ~/.npm + pre-warming
      # the Verdaccio install once removes the race entirely and keeps
      # the tight readiness deadline meaningful for genuinely-broken
      # Verdaccio.
      #
      # Cache key includes a hash of verdaccio.rs so a version bump in
      # the harness invalidates cleanly; the restore-keys fallback lets
      # npm fetch only the diff against the last cached snapshot.
      - name: Cache npm (Verdaccio test harness)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-verdaccio-${{ hashFiles('tests/workflows/tests/support/verdaccio.rs') }}
          restore-keys: ${{ runner.os }}-npm-verdaccio-

      - name: Pre-warm Verdaccio in npm cache
        run: |
          set -e
          VERDACCIO_VERSION=$(grep -oE 'VERDACCIO_VERSION: &str = "[^"]+"' tests/workflows/tests/support/verdaccio.rs | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERDACCIO_VERSION" ]; then
            echo "::error::Could not extract VERDACCIO_VERSION from verdaccio.rs"
            exit 1
          fi
          echo "Pre-warming npm cache for verdaccio@$VERDACCIO_VERSION"
          npx --yes "verdaccio@$VERDACCIO_VERSION" --version

      - name: Test (workspace, excluding lpm-integration-tests)
        run: cargo nextest run --workspace --exclude lpm-integration-tests --no-fail-fast

  windows-platform-backends:
    name: Windows platform backend runtime checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-platform-backends-registry-v1-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-platform-backends-registry-v1-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Windows port backend tests
        run: cargo test -p lpm-runner ports::tests

      - name: Windows proxy named-pipe tests
        run: cargo test -p lpm-proxy named_pipe

      - name: Build CLI for workflow backend test
        run: cargo build -p lpm-cli

      - name: Windows live port kill workflow test
        run: cargo test -p lpm-workflows --test ports ports_kill_range_json_with_yes_terminates_live_listener_process

  audit-fixtures:
    name: Hoisted-mode compat audit (${{ matrix.os }} / ${{ matrix.store_version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Run the audit fixtures on every push to main + every PR. The
    # suite catches mode-asymmetric regressions: a fix that lands and
    # accidentally breaks hoisted (or isolated) for a real-world
    # package shape. Equal-outcome failures across modes (e.g. an
    # ecosystem-side ESLint 9 incompat) don't gate the build — only
    # asymmetric outcomes do.
    #
    # Phase 66 Phase 4d: matrix runs the suite under both the new
    # default (v2 — virtual store) AND the explicit-downgrade v1
    # path (`LPM_STORE_VERSION=v1`). Both must produce the same
    # per-fixture outcomes:
    # - v2 row gates the active production install pipeline.
    # - v1 row gates the downgrade-rollback path that ships post-4d
    #   for users hitting a v2 regression.
    # Pre-Phase-4d this matrix was inverted (v1 default + v2 opt-in)
    # while v2 was a dev-only flag.
    #
    # Phase 66 confidence-followup §3b: cross-platform expansion. The
    # ubuntu-latest rows gate the build (every fixture must PASS/PASS
    # symmetric or PASS/PASS). The windows-latest row uses Git Bash to
    # run the same harness — `continue-on-error: true` is set so first-
    # time Windows-specific failures (mostly native fixtures lacking
    # node-gyp / vcredist) surface as signal without blocking the
    # build. Once the Windows row stabilizes, drop continue-on-error
    # to make it a hard gate.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        store_version: ["v2", "v1"]
        # Windows row: only run the v2 default — the v1 downgrade path
        # is tested implicitly on Linux. Saves ~30 minutes of CI per PR
        # while still catching cross-platform v2 regressions.
        exclude:
          - os: windows-latest
            store_version: "v1"
    # §3b: tolerate Windows-specific incompat for now (see job comment).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install sccache
        if: matrix.os == 'windows-latest'
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache cargo
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-audit-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audit-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Linux keyring build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # The audit harness alternates lpm + bun on every fixture so each
      # mode sees the same network state. Bun ships prebuilt binaries
      # via npm; the official action handles platform detection.
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build lpm-rs (release)
        if: matrix.os != 'windows-latest'
        run: cargo build --release -p lpm-cli

      - name: Build lpm-rs (release with sccache)
        if: matrix.os == 'windows-latest'
        run: cargo build --release -p lpm-cli
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"

      - name: Install audit security policy
        if: runner.os == 'Linux'
        run: sudo ./bench/install-audit-security-policy.sh

      # §3b: drive the bash harness from Git Bash on Windows. The
      # `windows-latest` runner has Git Bash preinstalled at
      # `C:\Program Files\Git\bin\bash.exe`; `shell: bash` resolves to
      # it natively.
      - name: Run audit fixtures
        shell: bash
        run: ./bench/audit-fixtures/run-all.sh
        env:
          LPM_NO_SKILLS: "1"
          LPM_STORE_VERSION: ${{ matrix.store_version == 'v1' && 'v1' || '' }}

      - name: sccache stats
        if: ${{ always() && matrix.os == 'windows-latest' }}
        shell: bash
        run: ${SCCACHE_PATH:-sccache} --show-stats

      # Always upload result JSONs — useful for triaging mode-asymmetric
      # outcomes in CI without re-running locally.
      - name: Upload audit result artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-fixtures-results-${{ matrix.os }}-${{ matrix.store_version }}
          path: bench/audit-fixtures/results/
          retention-days: 14

  realworld-audit:
    name: Real-world project audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Phase 66 confidence-followup §1a — gated to workflow_dispatch +
    # weekly schedule. Each project clones whole repos and runs their
    # build/test, so per-PR coverage is too expensive. The
    # audit-fixtures job catches ~95% of mode-asymmetric regressions
    # in <2 minutes; this job is the long-tail safety net.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-realworld-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-realworld-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Linux keyring build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build lpm-rs (release)
        run: cargo build --release -p lpm-cli

      - name: Install audit security policy
        run: sudo ./bench/install-audit-security-policy.sh

      - name: Run real-world audit suite
        run: ./bench/realworld-audit/run-all.sh
        env:
          # Mirror audit-fixtures' deterministic posture — `--no-skills`
          # avoids skills-auto-install variance.
          LPM_NO_SKILLS: "1"

      - name: Upload realworld result artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: realworld-audit-results
          path: bench/realworld-audit/results/
          retention-days: 30

  top-npm-audit:
    name: Top-N npm package audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Phase 66 confidence-followup §1b — gated to workflow_dispatch +
    # weekly schedule. Generates ~100 single-dep fixtures and smokes
    # each package's programmatic entrypoint under both modes
    # (require-first, with import fallback only for genuine ESM-only
    # surfaces). Asymmetric outcomes are the regression signal;
    # symmetric failures are bin-only packages / upstream load issues
    # and don't gate.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-topnpm-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-topnpm-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Linux keyring build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build lpm-rs (release)
        run: cargo build --release -p lpm-cli

      - name: Install audit security policy
        run: sudo ./bench/install-audit-security-policy.sh

      - name: Run top-N npm audit
        run: ./bench/top-npm-audit/run-all.sh
        env:
          LPM_NO_SKILLS: "1"
          # Higher parallelism on CI — 8 slots gives us better utilization
          # than the default 4 without saturating the 2-core runner's
          # network or store contention.
          LPM_TOP_NPM_PARALLEL: "8"

      - name: Upload top-npm result artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: top-npm-audit-results
          # The result JSONs land in bench/audit-fixtures/results/
          # because run-audit.sh writes there; pick them up by their
          # `top-npm-` filename prefix to keep artifacts focused.
          path: bench/audit-fixtures/results/top-npm-*.json
          retention-days: 30

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run benchmarks manually or on release tags — not on every push
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-${{ env.RUST_TOOLCHAIN }}-

      - name: Run benchmarks
        run: cargo bench -p lpm-security 2>&1 | grep -E '^test |^Benchmarking' | tee bench-output.txt

      - name: Verify benchmarks ran
        run: |
          if [ ! -s bench-output.txt ]; then
            echo "::warning::No benchmark output captured — criterion may need configuration"
            exit 0
          fi
          echo "Benchmarks completed:"
          cat bench-output.txt
