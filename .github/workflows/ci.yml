name: Native workflow fix acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.94.0"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-native-acceptance-1940-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-acceptance-1940-
            ${{ runner.os }}-cargo-filesystem-1.94.0-
      - name: Native source rollback regressions
        shell: bash
        run: |
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo test --locked -p lpm-cli --bin lpm-rs directory_transaction -- --nocapture
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo test --locked -p lpm-cli --bin lpm-rs commands::add::paths::tests -- --nocapture
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo test --locked -p lpm-cli --bin lpm-rs commands::remove:: -- --nocapture
