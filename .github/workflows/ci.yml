name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress CI for the same branch (don't waste minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin to exact version so CI is deterministic. Bump after running
  # `cargo clippy -- -D warnings` locally and fixing all lints.
  RUST_TOOLCHAIN: "1.94.0"
  # Opt in to Node.js 24 for all JavaScript actions ahead of GitHub's
  # 2026-06-02 forced-default (Node 20 removal on 2026-09-16). Suppresses
  # the "Node.js 20 actions are deprecated" deprecation annotation on
  # every run. Safe no-op after the forced-default date.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-${{ env.RUST_TOOLCHAIN }}-

      # --all-targets covers library, binary, test, example, and bench
      # targets. The bare `--workspace` variant misses lints in test
      # modules (Chunk 4 caught two pre-existing `assert_eq!(x, false)`
      # lints in build_state.rs that this stricter invocation surfaces).
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

      # Security: fancy-regex uses backtracking which is vulnerable to ReDoS.
      # All regex in lpm-security scans untrusted input (npm package source code).
      # The `regex` crate guarantees linear-time matching (Thompson NFA).
      # If fancy-regex appears as a dependency, it MUST be reviewed.
      - name: Reject fancy-regex (ReDoS prevention)
        run: |
          if grep -r 'fancy-regex' crates/*/Cargo.toml; then
            echo "::error::fancy-regex found in Cargo.toml dependencies. The regex crate (linear-time) must be used for scanning untrusted input. See phase-25-todo.md §S1."
            exit 1
          fi
          echo "✓ No fancy-regex dependencies found"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # The verdaccio workflow test harness spawns one Verdaccio instance
      # per test via `npx --yes verdaccio@<VERSION>` (see
      # `tests/workflows/tests/support/verdaccio.rs`). On a cold ~/.npm
      # cache the install eats ~20+ seconds — longer than the harness's
      # 20s readiness deadline — so the first batch of parallel install
      # tests fails reliably under nextest. Caching ~/.npm + pre-warming
      # the Verdaccio install once removes the race entirely and keeps
      # the tight readiness deadline meaningful for genuinely-broken
      # Verdaccio.
      #
      # Cache key includes a hash of verdaccio.rs so a version bump in
      # the harness invalidates cleanly; the restore-keys fallback lets
      # npm fetch only the diff against the last cached snapshot.
      - name: Cache npm (Verdaccio test harness)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-verdaccio-${{ hashFiles('tests/workflows/tests/support/verdaccio.rs') }}
          restore-keys: ${{ runner.os }}-npm-verdaccio-

      - name: Pre-warm Verdaccio in npm cache
        run: |
          set -e
          VERDACCIO_VERSION=$(grep -oE 'VERDACCIO_VERSION: &str = "[^"]+"' tests/workflows/tests/support/verdaccio.rs | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERDACCIO_VERSION" ]; then
            echo "::error::Could not extract VERDACCIO_VERSION from verdaccio.rs"
            exit 1
          fi
          echo "Pre-warming npm cache for verdaccio@$VERDACCIO_VERSION"
          npx --yes "verdaccio@$VERDACCIO_VERSION" --version

      - name: Build
        run: cargo build --workspace

      - name: Test (workspace, excluding lpm-integration-tests)
        run: cargo nextest run --workspace --exclude lpm-integration-tests --no-fail-fast

  audit-fixtures:
    name: Hoisted-mode compat audit (${{ matrix.store_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run the audit fixtures on every push to main + every PR. The
    # suite catches mode-asymmetric regressions: a fix that lands and
    # accidentally breaks hoisted (or isolated) for a real-world
    # package shape. Equal-outcome failures across modes (e.g. an
    # ecosystem-side ESLint 9 incompat) don't gate the build — only
    # asymmetric outcomes do.
    #
    # Phase 66 Phase 4b: matrix runs the suite under both the default
    # (v1) store layout AND the new opt-in `LPM_STORE_VERSION=v2`
    # virtual-store layout. Both must produce the same per-fixture
    # outcomes. v2 stays opt-in until Phase 4d (default flip), so a
    # green v1 row is required to merge; the v2 row gates a *separate*
    # promise that nothing in the v2 code path regresses the matrix
    # while it's still hidden behind the env var.
    strategy:
      fail-fast: false
      matrix:
        store_version: ["v1", "v2"]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-audit-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audit-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The audit harness alternates lpm + bun on every fixture so each
      # mode sees the same network state. Bun ships prebuilt binaries
      # via npm; the official action handles platform detection.
      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build lpm-rs (release)
        run: cargo build --release -p lpm-cli

      - name: Run audit fixtures
        run: ./bench/audit-fixtures/run-all.sh
        env:
          # `--no-skills` keeps the audit deterministic; the skills
          # auto-install layer adds non-fixture work that varies with
          # the registry's response time.
          LPM_NO_SKILLS: "1"
          # Phase 66 Phase 4b: v2 row sets the env var; v1 row leaves
          # it unset. The lpm install pipeline reads `LPM_STORE_VERSION`
          # and dispatches to `~/.lpm/store/v2/{objects,links}/` when
          # set to "v2", v1's `<HOME>/.lpm/store/v1/<name>@<version>/`
          # otherwise.
          LPM_STORE_VERSION: ${{ matrix.store_version == 'v2' && 'v2' || '' }}

      # Always upload result JSONs — useful for triaging mode-asymmetric
      # outcomes in CI without re-running locally.
      - name: Upload audit result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-fixtures-results-${{ matrix.store_version }}
          path: bench/audit-fixtures/results/
          retention-days: 14

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run benchmarks manually or on release tags — not on every push
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-${{ env.RUST_TOOLCHAIN }}-

      - name: Run benchmarks
        run: cargo bench -p lpm-security 2>&1 | grep -E '^test |^Benchmarking' | tee bench-output.txt

      - name: Verify benchmarks ran
        run: |
          if [ ! -s bench-output.txt ]; then
            echo "::warning::No benchmark output captured — criterion may need configuration"
            exit 0
          fi
          echo "Benchmarks completed:"
          cat bench-output.txt
