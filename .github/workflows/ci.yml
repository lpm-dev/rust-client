name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # `workflow_dispatch` lets developers run the long audits on demand;
  # `schedule` catches real-world project regressions without waiting on a
  # user report. The jobs are gated to these triggers because they clone
  # whole projects and run their builds, which is too expensive for every PR.
  workflow_dispatch:
  schedule:
    # Every Monday 09:00 UTC. Fires off-peak relative to the
    # weekday push-traffic peak so it doesn't compete with PR CI.
    - cron: "0 9 * * 1"

# Cancel superseded PR CI, but never cancel `main` push runs. Each merge
# commit needs its own completed signal before downstream work trusts it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pin to exact version so CI is deterministic. Bump after running
  # `cargo clippy -- -D warnings` locally and fixing all lints.
  RUST_TOOLCHAIN: "1.94.0"
  # Keep debug-profile CI builds inside GitHub's hosted-runner disk budget.
  # Incremental artifacts and line-table debuginfo are useful locally, but the
  # workspace nextest job already exercises thousands of test binaries and can
  # otherwise exhaust ubuntu-latest during compilation.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Linux keyring build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      # --all-targets covers library, binary, test, example, and bench
      # targets. The bare `--workspace` variant misses lints in test
      # modules (Chunk 4 caught two pre-existing `assert_eq!(x, false)`
      # lints in build_state.rs that this stricter invocation surfaces).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

      - name: Cargo dependency policy
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: ${{ env.RUST_TOOLCHAIN }}
          command: check
          arguments: --all-features
          command-arguments: --hide-inclusion-graph advisories bans licenses

      # Security: fancy-regex uses backtracking which is vulnerable to ReDoS.
      # All regex in lpm-security scans untrusted input (npm package source code).
      # The `regex` crate guarantees linear-time matching (Thompson NFA).
      # If fancy-regex appears as a dependency, it MUST be reviewed.
      - name: Reject fancy-regex (ReDoS prevention)
        run: |
          if grep -r 'fancy-regex' crates/*/Cargo.toml; then
            echo "::error::fancy-regex found in Cargo.toml dependencies. The regex crate (linear-time) must be used for scanning untrusted input."
            exit 1
          fi
          echo "✓ No fancy-regex dependencies found"

      - name: install.sh smoke tests
        run: sh tests/install-sh/run.sh

      - name: Audit harness helper tests
        run: bash bench/test-audit-install-args.sh

      - name: Local install bench helper tests
        run: bash bench/test-local-install.sh

      - name: Live metadata route bench helper tests
        run: bash bench/test-live-metadata-route.sh

      - name: README bench helper tests
        run: bash bench/test-run-readme.sh

      - name: Install Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: npm wrapper tests
        run: npm --prefix npm/cli test

      - name: npm wrapper pack check
        run: npm --prefix npm/cli run pack:check

      - name: npm release artifact tests
        run: node --test npm/release/tests/*.test.mjs

  musl:
    name: Linux musl x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-24.04-cargo-musl-registry-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-24.04-cargo-musl-registry-${{ env.RUST_TOOLCHAIN }}-

      - name: Install musl build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools=1.2.4-2
          test "$(dpkg-query -W -f='${Version}' musl-tools)" = "1.2.4-2"

      - name: Build musl CLI
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo rustc --locked --target x86_64-unknown-linux-musl -p lpm-cli --bin lpm-rs -- -C link-arg=-static

      - name: Verify musl binary on Alpine
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-musl/debug/lpm-rs
          file "$binary"
          if readelf -l "$binary" | grep -q INTERP; then
            echo "::error::$binary requires a runtime ELF interpreter"
            readelf -l "$binary"
            exit 1
          fi
          if readelf -d "$binary" | grep -q '(NEEDED)'; then
            echo "::error::$binary has dynamic library dependencies"
            readelf -d "$binary"
            exit 1
          fi
          docker run --rm \
            -v "$PWD:/work:ro" \
            alpine@sha256:7c8cb692ae09657cbc4a3f3cbd0e8d5a2690ba38386aaaf252dbb060bf5eb2e6 \
            /work/$binary --version

      - name: Verify packed npm distribution on Alpine
        run: |
          binary=target/x86_64-unknown-linux-musl/debug/lpm-rs
          docker run --rm \
            -v "$PWD:/work:ro" \
            node:22-alpine@sha256:b74031e546d7f4faf561d797ac1b76beccac856a042815ca77db4fd047581605 \
            sh /work/tests/npm-musl/run.sh /work/$binary

  test:
    name: Fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Linux keyring build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install nextest
        uses: taiki-e/install-action@9c6953334daacc48e55a35db9a19c771f79ffa9d # nextest

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Secret overlay fails closed without user namespaces
        run: |
          overlay_original_userns_max=$(sysctl -n user.max_user_namespaces)
          trap 'sudo sysctl -q -w user.max_user_namespaces="$overlay_original_userns_max" >/dev/null' EXIT
          sudo sysctl -q -w user.max_user_namespaces=0 >/dev/null
          cargo test --locked -p lpm-sandbox --test secret_overlay_bind_mount unavailable_secret_overlay_setup_prevents_command_execution -- --nocapture

      - name: Native build cache workflow (Linux sandbox)
        run: cargo nextest run --locked -p lpm-workflows --test native_build_cache --no-fail-fast --status-level slow --final-status-level fail

      - name: Unit and integration tests (non-workflow, non-CLI)
        run: cargo nextest run --locked --workspace --exclude lpm-workflows --exclude lpm-cli --no-fail-fast --status-level slow --final-status-level fail

      - name: CLI unit tests (serial libtest)
        run: cargo test --locked -p lpm-cli --bin lpm-rs -- --test-threads=1

      - name: CLI binary-surface tests
        run: cargo nextest run --locked -p lpm-cli -E 'not binary_id(/bin\/lpm-rs/)' --no-fail-fast --status-level slow --final-status-level fail

  macos-workspace:
    name: macOS workspace checks
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-workspace-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-macos-workspace-${{ env.RUST_TOOLCHAIN }}-

      - name: Install nextest
        uses: taiki-e/install-action@9c6953334daacc48e55a35db9a19c771f79ffa9d # nextest

      - name: Install Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Cache npm (Verdaccio test harness)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-verdaccio-${{ hashFiles('tests/workflows/tests/support/verdaccio.rs') }}
          restore-keys: ${{ runner.os }}-npm-verdaccio-

      - name: Pre-warm Verdaccio in npm cache
        run: |
          set -e
          VERDACCIO_VERSION=$(grep -oE 'VERDACCIO_VERSION: &str = "[^"]+"' tests/workflows/tests/support/verdaccio.rs | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERDACCIO_VERSION" ]; then
            echo "::error::Could not extract VERDACCIO_VERSION from verdaccio.rs"
            exit 1
          fi
          echo "Pre-warming npm cache for verdaccio@$VERDACCIO_VERSION"
          npx --yes "verdaccio@$VERDACCIO_VERSION" --version

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace tests
        run: cargo nextest run --locked --workspace --no-fail-fast --status-level slow --final-status-level fail

  full-nextest:
    name: Full isolated nextest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-full-nextest-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-full-nextest-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Linux keyring build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install nextest
        uses: taiki-e/install-action@9c6953334daacc48e55a35db9a19c771f79ffa9d # nextest

      - name: Install Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Cache npm (Verdaccio test harness)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-verdaccio-${{ hashFiles('tests/workflows/tests/support/verdaccio.rs') }}
          restore-keys: ${{ runner.os }}-npm-verdaccio-

      - name: Pre-warm Verdaccio in npm cache
        run: |
          set -e
          VERDACCIO_VERSION=$(grep -oE 'VERDACCIO_VERSION: &str = "[^"]+"' tests/workflows/tests/support/verdaccio.rs | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERDACCIO_VERSION" ]; then
            echo "::error::Could not extract VERDACCIO_VERSION from verdaccio.rs"
            exit 1
          fi
          echo "Pre-warming npm cache for verdaccio@$VERDACCIO_VERSION"
          npx --yes "verdaccio@$VERDACCIO_VERSION" --version

      - name: Full workspace nextest
        run: cargo nextest run --locked --workspace --ignore-default-filter --no-fail-fast --status-level slow --final-status-level fail

      - name: Audit-scale workflow fixtures
        run: cargo nextest run --locked -P audit -p lpm-workflows --test install_realworld --run-ignored only --no-fail-fast --status-level slow --final-status-level fail

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-nightly-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.toml', 'fuzz/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fuzz-nightly-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: VersionReq parser fuzz smoke
        run: cargo +nightly fuzz run semver_version_req_parse -- -runs=2000

      - name: Extractor entry-path sanitizer fuzz smoke
        run: cargo +nightly fuzz run extractor_entry_path_sanitizer -- -runs=2000

  windows-platform-backends:
    name: Windows platform backend runtime checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-platform-backends-registry-v1-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-platform-backends-registry-v1-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Windows port backend tests
        run: cargo test --locked -p lpm-runner ports::tests

      - name: Windows proxy named-pipe tests
        run: cargo test --locked -p lpm-proxy named_pipe

      - name: Build CLI for workflow backend test
        run: cargo build --locked -p lpm-cli

      - name: Windows live port kill workflow test
        run: cargo test --locked -p lpm-workflows --test ports ports_kill_range_json_with_yes_terminates_live_listener_process

  audit-fixtures:
    name: Hoisted-mode compat audit (${{ matrix.os }} / ${{ matrix.store_version }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Run the audit fixtures on main, scheduled, and manual CI. The
    # suite catches mode-asymmetric regressions: a fix that lands and
    # accidentally breaks hoisted (or isolated) for a real-world package
    # shape. Equal-outcome failures across modes don't gate the build;
    # only asymmetric outcomes do.
    #
    # The matrix runs the suite under both the active v2 virtual store
    # backend and the explicit v1 rollback path (`LPM_STORE_VERSION=v1`).
    # Both must produce the same per-fixture outcomes:
    # - v2 row gates the active production install pipeline.
    # - v1 row gates the downgrade-rollback path for users hitting a v2
    #   regression.
    #
    # Cross-platform audit: Linux covers both store backends; Windows
    # covers the v2 default through Git Bash. All matrix rows hard-gate
    # asymmetric fixture regressions.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        store_version: ["v2", "v1"]
        # Windows row: only run the v2 default — the v1 downgrade path
        # is tested explicitly on Linux while the Windows row catches
        # cross-platform v2 regressions.
        exclude:
          - os: windows-latest
            store_version: "v1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-audit-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audit-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Linux keyring build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      # The audit harness alternates lpm + bun on every fixture so each
      # mode sees the same network state. Bun ships prebuilt binaries
      # via npm; the official action handles platform detection.
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build lpm-rs (release)
        run: cargo build --locked --release -p lpm-cli

      - name: Install audit security policy
        if: runner.os == 'Linux'
        run: sudo ./bench/install-audit-security-policy.sh

      # §3b: drive the bash harness from Git Bash on Windows. The
      # `windows-latest` runner has Git Bash preinstalled at
      # `C:\Program Files\Git\bin\bash.exe`; `shell: bash` resolves to
      # it natively.
      - name: Run audit fixtures
        shell: bash
        run: ./bench/audit-fixtures/run-all.sh
        env:
          LPM_NO_SKILLS: "1"
          LPM_AUDIT_ALLOW_NEW: ${{ runner.os == 'Linux' && '1' || '' }}
          LPM_STORE_VERSION: ${{ matrix.store_version == 'v1' && 'v1' || '' }}

      # Always upload result JSONs — useful for triaging mode-asymmetric
      # outcomes in CI without re-running locally.
      - name: Upload audit result artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: audit-fixtures-results-${{ matrix.os }}-${{ matrix.store_version }}
          path: bench/audit-fixtures/results/
          retention-days: 14

  realworld-audit:
    name: Real-world project audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Gated to workflow_dispatch and the weekly schedule. Each project clones
    # whole repos and runs their build/test, so per-PR coverage is too
    # expensive. The audit-fixtures job catches most mode-asymmetric
    # regressions quickly; this job is the long-tail safety net.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-realworld-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-realworld-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Linux keyring build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build lpm-rs (release)
        run: cargo build --locked --release -p lpm-cli

      - name: Install audit security policy
        run: sudo ./bench/install-audit-security-policy.sh

      - name: Run real-world audit suite
        run: ./bench/realworld-audit/run-all.sh
        env:
          # Mirror audit-fixtures' deterministic posture — `--no-skills`
          # avoids skills-auto-install variance.
          LPM_NO_SKILLS: "1"
          LPM_AUDIT_ALLOW_NEW: "1"

      - name: Upload realworld result artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: realworld-audit-results
          path: bench/realworld-audit/results/
          retention-days: 30

  top-npm-audit:
    name: Top-N npm package audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Gated to workflow_dispatch and the weekly schedule. Generates single-dep
    # fixtures and smokes each package's programmatic entrypoint under both
    # modes (require-first, with import fallback only for genuine ESM-only
    # surfaces). Asymmetric outcomes are the regression signal; symmetric
    # failures are bin-only packages or upstream load issues and don't gate.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-topnpm-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-topnpm-${{ env.RUST_TOOLCHAIN }}-

      - name: Install Linux keyring build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build lpm-rs (release)
        run: cargo build --locked --release -p lpm-cli

      - name: Install audit security policy
        run: sudo ./bench/install-audit-security-policy.sh

      - name: Run top-N npm audit
        run: ./bench/top-npm-audit/run-all.sh
        env:
          LPM_NO_SKILLS: "1"
          LPM_AUDIT_ALLOW_NEW: "1"
          # Higher parallelism on CI — 8 slots gives us better utilization
          # than the default 4 without saturating the 2-core runner's
          # network or store contention.
          LPM_TOP_NPM_PARALLEL: "8"

      - name: Upload top-npm result artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: top-npm-audit-results
          # The result JSONs land in bench/audit-fixtures/results/
          # because run-audit.sh writes there; pick them up by their
          # `top-npm-` filename prefix to keep artifacts focused.
          path: bench/audit-fixtures/results/top-npm-*.json
          retention-days: 30

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run benchmarks manually or on release tags — not on every push
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-${{ env.RUST_TOOLCHAIN }}-

      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          cargo bench --locked -p lpm-security 2>&1 | grep -E '^test |^Benchmarking' | tee bench-output.txt

      - name: Verify benchmarks ran
        run: |
          if [ ! -s bench-output.txt ]; then
            echo "::error::No benchmark output captured — criterion may need configuration"
            exit 1
          fi
          echo "Benchmarks completed:"
          cat bench-output.txt
