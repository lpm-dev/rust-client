name: Native regression baseline
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.94.0"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Windows-sandbox-only-1940-${{ hashFiles('Cargo.lock') }}
          restore-keys: Windows-sandbox-only-1940-
      - uses: taiki-e/install-action@9c6953334daacc48e55a35db9a19c771f79ffa9d
        with:
          tool: nextest
      - name: Build native binaries
        shell: bash
        run: |
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo build --locked -p lpm-sandbox --bins --example qa_setup
          cargo test --locked -p lpm-sandbox --lib helper_appcontainer::setup -- --nocapture
          cargo test --locked -p lpm-sandbox --test helper_filesystem -- --nocapture
      - name: Cleared environment controls
        shell: pwsh
        run: ./qa-env.ps1 2>&1 | Tee-Object -FilePath qa-environment.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: native-environment-controls
          path: |
            qa-environment.log
            qa-user-details.log
