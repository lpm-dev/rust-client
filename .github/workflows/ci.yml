name: Native workflow fix acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.94.0"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-native-acceptance-1940-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-acceptance-1940-
            ${{ runner.os }}-cargo-filesystem-1.94.0-
      - uses: taiki-e/install-action@9c6953334daacc48e55a35db9a19c771f79ffa9d
        with:
          tool: nextest
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/install-apt-packages.sh pkg-config libdbus-1-dev bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -Ur true
      - name: Build native CLI and sandbox helper
        shell: bash
        run: |
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo build --locked -p lpm-cli -p lpm-sandbox
      - name: Windows process directory and source handle checks
        shell: bash
        run: |
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo test --locked -p lpm-sandbox --test helper_filesystem
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          mkdir -p qa-results
          cargo test --locked -p lpm-cli --bin lpm-rs directory_transaction 2>&1 | tee qa-results/directory-transaction.log
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: native-fix-${{ matrix.os }}
          path: |
            qa-results/**/*.json
            qa-results/**/*.log
            qa-results/**/lpm.lock
          retention-days: 14
