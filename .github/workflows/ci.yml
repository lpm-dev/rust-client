name: Native platform acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  followup:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - name: Fetch previously tested native binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download 34557890665 --repo lpm-dev/rust-client --name native-acceptance-windows-2025 --dir qa-prior
      - name: Corrected global install and workspace controls
        run: python scripts/ci/native-windows-followup.py --binary qa-prior/target/debug/lpm-rs.exe --output qa-results/followup
      - name: Save controls
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-windows-followup
          path: |
            qa-results/**/*.json
            qa-results/**/*.log
            qa-results/**/lpm.lock
          retention-days: 14
