name: Native regression baseline
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.94.0"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Windows-native-acceptance-1940-${{ hashFiles('Cargo.lock') }}
          restore-keys: Windows-cargo-filesystem-1.94.0-
      - uses: taiki-e/install-action@9c6953334daacc48e55a35db9a19c771f79ffa9d
        with:
          tool: nextest
      - name: Build native binaries
        shell: bash
        run: |
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo build --locked -p lpm-cli -p lpm-sandbox
      - name: Inspect existing tool access
        shell: pwsh
        run: |
          @('C:\Program Files\dotnet', 'C:\vcpkg') | ForEach-Object { Get-Acl -LiteralPath $_ | Format-List Path, Sddl }
      - name: Windows global forwarding regression
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p qa-results
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo test --locked -p lpm-global windows_global_shims_forward_arguments_and_exit_code_to_project_shims -- --nocapture 2>&1 | tee qa-results/global-forwarding.log
          exit "${PIPESTATUS[0]}"
      - name: Sandbox single-entry regression
        continue-on-error: true
        shell: bash
        run: |
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo test --locked -p lpm-sandbox dacl_ -- --nocapture 2>&1 | tee qa-results/sandbox-unit.log
          exit "${PIPESTATUS[0]}"
      - name: Source directory handle regression
        continue-on-error: true
        shell: bash
        run: |
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo test --locked -p lpm-cli --bin lpm-rs directory_transaction -- --nocapture 2>&1 | tee qa-results/directory.log
          exit "${PIPESTATUS[0]}"
      - name: Long workspace diagnostic
        continue-on-error: true
        shell: bash
        run: python qa-workspace.py --binary target/debug/lpm-rs.exe --output qa-results/followup/workspace-0
      - name: Long atomic-write baseline
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p qa-results
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo test --locked -p lpm-common write_file_atomic_creates_and_replaces_beyond_max_path -- --nocapture 2>&1 | tee qa-results/atomic.log
          exit "${PIPESTATUS[0]}"
      - name: Workflow baselines
        continue-on-error: true
        shell: bash
        run: |
          python -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          cargo nextest run --locked -P native-baseline -p lpm-workflows --test add --test publish --test install_concurrency -E 'test(publish_dry_run_executes_publish_lifecycle_scripts_in_npm_order) | test(source_add_and_remove_use_in_project_paths_on_native_platforms) | test(two_concurrent_global_installs_serialize_via_global_tx_lock)'  --no-fail-fast --status-level all --final-status-level all 2>&1 | tee qa-results/workflows.log
          exit "${PIPESTATUS[0]}"
      - name: Collect diagnostic output
        if: always()
        shell: pwsh
        run: |
          if (Test-Path C:\lpm-sandbox-qa.log) {
            Get-Content C:\lpm-sandbox-qa.log
            Copy-Item C:\lpm-sandbox-qa.log qa-results/sandbox.log
          }
          Get-ChildItem qa-results -Recurse -Filter '*.stderr.log' | ForEach-Object { Get-Content $_.FullName }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: native-regression-baseline
          path: qa-results
