[package]
name = "lpm-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Filesystem-scoped post-install script sandboxing for LPM"

[dependencies]
lpm-common = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }

# Filesystem sandboxing via landlock on Linux kernel 5.13+.
# Linux-target-gated so the macOS + Windows builds stay unaffected.
# The crate is MIT-licensed, zero transitive C deps.
# `libc` is needed for async-signal-safe primitives in the child's
# `pre_exec` closure (direct `write(2)` for stderr + raw errno
# values) — std::io's stderr path takes a lock and isn't safe
# post-fork in multi-threaded processes.
#
# `seccompiler` compiles BPF programs for the socket(2) deny matrix
# (UDP / raw / AF_PACKET / AF_NETLINK). Apache-2.0/MIT dual licensed,
# maintained by AWS for Firecracker. `apply_filter` is a single
# `prctl(PR_SET_SECCOMP, ...)` syscall — AS-safe in pre_exec.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"

# `libc` is the syscall surface for both Unix backends: Linux's
# pre_exec uses prctl/setrlimit/write/mount/unshare directly;
# macOS's Seatbelt backend uses setrlimit in its pre_exec. Gated
# on `cfg(unix)` so the Linux landlock build, the macOS Seatbelt
# build, and any future Unix-family backend all share the same
# AS-safe primitives without needing a per-OS dep block.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows backend uses Mandatory Integrity Control (drop child to Low
# IL) plus a Job Object for kill-tree parity with Unix's process
# group. `windows-sys` is the Microsoft-published low-level FFI crate
# already used by `lpm-common` for `GetDriveTypeW` — the workspace
# is on 0.60. Each feature flag below is a separate code-gen unit, so
# we only enable the namespaces this backend actually touches:
#   - Win32_Foundation                 HANDLE, BOOL, error codes
#   - Win32_Security                   PSID / ACL / TOKEN_MANDATORY_LABEL,
#                                      Get/SetTokenInformation, ConvertString*
#   - Win32_Security_Authorization     SetNamedSecurityInfoW (mandatory
#                                      label on allow-set dirs) +
#                                      ConvertStringSidToSidW
#   - Win32_Security_Isolation         AppContainer surface —
#                                      CreateAppContainerProfile +
#                                      DeriveAppContainerSidFromAppContainerName.
#   - Win32_Storage_FileSystem         FILE_GENERIC_* access masks (used by
#                                      the AppContainer DACL grants in
#                                      `windows_appcontainer.rs` /
#                                      `lpm-sandbox-helper`)
#   - Win32_System_Console             GetStdHandle + STD_INPUT_HANDLE /
#                                      STD_OUTPUT_HANDLE / STD_ERROR_HANDLE
#                                      for forwarding the helper's stdio to
#                                      the AppContainer child via
#                                      STARTUPINFOW.hStd*.
#   - Win32_System_Threading           CREATE_SUSPENDED creation flag +
#                                      OpenProcessToken (declared in this
#                                      namespace by windows-sys).
#                                      CreateMutexW + ReleaseMutex for
#                                      cross-process AppContainer profile
#                                      creation serialization.
#                                      InitializeProcThreadAttributeList +
#                                      UpdateProcThreadAttribute +
#                                      CreateProcessW / STARTUPINFOEXW from
#                                      this namespace for the AppContainer
#                                      spawn dance in the helper binary.
#   - Win32_System_JobObjects          CreateJobObjectW, SetInformationJobObject,
#                                      AssignProcessToJobObject
#
# Note: NtResumeProcess (the function we use to resume the suspended
# child after dropping its integrity level) is undocumented and not
# in windows-sys. We declare its `extern "system"` signature inline
# in `src/windows.rs` and link against `ntdll.dll` via a `#[link]`
# attribute on the extern block — same pattern as Sysinternals tools
# and the Chromium sandbox use. The function has been stable since
# Windows XP. The AppContainer helper does NOT use NtResumeProcess —
# the helper owns `PROCESS_INFORMATION.hThread` directly (it calls
# `CreateProcessW` itself instead of going through `Command::spawn`)
# so it can use the documented `ResumeThread` API.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
] }

[dev-dependencies]
tempfile = "3"
dirs = { workspace = true }
criterion = "0.5"
# Helper-binary integration tests spawn `lpm-sandbox-helper` via
# `assert_cmd::Command::cargo_bin`, which consults
# `CARGO_BIN_EXE_<name>` so the bin is located in cargo's test
# environment. Plain `Command::new("lpm-sandbox-helper")` would not
# find it. Matches the pattern `tests/workflows/tests/support/`
# already uses for `lpm-rs`.
assert_cmd = "2"

# Per-spawn sandbox overhead benchmark. Regressions in profile
# rendering or syscall overhead surface here.
[[bench]]
name = "sandbox_spawn"
harness = false

[lints]
workspace = true
