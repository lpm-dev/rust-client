[package]
name = "lpm-extractor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tarball download, verification, decompression, and extraction for LPM"

[dependencies]
lpm-common = { workspace = true }
blake3 = { workspace = true }
flate2 = { version = "1", features = ["zlib-rs"], default-features = false }
# libdeflate for whole-buffer gzip decompression on the in-memory +
# buffered streaming paths. ~2-3x faster than flate2/zlib-rs for the
# npm tarball size distribution (50 KB – 2 MB compressed). flate2 is
# kept for the test-only `decompress_gzip` helper and the gzip ENCODE
# side (test fixtures + lpm pack — libdeflate compression bindings exist
# but are not used on the publish path).
libdeflater = "1.25"
tar = "0.4"
thiserror = { workspace = true }
# Emit tracing spans so the extract step shows up in Tracy when the
# CLI is built with `--features tracy`. Spans compile to single-int
# level checks under default `RUST_LOG`, so the cost in non-tracy
# builds is sub-100 ns per call.
tracing = { workspace = true }
cap-fs-ext = { workspace = true }
cap-std = "4.0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decompress"
harness = false

[lints]
workspace = true
