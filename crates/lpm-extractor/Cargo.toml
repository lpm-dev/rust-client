[package]
name = "lpm-extractor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tarball download, verification, decompression, and extraction for LPM"

[dependencies]
lpm-common = { workspace = true }
flate2 = { version = "1", features = ["zlib-rs"], default-features = false }
# Trial 1 (2026-05-13): libdeflate for whole-buffer gzip decompression on the
# in-memory + buffered streaming paths. ~2-3x faster than flate2/zlib-rs for
# the npm tarball size distribution (50 KB – 2 MB compressed). flate2 is kept
# for the test-only `decompress_gzip` helper and the gzip ENCODE side (test
# fixtures + lpm pack — libdeflate compression bindings exist but we're not
# touching the publish path in this trial).
libdeflater = "1.25"
tar = "0.4"
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Used for the `O_NOFOLLOW` constant on the file-create path. The
# constant value differs per platform (Linux 0o400000, macOS 0o400),
# so we route through libc rather than hard-coding.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decompress"
harness = false
