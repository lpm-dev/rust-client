[package]
name = "lpm-extractor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tarball download, verification, decompression, and extraction for LPM"

[dependencies]
lpm-common = { workspace = true }
flate2 = { version = "1", features = ["zlib-rs"], default-features = false }
tar = "0.4"
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Used for the `O_NOFOLLOW` constant on the file-create path. The
# constant value differs per platform (Linux 0o400000, macOS 0o400),
# so we route through libc rather than hard-coding.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
