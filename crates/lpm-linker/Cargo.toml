[package]
name = "lpm-linker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "node_modules layout manager (symlink/hoist) for LPM"

[dependencies]
lpm-common = { workspace = true }
# Phase 66 Phase 4b: v2 linker (`src/v2.rs`) builds graph-keyed link
# entries via `lpm_store::v2::Store`. Confined to the v2 module — v1
# code paths don't import `lpm_store`.
lpm-store = { workspace = true }
lpm-workspace = { workspace = true }
pathdiff = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
flate2 = "1"
libc = "0.2"
tar = "0.4"
tempfile = "3"

[lints]
workspace = true
