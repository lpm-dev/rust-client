[package]
name = "lpm-env"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Environment variable schema validation for LPM — fail-fast before process spawn"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
regex-automata = { workspace = true }
url = "2"
# The Unicode properties `url` already links, for the emoji and script
# context that decides which characters in a value are text.
icu_properties = { version = "2.2", default-features = false, features = ["compiled_data"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Globalization"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
