[package]
name = "lpm-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Authentication, secure token storage, and lazy session management for the LPM Rust client"

[dependencies]
# Shared error type
lpm-common = { workspace = true }
lpm-http = { workspace = true }
lpm-workspace = { workspace = true }

# Secure storage primitives
keyring = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }

# Hashing (scoped account derivation, salt handling, refresh fingerprint)
sha2 = { workspace = true }
hex = { workspace = true }

# Token expiry timestamps
chrono = { workspace = true }

# Persistent token-expiry / OTP metadata
serde = { workspace = true }
serde_json = { workspace = true }

# SessionManager: HTTP client for silent refresh + secret-bearing token type
reqwest = { workspace = true }
secrecy = { workspace = true }

# SessionManager: single-flight refresh lock + async runtime hook
tokio = { workspace = true, features = ["sync"] }

# Diagnostics
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(all(target_os = "linux", any(target_arch = "aarch64", target_env = "musl")))'.dependencies]
keyring = { workspace = true, features = ["vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
core-foundation = "0.10"
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext"] }
security-framework = "3"

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[features]
acceptance-test-hooks = []

[lints]
workspace = true
