[package]
name = "lpm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI entry point for the LPM Rust client"

[[bin]]
name = "lpm-rs"
path = "src/main.rs"

[dependencies]
lpm-common = { workspace = true }
lpm-auth = { workspace = true }
lpm-env = { workspace = true }
lpm-global = { workspace = true }
lpm-semver = { workspace = true }
lpm-registry = { workspace = true }
lpm-extractor = { workspace = true }
lpm-resolver = { workspace = true }
dashmap = { workspace = true }
lpm-store = { workspace = true }
lpm-linker = { workspace = true }
lpm-lockfile = { workspace = true }
lpm-workspace = { workspace = true }
lpm-security = { workspace = true }
lpm-triage-advisor = { path = "../lpm-triage-advisor" }
async-trait = "0.1"
lpm-sandbox = { workspace = true }
lpm-runner = { workspace = true }
lpm-runtime = { workspace = true }
lpm-task = { workspace = true }
lpm-plugin = { workspace = true }
lpm-vault = { workspace = true }
lpm-cert = { workspace = true }
lpm-network = { workspace = true }
lpm-proxy = { workspace = true }
lpm-tunnel = { workspace = true }
lpm-inspect = { workspace = true }
lpm-dashboard = { workspace = true }
lpm-migrate = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shlex = { workspace = true }
miette = { workspace = true }
# `supports-colors` feature exposes `owo_colors::set_override` — the global
# gate for the `if_supports_color` API that the color policy uses to keep
# any future call site aligned with the explicit `--color` flag / NO_COLOR
# / FORCE_COLOR resolution.
owo-colors = { workspace = true, features = ["supports-colors"] }
indicatif = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Auth / secure storage
aes-gcm = { workspace = true }
scrypt = { workspace = true }
rand = { workspace = true }
dirs = { workspace = true }

# Interactive prompts & terminal UI
cliclack = { workspace = true }
crossterm = "0.29"
# `console` is cliclack's styling primitive — `cliclack::Theme` returns
# `console::Style` from its color hooks, so the no-color theme override
# needs a direct dep to construct an unstyled `Style::new()`. Pinned to the
# same 0.15.x line cliclack 0.3.x uses so the two `Style` types unify.
console = "0.16"
gag = "1"

# Browser open
open = { workspace = true }

# Hashing
sha1 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }

# Config
toml = { workspace = true }
toml_edit = { workspace = true }

# Tarball creation
tar = { workspace = true }
flate2 = { workspace = true }

# File collection
glob = { workspace = true }
pathdiff = { workspace = true }

# URL encoding
urlencoding = "2"

# Temp directories
tempfile = "3"

# Phase 32 Phase 6: `lpm patch` — unified diff generation + strict apply.
diffy = { workspace = true }

# Async utilities
futures = { workspace = true }

# Parallelism — W1: parallelize per-package post-install walk in
# `build_state::compute_blocked_packages_with_metadata`.
rayon = { workspace = true }

# Sigstore provenance (Phase C)
p256 = { workspace = true }
# p384 for the Fulcio root chain (Phase 1.3) — Fulcio roots are P-384.
p384 = { workspace = true }
ecdsa = { workspace = true }

# Phase 46 P4: x509 cert parsing for Sigstore attestation SAN extraction
# (identity-only, not full Sigstore verification — see plan §7.1 / D5).
x509-parser = "0.16"

# Typed errors for the C1 Sigstore verifier (`sigstore_verify.rs`).
# Matches the workspace-wide convention (`lpm_common::LpmError`).
thiserror = { workspace = true }

# Unix process group management (build.rs timeout kill)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
mimalloc = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
keyring = { workspace = true, features = ["vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "block2"] }

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
windows = { version = "0.62.2", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_WinRT",
] }
windows-future = "0.3.2"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "linux", target_os = "macos", target_os = "windows")))'.dependencies]
keyring = { workspace = true }

[features]
# Build with `--features dhat-heap` to instrument heap allocations.
# Outputs dhat-heap.json on exit — view at https://nnethercote.github.io/dh_view/dh_view.html
# Usage: cargo build -p lpm-cli --features dhat-heap
#        cd bench/fixture-large && ../../target/debug/lpm-rs install
dhat-heap = ["dep:dhat"]
# Disable mimalloc for comparison builds (e.g. benchmarking allocator impact).
# cargo build --release --features no-mimalloc
no-mimalloc = []
# Wire `tracing` spans to a Tracy collector so the install pipeline can be
# profiled per-function in the Tracy GUI. Off by default — zero runtime cost
# in normal builds. Build with `--features tracy` and run with the Tracy
# server attached on the default port.
#   cargo build --release -p lpm-cli --features tracy
#   tracy-capture -o profile.tracy &
#   ./target/release/lpm-rs install
tracy = ["dep:tracing-tracy"]
# Experimental metadata transport benchmark. Requires:
# RUSTFLAGS='--cfg reqwest_unstable' cargo build --release -p lpm-cli --features experimental-http3
experimental-http3 = ["lpm-registry/experimental-http3"]
# Internal loopback-only Sigstore seam for workflow tests.
internal-test-sigstore-mock = []

[dependencies.dhat]
version = "0.3"
optional = true

[dependencies.tracing-tracy]
version = "0.11"
optional = true

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
insta = { version = "1", features = ["json"] }

# Phase 46 P4 Chunk 2: generate synthetic x509 certs with URI SANs in
# unit tests so the SAN-extractor is exercised against deterministic
# inputs. Same version as lpm-cert already uses.
rcgen = { version = "0.13", features = ["pem"] }

# Schema corpus validation: load real lpm.config.json fixtures and
# validate them against the hand-authored schema so the schema cannot
# silently drift from the consumer code in `commands/add/`.
jsonschema = { version = "0.46", default-features = false }

[lints]
workspace = true
