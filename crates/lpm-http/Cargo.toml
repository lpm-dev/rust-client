[package]
name = "lpm-http"
description = "Shared outbound HTTP client policy for LPM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = { workspace = true }
bytes = "1"
futures = { workspace = true }
reqwest = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std"] }
tokio = { workspace = true }
webpki-root-certs = { workspace = true }

[dev-dependencies]
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
serde_json = { workspace = true }
syn = { version = "3", features = ["full", "visit"] }
tokio-rustls = "0.26"
wiremock = "0.6"

[lints]
workspace = true
