[package]
name = "lpm-tunnel"
description = "WebSocket tunnel client for exposing localhost to the internet via LPM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lpm-common = { workspace = true }
lpm-http = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-tungstenite = { version = "0.30", features = ["__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
webpki-root-certs = { workspace = true }
futures-util = "0.3"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
urlencoding = "2"
hex = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs", "x509-parser"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
