[package]
name = "lpm-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Plugin management for LPM — lazy-download external tool binaries"

[dependencies]
lpm-common = { workspace = true }
lpm-http = { workspace = true }
lpm-extractor = { path = "../lpm-extractor" }
lpm-runtime = { path = "../lpm-runtime" }
lpm-semver = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
filetime = { workspace = true }
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true }

[lints]
workspace = true
