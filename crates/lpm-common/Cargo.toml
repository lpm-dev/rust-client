[package]
name = "lpm-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types, errors, and constants for the LPM Rust client"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
subtle = "2"
base64 = { workspace = true }
miette = { workspace = true }
dirs = { workspace = true }
fd-lock = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
getrandom = "0.3"
glob = { workspace = true }
cap-fs-ext = { workspace = true }
cap-std = "4.0.2"
smallvec = "1"
open = { workspace = true }
shlex = { workspace = true }
unicode-normalization = "0.1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
] }

[features]
# SHA-256 in C and assembly, for the CLI's hashing; not for Windows, whose
# toolchain doesn't build it. Off where a build must come out byte for byte the
# same on every machine, as the vault app's engine must: that object code
# follows the local C compiler.
asm-sha2 = ["sha2/asm"]
# Test helpers other crates' tests use: macOS disk images.
test-support = []

[dev-dependencies]
lpm-env = { workspace = true }
static_assertions = "1"
tempfile = "3"

[lints]
workspace = true
