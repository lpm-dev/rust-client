[package]
name = "lpm-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Content-addressable package store for LPM"

[dependencies]
lpm-common = { workspace = true }
lpm-extractor = { workspace = true }
lpm-security = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
# Graph-key hashing for the v2 store layout (`src/v2/graph_key.rs`).
# ~3× faster than SHA-256 in microbenches and computed once per resolved
# package per install. Registry and trust-on-first-use content defaults to
# SHA-512; verified source declarations retain their exact SRI.
blake3 = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
subtle = "2"

[target.'cfg(unix)'.dependencies]
# Phase 66 Phase 4a: clonefile syscall on macOS for v2 link-entry
# population. Linux + Windows fall back to hardlink + copy.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
flate2 = "1"
tar = "0.4"
serde_json = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "store_paths"
harness = false

[lints]
workspace = true
