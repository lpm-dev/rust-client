[package]
name = "lpm-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP client for the LPM package registry"

[features]
experimental-http3 = ["reqwest/http3"]

[dependencies]
lpm-common = { workspace = true }
lpm-auth = { workspace = true }
lpm-http = { workspace = true }
lpm-semver = { workspace = true }
lpm-workspace = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
urlencoding = "2"
tracing = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
rmp-serde = { workspace = true }
filetime = { workspace = true }
secrecy = { workspace = true }
zeroize = "1"
dirs = { workspace = true }
futures = { workspace = true }
tempfile = "3"
p256 = { workspace = true }
time = { version = "0.3", features = ["parsing"] }
# Encrypted PKCS#8 private-key decryption + TTY passphrase prompt.
# See `tls_identity.rs` for the loader.
pkcs8 = { workspace = true }
rpassword = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
wiremock = "0.6"
rcgen = "0.13"
# Hand-rolled TLS test server for the cafile/strict-ssl integration matrix.
# Versions match the transitive deps reqwest brings in (tokio-rustls 0.26 /
# rustls 0.23) so we don't fork the trust-store impl.
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }

[lints]
workspace = true
