[package]
name = "lpm-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Script execution engine for LPM — PATH injection, pre/post hooks, exec, dlx"

[dependencies]
lpm-cert = { workspace = true }
lpm-common = { workspace = true }
lpm-env = { workspace = true }
lpm-workspace = { path = "../lpm-workspace" }
lpm-runtime = { path = "../lpm-runtime" }
lpm-vault = { path = "../lpm-vault" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
owo-colors = { workspace = true }
toml = { workspace = true }

parking_lot = { workspace = true }
fd-lock = { workspace = true }
oxc_allocator = "=0.128.0"
oxc_parser = "=0.128.0"
oxc_semantic = "=0.128.0"
oxc_transformer = "=0.128.0"
oxc_codegen = "=0.128.0"
oxc_span = "=0.128.0"
oxc_ast = "=0.128.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
dirs = { workspace = true }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
