[package]
name = "lpm-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Secure local secret storage for LPM projects"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }

# Encryption
aes-gcm = { workspace = true }
scrypt = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }

# P-256 ECDH (dashboard device pairing — Web Crypto only supports P-256, not X25519)
p256 = { workspace = true }
elliptic-curve = { workspace = true }

# Secure storage
keyring = { workspace = true }
hex = { workspace = true }

# HTTP (for sync)
reqwest = { workspace = true }
futures = { workspace = true }
urlencoding = "2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
keyring = { workspace = true, features = ["vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints]
workspace = true
