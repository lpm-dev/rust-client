[package]
name = "lpm-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Secure local secret storage for LPM projects"

[dependencies]
lpm-common = { workspace = true }
lpm-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
libc = "0.2"
cap-fs-ext = { workspace = true }
cap-std = "4.0.2"

# Encryption
aes-gcm = { workspace = true }
scrypt = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }

# P-256 ECDH (dashboard device pairing — Web Crypto only supports P-256, not X25519)
p256 = { workspace = true }
elliptic-curve = { workspace = true }

# Secure storage
keyring = { workspace = true }
hex = { workspace = true }

# HTTP (for sync)
reqwest = { workspace = true }
futures = { workspace = true }
urlencoding = "2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(all(target_os = "linux", any(target_arch = "aarch64", target_env = "musl")))'.dependencies]
keyring = { workspace = true, features = ["vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
keyring = { workspace = true, features = ["apple-native"] }
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = { version = "2", features = ["OSX_10_15"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
windows-sys = { version = "0.60", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[features]
acceptance-test-hooks = []
legacy-macos-keychain = []

[lints]
workspace = true
